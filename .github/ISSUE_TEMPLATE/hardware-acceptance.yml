name: K500 hardware acceptance
description: Record reproducible physical K500 qualification or regression evidence for an exact SonKuPik K500 commit.
title: "[Hardware] "
labels:
  - hardware-acceptance
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for tests performed on a physical K500. CI-only results are not hardware acceptance.

        **v1.0 qualified baseline:** Windows 10/11 x64 + USB HID. Bluetooth SPP remains experimental and must be qualified independently.

  - type: input
    id: version
    attributes:
      label: SonKuPik K500 version
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Exact commit SHA
      placeholder: 40-character Git commit SHA
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: K500 firmware / version
      placeholder: Device firmware/version shown by your hardware workflow
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - USB HID
        - Bluetooth SPP
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Acceptance / regression scope
      options:
        - Connect / reconnect / 939-byte hydration
        - LIVE controls / PEQ / crossover
        - Section navigation / runtime stability
        - Equipment Mode Recall / Use Init
        - Current-device permanent Save
        - PC preset Preview / controlled editing
        - Single PC preset Upload
        - Official + Local preset library / Sync
        - Mass Upload
        - Installer / portable package
        - Failure / recovery injection
        - Bluetooth qualification
        - Other hardware-facing regression
    validations:
      required: true

  - type: textarea
    id: procedure
    attributes:
      label: Exact test procedure
      description: Include source/destination slots, preset source/hash, changed controls, and operation order where relevant.
      placeholder: |
        1. Connect by USB...
        2. Select...
        3. Upload...
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Result
      description: State expected vs actual behavior, non-target preservation, reconnect result, and power-cycle result where relevant.
    validations:
      required: true

  - type: input
    id: evidence
    attributes:
      label: Support Report / trace / capture reference
      placeholder: Filename, issue attachment, capture ID, or commit-local evidence reference
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional observations
      description: Optional device/audio/UI observations that may help reproduce the result.

  - type: checkboxes
    id: declaration
    attributes:
      label: Evidence declaration
      options:
        - label: I tested this on a physical K500 using the exact version/commit and transport above.
          required: true
        - label: I checked non-target values/slots for unintended changes where applicable.
          required: true
        - label: I did not claim permanent persistence without reconnect/power-cycle evidence when persistence is part of this test.
          required: true
