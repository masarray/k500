name: K500 CI
run-name: K500-${{ inputs.ci_mode || 'fast' }}-${{ inputs.expected_sha || github.sha }}-${{ inputs.base_sha || 'auto' }}

# CI_CONSOLIDATED_PIPELINE_V1 / SMART_CI_SCOPE_V3
# PR/push: only fast, offline contracts; no Windows/Qt, Inno, Linux or macOS.
# The existing comment controller dispatches a pinned SHA/scope on demand.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_mode:
        description: "fast, smart (changed paths), windows, installer, platform, full"
        required: true
        default: smart
        type: choice
        options: [fast, smart, windows, installer, platform, full]
      expected_sha:
        description: "Exact source commit SHA, verified against current PR or main"
        required: true
        type: string
      base_sha:
        description: "Expected main base SHA for PR or previous main commit"
        required: true
        type: string
      pr_number:
        description: "0 for main, otherwise same-repository PR number"
        required: true
        default: "0"
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: k500-ci-${{ inputs.expected_sha || github.event.pull_request.number || github.ref }}-${{ inputs.ci_mode || 'fast' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: '6.10.2'

jobs:
  contracts:
    name: Fast contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_required: ${{ steps.scope.outputs.build_required }}
      installer_required: ${{ steps.scope.outputs.installer_required }}
      platform_required: ${{ steps.scope.outputs.platform_required }}
      promotion_required: ${{ steps.scope.outputs.promotion_required }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0

      - name: Verify requested SHA is still current (manual only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BASE: ${{ inputs.base_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid immutable target/base SHA" >&2; exit 1;
          }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || {
            echo "Checkout is not the authorized exact source SHA" >&2; exit 1;
          }
          if [[ "$PR_NUMBER" == "0" ]]; then
            current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            [[ "$current" == "$EXPECTED_SHA" ]] || {
              echo "main changed: comment again on the latest commit" >&2; exit 1;
            }
          else
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            [[ "$(jq -r '.state' <<< "$pr")" == "open" &&
               "$(jq -r '.head.repo.full_name' <<< "$pr")" == "$GITHUB_REPOSITORY" &&
               "$(jq -r '.base.ref' <<< "$pr")" == "main" &&
               "$(jq -r '.head.sha' <<< "$pr")" == "$EXPECTED_SHA" &&
               "$(jq -r '.base.sha' <<< "$pr")" == "$EXPECTED_BASE" ]] || {
              echo "PR, head SHA or base changed: reject stale testing" >&2; exit 1;
            }
          fi
          echo "PINNED SHA VERIFIED: $EXPECTED_SHA"

      - name: Compute CI scope
        id: scope
        env:
          CI_BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ inputs.expected_sha || github.sha }}
          CI_REQUEST_SCOPE: ${{ inputs.ci_mode || 'fast' }}
        run: python tools/ci/change_scope.py

      - name: Repository contracts
        run: python tools/ci/contracts.py

      - name: Stable Windows download routing regression (offline)
        # Pure Node fetch mock, no GitHub token, packages, Qt or extra workflow.
        run: node tools/ci/test_download_route.js

      - name: Verified ZIP packaging regression (offline)
        run: python3 tools/release/test_package_windows_zip.py

      - name: Linux tar package listing regression (offline)
        run: bash tools/ci/test_linux_package_listing.sh

      - name: Simple filename release integrity regression (offline)
        run: python3 tools/release/test_package_short_downloads.py

      - name: Landing no-text-flicker regression (offline)
        run: node tools/release/test_landing_no_flicker.js

      - name: Mass Upload offline guard regression (offline)
        # Executes real QML upload function with mocks; zero USB and no build.
        run: node tools/ci/test_mass_upload_offline.js

      - name: Preset lab syntax
        run: python -m py_compile tools/k500_preset_lab.py

      - name: Comment command and CI scope policy tests (offline)
        run: python -m unittest discover -s tests -p 'test_ci_comment*.py'

  windows:
    name: Windows build + regression
    needs: contracts
    if: needs.contracts.outputs.build_required == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha || github.sha }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Release build
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl

      - name: Build once
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run consolidated Windows regression suite
        shell: pwsh
        run: ./tools/ci/windows_test_suite.ps1 -BuildDir build -PackageDir package

      - name: Upload runnable validation build
        # PR runs validate GitHub's integration/merge ref; main/manual runs use
        # an exact repository commit. Keep PR artifacts short-lived but available
        # for final GUI/QRIS inspection before merge.
        uses: actions/upload-artifact@v4
        with:
          name: SonKuPik-K500-${{ inputs.expected_sha || github.sha }}-Windows
          path: package
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 7 }}


  installer:
    name: Installer smoke (changed paths only)
    needs: contracts
    if: needs.contracts.outputs.installer_required == 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha || github.sha }}

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile and smoke-test installer lifecycle
        shell: pwsh
        run: ./tools/ci/installer_smoke.ps1


  # SMART_STABLE_PROMOTION_GATE_V1 is now owner-comment-only.
  # No automatic stable release on a push, even for an accepted gate document.

  cross-platform:
    name: Native platform — ${{ matrix.platform }}
    needs: contracts
    if: needs.contracts.outputs.platform_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            artifact: SonKuPik-K500-native-Linux-x86_64.tar.gz
          - os: macos-15
            platform: macos
            artifact: SonKuPik-K500-native-macOS-arm64.dmg
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - name: Install OS transport dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y ninja-build libhidapi-dev libudev-dev libgl1 libxkbcommon-x11-0 libxcb-cursor0
          else
            brew install hidapi ninja
          fi
      - name: Install Qt 6 including SerialPort
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          modules: 'qtserialport'
          cache: true
      - name: Build native app and protocol tests once
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-platform -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-platform --target sonkupik_studio_native k500_protocol_selftest k500_p1_state_selftest --parallel 3
          ./build-platform/k500_protocol_selftest
          ./build-platform/k500_p1_state_selftest
      - name: Install Qt QML runtime, package and checksum
        env:
          SOURCE_SHA: ${{ inputs.expected_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cmake --install build-platform --prefix "$PWD/stage"
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            app="$(find "$PWD/stage" -maxdepth 2 -name '*.app' -type d -print -quit)"
            test -n "$app"
            exe="$app/Contents/MacOS/SONKUPIK-STUDIO-Native-UI"
            test -x "$exe"
            linked="$(otool -L "$exe" | awk '/libhidapi/{print $1;exit}')"
            if [[ -n "$linked" ]]; then
              mkdir -p "$app/Contents/Frameworks"
              lib="$(brew --prefix hidapi)/lib/$(basename "$linked")"
              test -f "$lib"
              cp -L "$lib" "$app/Contents/Frameworks/$(basename "$linked")"
              install_name_tool -change "$linked" "@executable_path/../Frameworks/$(basename "$linked")" "$exe"
            fi
            codesign --force --deep --sign - "$app"
            hdiutil create -quiet -ov -format UDZO -volname "SonKuPik K500" \
              -srcfolder "$app" "dist/${{ matrix.artifact }}"
            hdiutil verify "dist/${{ matrix.artifact }}"
          else
            exe="$PWD/stage/bin/SONKUPIK-STUDIO-Native-UI"
            test -x "$exe"
            test -f "$PWD/stage/bin/qt.conf"
            printf '#!/bin/sh\nHERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"\nexec "$HERE/bin/SONKUPIK-STUDIO-Native-UI" "$@"\n' > "$PWD/stage/run-sonkupik-k500"
            chmod +x "$PWD/stage/run-sonkupik-k500"
            tar -czf "dist/${{ matrix.artifact }}" -C stage .
            # Drain the entire tar listing: grep -q closes early and sends SIGPIPE
            # to tar under pipefail, falsely failing a valid Linux package.
            tar -tzf "dist/${{ matrix.artifact }}" | grep -Fx './run-sonkupik-k500' >/dev/null
          fi
          test -s "dist/${{ matrix.artifact }}"
          (cd dist && shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256")
          printf 'source_commit=%s\nos=${{ matrix.platform }}\nqt=6.10.2\nhardware_test=not_yet_physically_qualified\n' \
            "$SOURCE_SHA" > "dist/${{ matrix.artifact }}.provenance.txt"
      # PATCH_115_NO_STALE_RELEASE_MUTATION_V1: a source push must never
      # upload new binary bytes into the immutable v1.1.4 public release.
      # Keep native packages as short-lived QA evidence only.
      - name: Upload native platform QA evidence (not a stable release)
        uses: actions/upload-artifact@v4
        with:
          name: SonKuPik-K500-${{ matrix.platform }}-${{ inputs.expected_sha || github.sha }}-QA
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
            dist/${{ matrix.artifact }}.provenance.txt
          if-no-files-found: error
          retention-days: 5
