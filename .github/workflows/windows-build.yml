name: Qt Windows Build

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard PEQ interaction parity
        shell: pwsh
        run: |
          $qml = Get-Content "qml/components/SectionEqGraph.qml" -Raw
          $required = @(
            "PEQ_INTERACTION_PARITY_V1",
            "WheelHandler",
            "Qt.ShiftModifier",
            "Qt.ControlModifier",
            "Qt.MetaModifier",
            "Math.exp(-qDy*(fine?0.003:0.012))",
            "onDoubleClicked",
            "setSelectedGain(0)"
          )
          foreach ($token in $required) {
            if (-not $qml.Contains($token)) {
              throw "PEQ interaction parity regression: missing '$token'"
            }
          }

      - name: Guard fader interaction parity
        shell: pwsh
        run: |
          $fader = Get-Content "qml/components/StudioFader.qml" -Raw
          $master = Get-Content "qml/components/MasterStripPanel.qml" -Raw
          $required = @(
            "FADER_INTERACTION_PARITY_V1",
            "signal activated()",
            "preventStealing: true",
            "dragRawValue",
            "sensitivity=fine?0.20:1.0",
            "onWheel:function(e)",
            "Qt.ShiftModifier",
            "enabled: !root.dragging"
          )
          foreach ($token in $required) {
            if (-not $fader.Contains($token)) {
              throw "Fader interaction regression: missing '$token'"
            }
          }
          if ($master.Contains('value:root.engine.masterMusic') -or
              $master.Contains('value:root.engine.masterMic') -or
              $master.Contains('value:root.engine.masterFx')) {
            throw "Master Strip regression: live engine values must not be embedded in Repeater.model"
          }
          if (-not $master.Contains('readonly property real liveValue')) {
            throw "Master Strip regression: stable liveValue binding is missing"
          }

      - name: Guard control caption awareness
        shell: pwsh
        run: |
          $knob = Get-Content "qml/components/StudioKnob.qml" -Raw
          $slider = Get-Content "qml/components/ParameterSlider.qml" -Raw
          $rack = Get-Content "qml/components/RackFaderPanel.qml" -Raw
          $master = Get-Content "qml/components/MasterStripPanel.qml" -Raw
          $input = Get-Content "qml/components/InputFader.qml" -Raw
          $system = Get-Content "qml/components/SystemWorkspace.qml" -Raw
          $requiredCore = @(
            "CONTROL_CAPTION_AWARENESS_V1",
            "readonly property bool highlighted",
            "Text.Outline",
            "styleColor"
          )
          foreach ($token in $requiredCore) {
            if (-not $knob.Contains($token)) { throw "Knob caption awareness regression: missing '$token'" }
            if (-not $slider.Contains($token)) { throw "Slider caption awareness regression: missing '$token'" }
          }
          if (-not $rack.Contains('rackFader.highlighted')) { throw "Rack fader caption awareness regression" }
          if (-not $master.Contains('masterFader.highlighted')) { throw "Master fader caption awareness regression" }
          if (-not $input.Contains('contextHighlighted: inputFader.highlighted')) { throw "Input fader caption awareness regression" }
          if (-not $system.Contains('recFader.highlighted') -or -not $system.Contains('triggerFader.highlighted')) {
            throw "System direct fader caption awareness regression"
          }

      - name: Guard single embedded typography family
        shell: pwsh
        run: |
          $theme = Get-Content "qml/theme/Theme.qml" -Raw
          $main = Get-Content "src/main.cpp" -Raw
          $cmake = Get-Content "CMakeLists.txt" -Raw
          $fontFiles = @(
            "resources/fonts/PlusJakartaSans-Regular.ttf",
            "resources/fonts/PlusJakartaSans-Medium.ttf",
            "resources/fonts/PlusJakartaSans-SemiBold.ttf",
            "resources/fonts/PlusJakartaSans-Bold.ttf",
            "resources/fonts/OFL-PlusJakartaSans.txt"
          )
          foreach ($fontFile in $fontFiles) {
            if (-not (Test-Path $fontFile)) { throw "Embedded typography regression: missing $fontFile" }
          }
          if (-not $theme.Contains('TYPOGRAPHY_SINGLE_FAMILY_V1')) { throw "Typography guard marker missing" }
          if (($theme | Select-String -Pattern 'Plus Jakarta Sans' -AllMatches).Matches.Count -lt 3) {
            throw "Theme typography aliases are not all Plus Jakarta Sans"
          }
          if (-not $main.Contains('QFontDatabase::addApplicationFont')) { throw "Embedded font registration missing" }
          if (-not $cmake.Contains('PlusJakartaSans-Regular.ttf') -or -not $cmake.Contains('embedded_fonts')) {
            throw "Qt resource font bundle missing"
          }
          $legacy = Get-ChildItem qml,src -Recurse -File | Where-Object { $_.Extension -in '.qml','.cpp','.h' } | Select-String -Pattern 'Segoe UI Variable|Cascadia Mono'
          if ($legacy) {
            $legacy | ForEach-Object { Write-Host $_ }
            throw "Legacy font family reference remains"
          }

      - name: Guard P0 regression fortress
        shell: pwsh
        run: |
          $requiredDocs = @(
            'docs/PORTING_PARITY_MATRIX.md',
            'docs/PROTOCOL_GOLDEN_VECTORS.md',
            'docs/HARDWARE_ACCEPTANCE_CHECKLIST.md'
          )
          foreach ($path in $requiredDocs) {
            if (-not (Test-Path $path)) { throw "P0 regression: missing $path" }
          }

          $matrix = Get-Content 'docs/PORTING_PARITY_MATRIX.md' -Raw
          $main = Get-Content 'src/main.cpp' -Raw
          $protocol = Get-Content 'src/k500/K500Protocol.cpp' -Raw
          $manager = Get-Content 'src/k500/K500DeviceManager.cpp' -Raw
          $controller = Get-Content 'src/k500/K500Controller.cpp' -Raw

          foreach ($token in @('P0 non-negotiable invariants','0x03AB','hydration must emit **zero**','unsupportedPath')) {
            if (-not $matrix.Contains($token)) { throw "P0 parity contract regression: missing '$token'" }
          }
          foreach ($token in @('P0_NATIVE_ARCHITECTURE_V1','P0_FULL_MEMORY_HYDRATION_V1','hydrationEdits == 0','K500DeviceManager::activeMemoryReady','StudioEngine::hydrateFromDeviceMemory')) {
            if (-not $main.Contains($token)) { throw "P0 engine/architecture regression: missing '$token'" }
          }
          foreach ($token in @('P0_PROTOCOL_GOLDEN_VECTORS_V1','Bluetooth final read-block','USB final read-block','top music mirrored scalar')) {
            if (-not $protocol.Contains($token)) { throw "P0 protocol regression: missing '$token'" }
          }
          foreach ($token in @('ActiveMemorySize = 0x03AB','ActiveMemoryBlockSize = 0x003A','ActiveMemoryInterBlockMs = 35','emit activeMemoryReady(m_activeMemory);','setLiveEnabled(true);')) {
            if (-not $manager.Contains($token)) { throw "P0 device sync regression: missing '$token'" }
          }
          $hydratePos = $manager.IndexOf('emit activeMemoryReady(m_activeMemory);')
          $livePos = $manager.IndexOf('setLiveEnabled(true);')
          if ($hydratePos -lt 0 -or $livePos -lt 0 -or $hydratePos -ge $livePos) {
            throw 'P0 device sync regression: LIVE must be enabled only after full-memory hydration is emitted'
          }
          if (-not $controller.Contains('emit unsupportedPath(path);')) {
            throw 'P0 safety regression: unsupported paths must remain non-destructive'
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/SONKUPIK-STUDIO-Native-UI.exe package/
          windeployqt --release --qmldir qml package/SONKUPIK-STUDIO-Native-UI.exe

      - name: Embedded font self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "package/SONKUPIK-STUDIO-Native-UI.exe" -ArgumentList "--font-self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Embedded Plus Jakarta Sans self-test failed with exit code $($p.ExitCode)" }

      - name: K500 protocol and RX parser self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "package/SONKUPIK-STUDIO-Native-UI.exe" -ArgumentList "--protocol-self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "K500 protocol/RX parser self-test failed with exit code $($p.ExitCode)" }

      - name: StudioEngine self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "package/SONKUPIK-STUDIO-Native-UI.exe" -ArgumentList "--engine-self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "StudioEngine self-test failed with exit code $($p.ExitCode)" }

      - name: Upload runnable build
        uses: actions/upload-artifact@v4
        with:
          name: SONKUPIK-STUDIO-Qt-Windows
          path: package
          if-no-files-found: error
