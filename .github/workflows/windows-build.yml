name: K500 CI

# CI_CONSOLIDATED_PIPELINE_V1
# SMART_CI_SCOPE_V2 — no unnecessary main-push Windows builds or ZIP jobs.
# One PR/main workflow, one Windows build, many tests. Regressions belong in
# executable tests or tools/ci/contracts.py, not new per-feature workflows.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k500-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: '6.10.2'

jobs:
  contracts:
    name: Fast contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_required: ${{ steps.scope.outputs.build_required }}
      installer_required: ${{ steps.scope.outputs.installer_required }}
      platform_required: ${{ steps.scope.outputs.platform_required }}
      promotion_required: ${{ steps.scope.outputs.promotion_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute CI scope
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/ci/change_scope.py

      - name: Repository contracts
        run: python tools/ci/contracts.py

      - name: Stable Windows download routing regression (offline)
        # Pure Node fetch mock, no GitHub token, packages, Qt or extra workflow.
        run: node tools/ci/test_download_route.js

      - name: Verified ZIP packaging regression (offline)
        run: python3 tools/release/test_package_windows_zip.py

      - name: Simple filename release integrity regression (offline)
        run: python3 tools/release/test_package_short_downloads.py

      - name: Landing no-text-flicker regression (offline)
        run: node tools/release/test_landing_no_flicker.js

      - name: Mass Upload offline guard regression (offline)
        # Executes real QML upload function with mocks; zero USB and no build.
        run: node tools/ci/test_mass_upload_offline.js

      - name: Preset lab syntax
        run: python -m py_compile tools/k500_preset_lab.py

  windows:
    name: Windows build + regression
    needs: contracts
    if: needs.contracts.outputs.build_required == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Release build
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl

      - name: Build once
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run consolidated Windows regression suite
        shell: pwsh
        run: ./tools/ci/windows_test_suite.ps1 -BuildDir build -PackageDir package

      - name: Upload runnable validation build
        # PR runs validate GitHub's integration/merge ref; main/manual runs use
        # an exact repository commit. Keep PR artifacts short-lived but available
        # for final GUI/QRIS inspection before merge.
        uses: actions/upload-artifact@v4
        with:
          name: SonKuPik-K500-${{ github.sha }}-Windows
          path: package
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 7 }}


  installer:
    name: Installer smoke (changed paths only)
    needs: contracts
    if: needs.contracts.outputs.installer_required == 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile and smoke-test installer lifecycle
        shell: pwsh
        run: ./tools/ci/installer_smoke.ps1


  promote-approved-rc:
    # SMART_STABLE_PROMOTION_GATE_V1: same K500 CI run, not a second
    # automatic workflow. On acceptance-only commits, Windows and installer
    # jobs are skipped; the immutable RC is promoted without recompilation.
    name: Promote owner-accepted RC (no rebuild)
    needs: [contracts, windows, installer]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.contracts.result == 'success' &&
      needs.contracts.outputs.promotion_required == 'true' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.installer.result == 'success' || needs.installer.result == 'skipped')
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/windows-updater-promote.yml

  cross-platform:
    name: Native platform — ${{ matrix.platform }}
    needs: contracts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.contracts.outputs.platform_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            artifact: SonKuPik-K500-native-Linux-x86_64.tar.gz
          - os: macos-15
            platform: macos
            artifact: SonKuPik-K500-native-macOS-arm64.dmg
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install OS transport dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y ninja-build libhidapi-dev libudev-dev libgl1 libxkbcommon-x11-0 libxcb-cursor0
          else
            brew install hidapi ninja
          fi
      - name: Install Qt 6 including SerialPort
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          modules: 'qtserialport'
          cache: true
      - name: Build native app and protocol tests once
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-platform -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-platform --target sonkupik_studio_native k500_protocol_selftest k500_p1_state_selftest --parallel 3
          ./build-platform/k500_protocol_selftest
          ./build-platform/k500_p1_state_selftest
      - name: Install Qt QML runtime, package and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cmake --install build-platform --prefix "$PWD/stage"
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            app="$(find "$PWD/stage" -maxdepth 2 -name '*.app' -type d -print -quit)"
            test -n "$app"
            exe="$app/Contents/MacOS/SONKUPIK-STUDIO-Native-UI"
            test -x "$exe"
            linked="$(otool -L "$exe" | awk '/libhidapi/{print $1;exit}')"
            if [[ -n "$linked" ]]; then
              mkdir -p "$app/Contents/Frameworks"
              lib="$(brew --prefix hidapi)/lib/$(basename "$linked")"
              test -f "$lib"
              cp -L "$lib" "$app/Contents/Frameworks/$(basename "$linked")"
              install_name_tool -change "$linked" "@executable_path/../Frameworks/$(basename "$linked")" "$exe"
            fi
            codesign --force --deep --sign - "$app"
            hdiutil create -quiet -ov -format UDZO -volname "SonKuPik K500" \
              -srcfolder "$app" "dist/${{ matrix.artifact }}"
            hdiutil verify "dist/${{ matrix.artifact }}"
          else
            exe="$PWD/stage/bin/SONKUPIK-STUDIO-Native-UI"
            test -x "$exe"
            test -f "$PWD/stage/bin/qt.conf"
            printf '#!/bin/sh\nHERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"\nexec "$HERE/bin/SONKUPIK-STUDIO-Native-UI" "$@"\n' > "$PWD/stage/run-sonkupik-k500"
            chmod +x "$PWD/stage/run-sonkupik-k500"
            tar -czf "dist/${{ matrix.artifact }}" -C stage .
            tar -tzf "dist/${{ matrix.artifact }}" | grep -q './run-sonkupik-k500'
          fi
          test -s "dist/${{ matrix.artifact }}"
          (cd dist && shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256")
          printf 'source_commit=%s\nos=${{ matrix.platform }}\nqt=6.10.2\nhardware_test=not_yet_physically_qualified\n' \
            "$GITHUB_SHA" > "dist/${{ matrix.artifact }}.provenance.txt"
      # PATCH_115_NO_STALE_RELEASE_MUTATION_V1: a source push must never
      # upload new binary bytes into the immutable v1.1.4 public release.
      # Keep native packages as short-lived QA evidence only.
      - name: Upload native platform QA evidence (not a stable release)
        uses: actions/upload-artifact@v4
        with:
          name: SonKuPik-K500-${{ matrix.platform }}-${{ github.sha }}-QA
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
            dist/${{ matrix.artifact }}.provenance.txt
          if-no-files-found: error
          retention-days: 5
