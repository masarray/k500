name: K500 CI

# CI_CONSOLIDATED_PIPELINE_V1
# One PR/main workflow, one Windows build, many tests. Regressions belong in
# executable tests or tools/ci/contracts.py, not new per-feature workflows.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: k500-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: '6.10.2'

jobs:
  contracts:
    name: Fast contracts
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_required: ${{ steps.scope.outputs.build_required }}
      installer_required: ${{ steps.scope.outputs.installer_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute CI scope
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/ci/change_scope.py

      - name: Repository contracts
        run: python tools/ci/contracts.py

      - name: Stable Windows download routing regression (offline)
        # Pure Node fetch mock, no GitHub token, packages, Qt or extra workflow.
        run: node tools/ci/test_download_route.js

      - name: Verified ZIP packaging regression (offline)
        run: python3 tools/release/test_package_windows_zip.py

      - name: Simple filename release integrity regression (offline)
        run: python3 tools/release/test_package_short_downloads.py

      - name: Mass Upload offline guard regression (offline)
        # Executes real QML upload function with mocks; zero USB and no build.
        run: node tools/ci/test_mass_upload_offline.js

      - name: Preset lab syntax
        run: python -m py_compile tools/k500_preset_lab.py

  windows:
    name: Windows build + regression
    needs: contracts
    if: needs.contracts.outputs.build_required == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Release build
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl

      - name: Build once
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run consolidated Windows regression suite
        shell: pwsh
        run: ./tools/ci/windows_test_suite.ps1 -BuildDir build -PackageDir package

      - name: Upload runnable validation build
        # PR runs validate GitHub's integration/merge ref; main/manual runs use
        # an exact repository commit. Keep PR artifacts short-lived but available
        # for final GUI/QRIS inspection before merge.
        uses: actions/upload-artifact@v4
        with:
          name: SonKuPik-K500-${{ github.sha }}-Windows
          path: package
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 7 }}


  installer:
    name: Installer smoke (changed paths only)
    needs: contracts
    if: needs.contracts.outputs.installer_required == 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile and smoke-test installer lifecycle
        shell: pwsh
        run: ./tools/ci/installer_smoke.ps1


  zip-release:
    name: Package verified stable ZIP (no rebuild)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && github.event.action == 'published' &&
       !github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    concurrency:
      group: k500-stable-zip-upload
      cancel-in-progress: false
    steps:
      - name: Checkout packaging script
        uses: actions/checkout@v4

      - name: Verify official release, package and upload ZIP once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$PUBLISHED_TAG"
          else
            tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          fi
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'No qualified stable semver release'; exit 1; }
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          [[ "$(jq -r '.draft' <<< "$release")" == "false" &&
             "$(jq -r '.prerelease' <<< "$release")" == "false" ]] || { echo 'Refusing draft/prerelease'; exit 1; }
          short_exe="SonkuPik-k500-setup.exe"
          short_zip="SonkuPik-k500-setup.zip"
          installer="SonKuPik-K500-$tag-Windows-Smart-Installer.exe"
          # Idempotent. Keep existing immutable release assets and resumable partial uploads.
          all_present=true
          for name in "$short_exe" "$short_exe.sha256" "$short_zip" "$short_zip.sha256"; do
            if ! jq -e --arg name "$name" '.assets[] | select(.name == $name and .state == "uploaded" and .size > 0)' <<< "$release" >/dev/null; then
              all_present=false
              break
            fi
          done
          if [[ "$all_present" == "true" ]]; then
            echo "Short EXE, ZIP and both checksums already uploaded; no work needed"
            exit 0
          fi
          jq -e --arg file "$installer" '.assets[] | select(.name == $file and .state == "uploaded" and .size > 0)' <<< "$release" >/dev/null || {
            echo 'No stable Smart Installer to verify; refusing alias publishing'
            exit 1
          }
          mkdir -p original dist
          gh release download "$tag" --dir original --pattern "$installer" --repo "$GITHUB_REPOSITORY"
          gh release download "$tag" --dir original --pattern "SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY"
          python3 tools/release/package_short_downloads.py \
            --tag "$tag" \
            --installer "original/$installer" \
            --sums "original/SHA256SUMS.txt" \
            --output-dir dist
          # Upload missing files only. Existing EXE, ZIP, and checksum assets are never clobbered.
          for asset in "$short_exe" "$short_exe.sha256" "$short_zip" "$short_zip.sha256"; do
            if jq -e --arg name "$asset" '.assets[] | select(.name == $name and .state == "uploaded")' <<< "$release" >/dev/null; then
              echo "Preserving existing asset: $asset"
            else
              gh release upload "$tag" "dist/$asset" --repo "$GITHUB_REPOSITORY"
              echo "Uploaded $asset"
            fi
          done
          echo "Published verified short-name EXE and ZIP for $tag"
