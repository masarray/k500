name: Generate optimized landing assets

on:
  push:
    branches:
      - feat/site-favicon-webp
    paths:
      - site/.asset-build-trigger

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate and wire optimized site assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          site = root / 'site'
          (site / 'assets').mkdir(parents=True, exist_ok=True)

          # Build favicon assets from the official SonKuPik K500 logo.
          logo = Image.open(root / 'assets' / 'SonKuPik-k500-logo.png').convert('RGBA')
          bbox = logo.getbbox()
          if bbox:
              logo = logo.crop(bbox)

          side = max(logo.size)
          margin = max(1, round(side * 0.08))
          canvas_side = side + margin * 2
          square = Image.new('RGBA', (canvas_side, canvas_side), (0, 0, 0, 0))
          square.alpha_composite(logo, ((canvas_side - logo.width) // 2, (canvas_side - logo.height) // 2))

          icon_256 = square.resize((256, 256), Image.Resampling.LANCZOS)
          icon_256.save(
              site / 'favicon.ico',
              format='ICO',
              sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)],
          )
          square.resize((32, 32), Image.Resampling.LANCZOS).save(site / 'favicon-32x32.png', optimize=True)
          square.resize((180, 180), Image.Resampling.LANCZOS).save(site / 'apple-touch-icon.png', optimize=True)

          # Convert the physical K500 product image to an optimized local WebP asset.
          device = Image.open(root / 'assets' / 'k500 screenshot' / 'Ktv-device.png')
          if device.width > 1400:
              new_h = round(device.height * 1400 / device.width)
              device = device.resize((1400, new_h), Image.Resampling.LANCZOS)
          if device.mode not in ('RGB', 'RGBA'):
              device = device.convert('RGBA' if 'transparency' in device.info else 'RGB')
          device.save(site / 'assets' / 'k500-device.webp', format='WEBP', quality=84, method=6)

          # Wire the generated assets into the landing page.
          index_path = site / 'index.html'
          html = index_path.read_text(encoding='utf-8')
          html = html.replace(
              '<link rel="icon" href="favicon.svg" type="image/svg+xml">',
              '<link rel="icon" href="favicon.ico" sizes="any">\n'
              '  <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">\n'
              '  <link rel="apple-touch-icon" href="apple-touch-icon.png">',
          )
          html = html.replace(
              '<img src="https://raw.githubusercontent.com/masarray/k500/main/assets/k500%20screenshot/Ktv-device.png" alt="K500 karaoke processor device">',
              '<img src="assets/k500-device.webp" alt="K500 karaoke processor device" loading="eager" decoding="async">',
          )
          index_path.write_text(html, encoding='utf-8')

          # Remove the old synthetic SVG favicon and temporary automation from the final branch.
          for temporary in (
              site / 'favicon.svg',
              site / '.asset-build-trigger',
              root / '.github' / 'workflows' / 'site-assets-temp.yml',
          ):
              if temporary.exists():
                  temporary.unlink()

          print(f'favicon.ico: {(site / "favicon.ico").stat().st_size} bytes')
          print(f'favicon-32x32.png: {(site / "favicon-32x32.png").stat().st_size} bytes')
          print(f'apple-touch-icon.png: {(site / "apple-touch-icon.png").stat().st_size} bytes')
          print(f'k500-device.webp: {(site / "assets" / "k500-device.webp").stat().st_size} bytes')
          PY

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site .github/workflows/site-assets-temp.yml
          git commit -m "perf(site): optimize favicon and K500 device image"
          git push origin HEAD:${GITHUB_REF_NAME}
