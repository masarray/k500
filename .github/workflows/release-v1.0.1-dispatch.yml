name: Dispatch public stable v1.0.1

# One-shot release bridge. It only fires when this file itself lands on main,
# then dispatches the hardened Windows Stable Release publisher already used
# for public releases. Future main pushes do not retrigger it unless this file
# is intentionally changed again.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.0.1-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-stable-publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        shell: bash
        run: |
          grep -F 'project(SonkupikStudioNative VERSION 1.0.1 LANGUAGES CXX)' CMakeLists.txt

      - name: Dispatch hardened stable publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run windows-stable-release.yml --ref main
          echo 'Dispatched Windows Stable Release for v1.0.1 on main.'
