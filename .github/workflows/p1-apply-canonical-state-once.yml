name: P1 apply canonical state once

on:
  push:
    branches:
      - architecture/p1-canonical-device-state

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/p1-canonical-device-state
          fetch-depth: 0
      - name: Apply P1 canonical-state integration
        run: python3 .github/scripts/p1_integrate.py
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/k500/K500Controller.h src/k500/K500Controller.cpp src/k500/K500DeviceManager.h src/k500/K500DeviceManager.cpp
          if git diff --cached --quiet; then
            echo "No source integration changes required"
            exit 0
          fi
          git commit -m "P1: integrate canonical device state into native transport"
          git push origin HEAD:architecture/p1-canonical-device-state
