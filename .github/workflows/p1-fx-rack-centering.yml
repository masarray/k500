name: Guard premium FX space panel

on:
  pull_request:
    paths:
      - 'qml/components/RackFaderPanel.qml'
      - 'qml/components/SectionWorkspace.qml'
      - 'qml/components/StudioKnob.qml'
      - '.github/workflows/p1-fx-rack-centering.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  premium-fx-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard premium FX layout and lightweight visual field
        shell: python
        run: |
          from pathlib import Path

          rack = Path('qml/components/RackFaderPanel.qml').read_text(encoding='utf-8')
          workspace = Path('qml/components/SectionWorkspace.qml').read_text(encoding='utf-8')
          knob = Path('qml/components/StudioKnob.qml').read_text(encoding='utf-8')

          echo_direct_live = '{label:"DIRECT",value:Number(root.nestedValue("effects","echo","direct",100)),from:0,to:100,step:1,unit:"%",decimals:0}'
          echo_repeat_live = '{label:"REPEAT",value:Number(root.nestedValue("effects","echo","repeat",2)),from:0,to:10,step:1,unit:"",decimals:0}'

          checks = {
              'premium FX contract token': 'PREMIUM_FX_SPACE_PANEL_V1' in rack,
              'Reverb and Echo share the FX surface': 'title === "Reverb" || title === "Echo"' in rack,
              'premium FX knobs remain parameter-driven': 'premium: true' in rack and 'model: root.channels' in rack,
              'captured Reverb DIRECT is the fourth matching knob': 'REVERB_DIRECT_KNOB_NATIVE_V2' in rack and 'REVERB_DIRECT_KNOB_NATIVE_V2' in workspace and '{label:"DIRECT",value:Number(root.nestedValue("effects","reverb","direct",100))' in workspace and 'id: reverbDirectFader' not in rack,
              'captured Echo four knobs are native and live': 'ECHO_CMD0D_LIVE_BRIDGE_V2' in rack and 'ECHO_CMD0D_CAPTURED_V2' in workspace and 'return "effects.echo.direct"' in rack and 'return "effects.echo.repeat"' in rack and 'return "effects.echo.leftDelayMs"' in rack and echo_direct_live in workspace and echo_repeat_live in workspace,
              'four-control FX pages share geometry': 'FX_FOUR_KNOB_GEOMETRY_V1' in rack and 'root.fourControlFx ? 392 : 318' in rack,
              'prepared FX controls can be visibly disabled': 'channelEditable' in rack and 'enabled: fxChannel.channelEditable' in rack,
              'reverb semantic field exists': '"REVERB FIELD"' in rack and '"SPACE DESIGN"' in rack,
              'echo semantic field exists': '"ECHO FIELD"' in rack and '"TIME DESIGN"' in rack,
              'visual is explicitly parameter response': '"PARAMETER RESPONSE"' in rack,
              'zero level hard-hides the response field': 'FX_FIELD_ZERO_LEVEL_HIDE_V2' in rack and 'readonly property bool fxVisualActive: root.fxVisual0 > 0.0001' in rack and 'visible: root.fxVisualActive' in rack,
              'field bottom aligns to master caption baseline': 'FX_FIELD_MASTER_CAPTION_BASELINE_V3' in rack and 'anchors.topMargin: 4' in rack and 'height: 220' in rack,
              'decay strongly maps to stage width density and tail': 'REVERB_DECAY_PREDELAY_MAPPING_V3' in rack and 'readonly property int ringCount: 2 + Math.round(decayNorm * 6)' in rack and 'readonly property int particleCount: 4 + Math.round(decayNorm * 10)' in rack and 'width * (.38 + decayShape * .54)' in rack,
              'pre-delay creates a visible dry to bloom gap': 'id: drySource' in rack and 'readonly property real preGap: 4 + preNorm * 76' in rack and 'id: preDelayGuide' in rack and 'id: reverbBloom' in rack,
              'reverb header exposes PRE readout': '"PRE  " + Math.round(root.fxVisual2) + " ms"' in rack,
              'echo uses stationary tap tail': 'STATIC_ECHO_TAIL_V2' in rack and 'id: echoTrain' in rack and 'echoSweep' not in rack and 'NumberAnimation on x' not in rack,
              'visual edits do not invent a new transport': 'root.dispatchLive(fxChannel.modelData.label,v)' in rack,
              'non-FX sections retain canonical faders': 'StudioFader {' in rack and 'visible: !root.compactCluster' in rack,
              'FX field avoids continuously repainted Canvas': 'Canvas {' not in rack,
              'premium knob is opt-in': 'property bool premium: false' in knob and 'PREMIUM_FX_KNOB_V1' in knob,
              'premium knob preserves canonical edit signal': 'signal valueEdited(real newValue)' in knob,
          }

          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + '  ' + name)
          if failed:
              raise SystemExit('Premium FX space guard failed: ' + ', '.join(failed))
          print('ALL PREMIUM FX SPACE PANEL GUARDS PASSED')

  p0-layering-patch:
    if: github.head_ref == 'hardening/p0-native-context-work' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/p0-native-context-work
          fetch-depth: 0
      - name: Apply canonical bypass layering fix and self-clean
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          Path('src/k500/K500EqBypass.h').write_text(r'''#pragma once

#include <QString>
#include <QtGlobal>

struct K500EqBypassImage
{
    quint8 m0 = 0;
    quint8 m1 = 0;
    quint8 m2 = 0;
};

namespace K500EqBypass {

struct BitSpec
{
    int byteIndex = -1;
    quint8 mask = 0;
    bool valid() const { return byteIndex >= 0 && mask != 0; }
};

inline BitSpec spec(const QString &section)
{
    const QString key = section.trimmed().toLower();
    if (key == QStringLiteral("mic") || key == QStringLiteral("mica") || key == QStringLiteral("micb")) return {0, 0x60};
    if (key == QStringLiteral("music")) return {0, 0x80};
    if (key == QStringLiteral("main")) return {1, 0x01};
    if (key == QStringLiteral("surround")) return {1, 0x04};
    if (key == QStringLiteral("center")) return {1, 0x10};
    if (key == QStringLiteral("sub") || key == QStringLiteral("subwoofer")) return {1, 0x40};
    if (key == QStringLiteral("reverb")) return {2, 0x01};
    if (key == QStringLiteral("echo")) return {2, 0x02};
    return {};
}

inline quint8 byte(const K500EqBypassImage &image, int index)
{
    return index == 0 ? image.m0 : (index == 1 ? image.m1 : image.m2);
}

inline quint8 *bytePtr(K500EqBypassImage &image, int index)
{
    return index == 0 ? &image.m0 : (index == 1 ? &image.m1 : &image.m2);
}

inline bool set(K500EqBypassImage &image, const QString &section, bool enabled)
{
    const BitSpec bits = spec(section);
    if (!bits.valid())
        return false;
    quint8 *target = bytePtr(image, bits.byteIndex);
    *target = enabled ? static_cast<quint8>(*target | bits.mask)
                      : static_cast<quint8>(*target & static_cast<quint8>(~bits.mask));
    return true;
}

inline bool enabled(const K500EqBypassImage &image, const QString &section)
{
    const BitSpec bits = spec(section);
    if (!bits.valid())
        return false;
    return (byte(image, bits.byteIndex) & bits.mask) == bits.mask;
}

} // namespace K500EqBypass
''')

          p = Path('src/k500/K500Protocol.h')
          text = p.read_text()
          if '#include "K500EqBypass.h"' not in text:
              text = text.replace('#include <QByteArray>', '#include "K500EqBypass.h"\n\n#include <QByteArray>', 1)
          text, _ = re.subn(r'\nstruct K500EqBypassImage\n\{\n    quint8 m0 = 0;\n    quint8 m1 = 0;\n    quint8 m2 = 0;\n\};\n', '\n', text, count=1)
          text = text.replace('bool setEqBypass(K500EqBypassImage &image, const QString &section, bool enabled);\nbool eqBypassEnabled(const K500EqBypassImage &image, const QString &section);\n', '', 1)
          p.write_text(text)

          p = Path('src/k500/K500Protocol.cpp')
          text = p.read_text()
          text, _ = re.subn(r'\nbool eqBypassSpec\(const QString &section, int \*byteIndex, quint8 \*mask\)\n\{.*?\n\}\n', '\n', text, count=1, flags=re.S)
          text, _ = re.subn(r'\nbool setEqBypass\(K500EqBypassImage &image, const QString &section, bool enabled\)\n\{.*?\n\}\n\nbool eqBypassEnabled\(const K500EqBypassImage &image, const QString &section\)\n\{.*?\n\}\n', '\n', text, count=1, flags=re.S)
          text = text.replace('setEqBypass(bypass,', 'K500EqBypass::set(bypass,')
          text = text.replace('eqBypassEnabled(bypass,', 'K500EqBypass::enabled(bypass,')
          p.write_text(text)

          p = Path('src/k500/K500Controller.cpp')
          p.write_text(p.read_text().replace('K500Protocol::setEqBypass(m_eqBypass, section, value.toBool())', 'K500EqBypass::set(m_eqBypass, section, value.toBool())'))

          p = Path('src/StudioEngine.cpp')
          text = p.read_text().replace('#include "k500/K500Protocol.h"', '#include "k500/K500EqBypass.h"', 1)
          text = text.replace('K500Protocol::eqBypassEnabled(eqBypass, bypassKey)', 'K500EqBypass::enabled(eqBypass, bypassKey)')
          p.write_text(text)

          # Remove this temporary patch job from the permanent guard workflow.
          p = Path('.github/workflows/p1-fx-rack-centering.yml')
          text = p.read_text()
          marker = '\n  p0-layering-patch:\n'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'
          p.write_text(text)
          PY
          rm -f .github/workflows/p0-bypass-map-layering-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Decouple canonical EQ bypass map from protocol linking"
          git push origin HEAD:hardening/p0-native-context-work
