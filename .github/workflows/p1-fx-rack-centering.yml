name: Guard P1 FX rack centering

on:
  pull_request:
    paths:
      - 'qml/components/RackFaderPanel.qml'
      - '.github/workflows/p1-fx-rack-centering.yml'

jobs:
  fx-rack-centering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard intentional centered three-strip layout
        shell: python
        run: |
          from pathlib import Path

          qml = Path('qml/components/RackFaderPanel.qml').read_text(encoding='utf-8')
          checks = {
              'P1 centering contract token': 'P1_FX_FADER_CLUSTER_CENTERING_V1' in qml,
              'Reverb and Echo use compact cluster': 'title === "Reverb" || title === "Echo"' in qml,
              'compact channel width is explicit': 'compactChannelWidth: 100' in qml,
              'compact channels are fixed width': 'Layout.preferredWidth: root.compactCluster ? root.compactChannelWidth : -1' in qml and 'Layout.minimumWidth: root.compactCluster ? root.compactChannelWidth : 48' in qml,
              'cluster has symmetric flex gutters': qml.count('visible: root.compactCluster\n                Layout.fillWidth: true\n                Layout.fillHeight: true') >= 2,
              'legacy 62px shove-left removed': 'root.compactCluster ? 62' not in qml,
          }

          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + '  ' + name)
          if failed:
              raise SystemExit('P1 FX rack centering guard failed: ' + ', '.join(failed))
          print('ALL P1 FX RACK CENTERING GUARDS PASSED')
