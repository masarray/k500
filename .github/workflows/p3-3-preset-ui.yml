name: Guard P3.3 preset file UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/k500/K500DeviceManager.h'
      - 'src/k500/K500PresetFileBridgeAccess.cpp'
      - 'src/k500/K500PresetFileBridge.*'
      - 'qml/components/SystemWorkspace.qml'
      - 'resources/presets/*.k500'
      - 'CMakeLists.txt'
      - '.github/workflows/p3-3-preset-ui.yml'
  pull_request:
    paths:
      - 'src/k500/K500DeviceManager.h'
      - 'src/k500/K500PresetFileBridgeAccess.cpp'
      - 'src/k500/K500PresetFileBridge.*'
      - 'qml/components/SystemWorkspace.qml'
      - 'resources/presets/*.k500'
      - 'CMakeLists.txt'
      - '.github/workflows/p3-3-preset-ui.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard P3.3/P6 architecture and safety
        shell: pwsh
        run: |
          $manager = Get-Content 'src/k500/K500DeviceManager.h' -Raw
          $bridge = Get-Content 'src/k500/K500PresetFileBridgeAccess.cpp' -Raw
          $fileBridgeHeader = Get-Content 'src/k500/K500PresetFileBridge.h' -Raw
          $fileBridge = Get-Content 'src/k500/K500PresetFileBridge.cpp' -Raw
          $system = Get-Content 'qml/components/SystemWorkspace.qml' -Raw
          $cmake = Get-Content 'CMakeLists.txt' -Raw

          foreach ($token in @('presetFileBridge READ presetFileBridge CONSTANT','QObject *presetFileBridge() const','m_presetFileBridge')) {
            if (-not $manager.Contains($token)) { throw "P3.3 DeviceManager bridge regression: missing '$token'" }
          }
          foreach ($token in @('P3_3_FILE_BRIDGE_QML_ACCESS_V1','new K500PresetFileBridge(self)')) {
            if (-not $bridge.Contains($token)) { throw "P3.3 access bridge regression: missing '$token'" }
          }
          foreach ($token in @('P3_3_PRESET_FILE_UI_V1','import QtQuick.Dialogs','FileDialog.OpenFile','FileDialog.SaveFile','root.fileBridge.loadFile(selectedFile)','root.fileBridge.saveFile(selectedFile)','root.fileBridge.checksumOk')) {
            if (-not $system.Contains($token)) { throw "P3.3 System UI regression: missing '$token'" }
          }
          if (-not $system.Contains('readonly property bool offlineFileMode: !root.presetManager || !root.presetManager.connected') -or
              -not $system.Contains('enabled: root.offlineFileMode && !!root.fileBridge')) {
            throw 'P3.3 safety regression: manual PC file open/preview must remain offline-only'
          }

          if ($system.Contains('P4_PC_PRESET_UPLOAD_UI_V1')) {
            foreach ($token in @('enabled: root.pcUploadReady','root.presetManager.uploadSlotImage(root.selectedDeviceSlot + 1','root.fileBridge.checksumOk','root.presetManager.usbStoreAvailable')) {
              if (-not $system.Contains($token)) { throw "P4-gated upload regression: missing '$token'" }
            }
          } elseif (-not $system.Contains('enabled:false')) {
            throw 'P3.3 dependency safety regression: Upload must be disabled before P4 validation exists'
          }

          if ($system.Contains('P4_2_PRESET_BATCH_UI_V1')) {
            foreach ($token in @('FileDialog.OpenFiles','root.fileBridge.buildMassUploadEntries','root.presetManager.massUploadSlotImages(entries)','enabled: root.massUploadReady')) {
              if (-not $system.Contains($token)) { throw "P4.2-gated Mass Upload regression: missing '$token'" }
            }
          }

          foreach ($token in @('P6_PC_PRESET_LIBRARY_UI_V1','PC PRESET LIBRARY','DEVICE PRESET SLOTS','FolderDialog','root.fileBridge.setPresetFolder(selectedFolder)','root.fileBridge.builtInPresets','root.fileBridge.folderPresets','root.fileBridge.loadBuiltInPreset(index)','root.fileBridge.loadFolderPreset(index)')) {
            if (-not $system.Contains($token)) { throw "P6 PC preset library UI regression: missing '$token'" }
          }
          foreach ($token in @('P6_PC_PRESET_LIBRARY_V1','setPresetFolder','refreshPresetFolder','loadFolderPreset','loadBuiltInPreset','builtInPresets','folderPresets')) {
            if (-not $fileBridgeHeader.Contains($token) -and -not $fileBridge.Contains($token)) { throw "P6 PC preset library backend regression: missing '$token'" }
          }

          $presets = @(Get-ChildItem 'resources/presets' -Filter '*.k500' -File)
          if ($presets.Count -ne 10) { throw "P6 built-in bank must contain exactly 10 .k500 files; found $($presets.Count)" }
          foreach ($preset in $presets) {
            $bytes = [IO.File]::ReadAllBytes($preset.FullName)
            if ($bytes.Length -ne 1144) { throw "$($preset.Name) must remain exactly 1144 bytes" }
            $sum = 0
            foreach ($b in $bytes) { $sum += [int]$b }
            if (($sum % 256) -ne 0) { throw "$($preset.Name) checksum invalid" }
            $nameBytes = $bytes[0x454..0x474]
            $name = [Text.Encoding]::ASCII.GetString($nameBytes).Trim([char]0).Trim()
            if ($name.Length -gt 16) { throw "$($preset.Name) internal preset name exceeds K500 16-character loader limit: '$name'" }
          }

          foreach ($token in @('built_in_presets','resources/presets/01_ALL_GENRE.k500','QT_RESOURCE_ALIAS "presets/${PRESET_NAME}"')) {
            if (-not $cmake.Contains($token)) { throw "P6 CMake preset-resource regression: missing '$token'" }
          }
          if (-not $cmake.Contains('K500PresetFileBridgeAccess.cpp')) {
            throw 'P3.3 CMake access adapter registration missing'
          }

          $directIo = Get-ChildItem qml -Recurse -File -Filter '*.qml' | Select-String -Pattern 'K500Controller|K500WinIo'
          if ($directIo) {
            $directIo | ForEach-Object { Write-Host $_ }
            throw 'P3.3 architecture regression: QML must not reference Controller/WinIo directly'
          }
