name: Guard P3.3 preset file UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/k500/K500DeviceManager.h'
      - 'src/k500/K500PresetFileBridgeAccess.cpp'
      - 'src/k500/K500PresetFileBridge.*'
      - 'qml/components/SystemWorkspace.qml'
      - 'qml/components/MassUploadTransferWindow.qml'
      - 'resources/presets/*.k500'
      - 'CMakeLists.txt'
      - '.github/workflows/p3-3-preset-ui.yml'
  pull_request:
    paths:
      - 'src/k500/K500DeviceManager.h'
      - 'src/k500/K500PresetFileBridgeAccess.cpp'
      - 'src/k500/K500PresetFileBridge.*'
      - 'qml/components/SystemWorkspace.qml'
      - 'qml/components/MassUploadTransferWindow.qml'
      - 'resources/presets/*.k500'
      - 'CMakeLists.txt'
      - '.github/workflows/p3-3-preset-ui.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard P3.3/P6 architecture and safety
        shell: pwsh
        run: |
          $manager = Get-Content 'src/k500/K500DeviceManager.h' -Raw
          $bridge = Get-Content 'src/k500/K500PresetFileBridgeAccess.cpp' -Raw
          $fileBridgeHeader = Get-Content 'src/k500/K500PresetFileBridge.h' -Raw
          $fileBridge = Get-Content 'src/k500/K500PresetFileBridge.cpp' -Raw
          $system = Get-Content 'qml/components/SystemWorkspace.qml' -Raw
          $transfer = Get-Content 'qml/components/MassUploadTransferWindow.qml' -Raw
          $cmake = Get-Content 'CMakeLists.txt' -Raw

          foreach ($token in @('presetFileBridge READ presetFileBridge CONSTANT','QObject *presetFileBridge() const','m_presetFileBridge')) {
            if (-not $manager.Contains($token)) { throw "P3.3 DeviceManager bridge regression: missing '$token'" }
          }
          foreach ($token in @('P3_3_FILE_BRIDGE_QML_ACCESS_V1','new K500PresetFileBridge(self)')) {
            if (-not $bridge.Contains($token)) { throw "P3.3 access bridge regression: missing '$token'" }
          }
          foreach ($token in @('P3_3_PRESET_FILE_UI_V1','import QtQuick.Dialogs','FileDialog.OpenFile','FileDialog.SaveFile','root.fileBridge.loadFile(selectedFile)','root.fileBridge.saveFile(selectedFile)','root.fileBridge.checksumOk')) {
            if (-not $system.Contains($token)) { throw "P3.3 System UI regression: missing '$token'" }
          }

          # Manual file open is safe online because it stages only; it must not be
          # hidden behind an offline-only gate anymore.
          if (-not $system.Contains('enabled: !!root.fileBridge; onClicked: openPresetDialog.open()')) {
            throw 'P3.3 staging regression: manual PC file open must remain available online/offline'
          }

          if ($system.Contains('P4_PC_PRESET_UPLOAD_UI_V1')) {
            foreach ($token in @('previewOrUploadLoadedPreset','root.offlineEditMode ? "Preview again" : "Preview"','root.pcUploadReady','root.presetManager.uploadSlotImage(root.selectedDeviceSlot + 1','root.fileBridge.previewLoadedPreset()','root.presetManager.usbStoreAvailable')) {
              if (-not $system.Contains($token)) { throw "P4/offline-preview UI regression: missing '$token'" }
            }
          } elseif (-not $system.Contains('enabled:false')) {
            throw 'P3.3 dependency safety regression: Upload must be disabled before P4 validation exists'
          }

          # DEVICE_TRUTH_STAGING_V1: selecting a PC file stages bytes only. Exactly
          # one StudioEngine hydration is allowed and it must live in the explicit
          # OFFLINE_PREVIEW_V1 action, not loadValidatedBytes().
          foreach ($token in @('editTracking = false','OFFLINE_DEVICE_SLOT_V1','MassUploadTransferWindow')) {
            if (-not $system.Contains($token)) { throw "Device-truth System UI regression: missing '$token'" }
          }
          foreach ($token in @('DEVICE_TRUTH_STAGING_V1','OFFLINE_PREVIEW_V1','previewLoadedPreset','m_editTracking','buildTransferUploadEntries')) {
            if (-not $fileBridgeHeader.Contains($token) -and -not $fileBridge.Contains($token)) { throw "Device-truth file bridge regression: missing '$token'" }
          }
          $hydrateCount = ([regex]::Matches($fileBridge, 'hydrateFromDeviceMemory\(preview\)')).Count
          if ($hydrateCount -ne 1) { throw "Offline preview regression: expected exactly one explicit preview hydrate, found $hydrateCount" }
          $loadStart = $fileBridge.IndexOf('bool K500PresetFileBridge::loadValidatedBytes')
          $loadEnd = $fileBridge.IndexOf('bool K500PresetFileBridge::loadFile', $loadStart)
          if ($loadStart -lt 0 -or $loadEnd -le $loadStart) { throw 'loadValidatedBytes boundary missing' }
          if ($fileBridge.Substring($loadStart, $loadEnd - $loadStart).Contains('hydrateFromDeviceMemory')) {
            throw 'Device-truth regression: selecting/staging a PC preset must not hydrate StudioEngine'
          }

          if ($system.Contains('P4_2_PRESET_BATCH_UI_V1')) {
            foreach ($token in @('MassUploadTransferWindow','OFFLINE_MASS_PREP_V1','massPresetDialog.openTransfer()')) {
              if (-not $system.Contains($token)) { throw "P4.2 System transfer-list regression: missing '$token'" }
            }
            foreach ($token in @('folderPresets','maxSlots: 10','Add All','buildTransferUploadEntries','massUploadSlotImages(entries)','root.presetManager.usbStoreAvailable')) {
              if (-not $transfer.Contains($token)) { throw "P4.2 transfer-list regression: missing '$token'" }
            }
            if ($system.Contains('FileDialog.OpenFiles')) {
              throw 'P4.2 regression: Mass Upload must use transfer-list UI, not direct multi-file upload'
            }
            if ($system -match 'text:\s*"Mass"[\s\S]{0,180}enabled:\s*root\.massUploadReady') {
              throw 'Offline Mass Upload preparation regression: opening transfer list must not require connected USB'
            }
          }

          foreach ($token in @('P6_PC_PRESET_LIBRARY_UI_V1','PC PRESET LIBRARY','DEVICE PRESET SLOTS','FolderDialog','root.fileBridge.setPresetFolder(selectedFolder)','root.fileBridge.builtInPresets','root.fileBridge.folderPresets','root.fileBridge.loadBuiltInPreset(index)','root.fileBridge.loadFolderPreset(index)')) {
            if (-not $system.Contains($token)) { throw "P6 PC preset library UI regression: missing '$token'" }
          }
          foreach ($token in @('P6_PC_PRESET_LIBRARY_V1','setPresetFolder','refreshPresetFolder','loadFolderPreset','loadBuiltInPreset','builtInPresets','folderPresets')) {
            if (-not $fileBridgeHeader.Contains($token) -and -not $fileBridge.Contains($token)) { throw "P6 PC preset library backend regression: missing '$token'" }
          }

          # Built-in bank is now repaired: every shipped preset must be exact and
          # checksum-valid. No baseline exception is allowed back in.
          $presets = @(Get-ChildItem 'resources/presets' -Filter '*.k500' -File)
          if ($presets.Count -ne 10) { throw "P6 built-in bank must contain exactly 10 .k500 files; found $($presets.Count)" }
          foreach ($preset in $presets) {
            $bytes = [IO.File]::ReadAllBytes($preset.FullName)
            if ($bytes.Length -ne 1144) { throw "$($preset.Name) must remain exactly 1144 bytes" }
            $sum = 0
            foreach ($b in $bytes) { $sum += [int]$b }
            if (($sum % 256) -ne 0) { throw "$($preset.Name) checksum invalid" }
            $nameBytes = $bytes[0x454..0x474]
            $name = [Text.Encoding]::ASCII.GetString($nameBytes).Trim([char]0).Trim()
            if ($name.Length -gt 16) { throw "$($preset.Name) internal preset name exceeds K500 16-character loader limit: '$name'" }
          }

          foreach ($token in @('built_in_presets','resources/presets/01_ALL_GENRE.k500','QT_RESOURCE_ALIAS "presets/${PRESET_NAME}"','qml/components/MassUploadTransferWindow.qml')) {
            if (-not $cmake.Contains($token)) { throw "P6/CMake UI-resource regression: missing '$token'" }
          }
          if (-not $cmake.Contains('K500PresetFileBridgeAccess.cpp')) {
            throw 'P3.3 CMake access adapter registration missing'
          }

          $directIo = Get-ChildItem qml -Recurse -File -Filter '*.qml' | Select-String -Pattern 'K500Controller|K500WinIo'
          if ($directIo) {
            $directIo | ForEach-Object { Write-Host $_ }
            throw 'P3.3 architecture regression: QML must not reference Controller/WinIo directly'
          }
