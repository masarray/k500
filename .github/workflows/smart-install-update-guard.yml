name: Guard smart install and update

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/AppVersionInit.cpp'
      - 'src/AppUpdateManager.*'
      - 'qml/Main.qml'
      - 'qml/components/UpdateDialog.qml'
      - 'packaging/windows/installer.iss'
      - 'packaging/windows/update_helper.cpp'
      - 'tests/windows/update_handoff_fixture.cpp'
      - 'tests/windows/update_failure_installer_fixture.cpp'
      - '.github/workflows/smart-install-update-guard.yml'
  push:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'src/AppVersionInit.cpp'
      - 'src/AppUpdateManager.*'
      - 'qml/Main.qml'
      - 'qml/components/UpdateDialog.qml'
      - 'packaging/windows/installer.iss'
      - 'packaging/windows/update_helper.cpp'
      - 'tests/windows/update_handoff_fixture.cpp'
      - 'tests/windows/update_failure_installer_fixture.cpp'
      - '.github/workflows/smart-install-update-guard.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify professional install layout and migration
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'SMART_INSTALL_LAYOUT_V2' packaging/windows/installer.iss
          grep -F 'P2_INSTALL_SCOPE_V1' packaging/windows/installer.iss
          grep -F 'PrivilegesRequired=lowest' packaging/windows/installer.iss
          grep -F 'OutputBaseFilename=SonKuPik-K500-v{#AppVersion}-Windows-Setup-PerUser' packaging/windows/installer.iss
          grep -F 'DefaultDirName={autopf}\{#AppName}' packaging/windows/installer.iss
          grep -F 'PrivilegesRequired=admin' packaging/windows/installer.iss
          grep -F 'DisableDirPage=yes' packaging/windows/installer.iss
          grep -F 'UsePreviousAppDir=no' packaging/windows/installer.iss
          grep -F 'RestartApplications=no' packaging/windows/installer.iss
          grep -F 'MIGRATE_LOCALAPPDATA_INSTALL_V1' packaging/windows/installer.iss
          grep -F 'ExecAsOriginalUser' packaging/windows/installer.iss
          grep -F '%LOCALAPPDATA%\Programs\{#AppName}\unins000.exe' packaging/windows/installer.iss
          # The standalone helper now owns installer launch arguments; keep the legacy Inno contract.
          grep -F '/AUToupdate=1' packaging/windows/update_helper.cpp
          grep -F '/HELPERUPDATE=1' packaging/windows/update_helper.cpp
          grep -F '/MIGRATEFROMMACHINE=1' packaging/windows/update_helper.cpp
          grep -F 'P3_EXPLICIT_SCOPE_MIGRATION_V1' packaging/windows/installer.iss
          grep -F "{param:MIGRATEFROMMACHINE|0}" packaging/windows/installer.iss
          grep -F "{param:AUToupdate|0}" packaging/windows/installer.iss
          if grep -Fq 'DefaultDirName={localappdata}' packaging/windows/installer.iss; then
            echo 'Stable installer must not default to LocalAppData' >&2
            exit 1
          fi

      - name: Verify user preset storage contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'USER_PRESET_LIBRARY_V1' src/AppVersionInit.cpp
          grep -F 'QStandardPaths::DocumentsLocation' src/AppVersionInit.cpp
          grep -F 'SonKuPik K500/Presets' src/AppVersionInit.cpp
          grep -F 'pcPresetLibrary/folder' src/AppVersionInit.cpp
          grep -F 'if (rememberedFolder.isEmpty())' src/AppVersionInit.cpp
          grep -F 'QStandardPaths::AppLocalDataLocation' src/k500/K500OfficialPresetSync.cpp
          if grep -Fq 'DocumentsLocation' src/k500/K500OfficialPresetSync.cpp; then
            echo 'Official update cache must remain internal, not in Documents' >&2
            exit 1
          fi
          if grep -Fq 'SonKuPik K500/Presets' packaging/windows/installer.iss; then
            # A comment explaining the contract is fine; installer must never own/delete it.
            if grep -Eq '^Source:.*SonKuPik K500\\Presets|^Name:.*SonKuPik K500\\Presets|^Type:.*SonKuPik K500\\Presets' packaging/windows/installer.iss; then
              echo 'Installer must not own the user preset library' >&2
              exit 1
            fi
          fi

      - name: Verify secure in-app updater contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'SMART_UPDATE_RUNTIME_V1' src/AppUpdateManager.h
          grep -F 'releases/latest' src/AppUpdateManager.cpp
          grep -F 'release-manifest.json' src/AppUpdateManager.cpp
          grep -F 'SHA256SUMS.txt' src/AppUpdateManager.cpp
          grep -F 'sonkupik-k500-release-manifest-v3' src/AppUpdateManager.cpp
          grep -F 'QCryptographicHash::Sha256' src/AppUpdateManager.cpp
          grep -F 'stableReleaseEligible' src/AppUpdateManager.cpp
          grep -F 'windows-x64' src/AppUpdateManager.cpp
          grep -F 'installerTechnology' src/AppUpdateManager.cpp
          grep -F 'm_manifestSha256' src/AppUpdateManager.cpp
          grep -F 'm_manifestSetupBytes' src/AppUpdateManager.cpp
          grep -F 'SHA256SUMS.txt disagrees with release-manifest.json' src/AppUpdateManager.cpp
          grep -F 'Downloaded package is not a Windows executable' src/AppUpdateManager.cpp
          grep -F 'ShellExecuteExW' src/AppUpdateManager.cpp
          grep -F 'info.lpVerb = L"open"' src/AppUpdateManager.cpp
          grep -F 'info.lpVerb = L"runas"' packaging/windows/update_helper.cpp
          grep -F 'runElevatedAndWait' packaging/windows/update_helper.cpp
          grep -F 'rollbackAndRelaunch' packaging/windows/update_helper.cpp
          grep -F 'copyTree' packaging/windows/update_helper.cpp
          grep -F 'restoreTree' packaging/windows/update_helper.cpp
          grep -F 'migrateMachineToUser' packaging/windows/update_helper.cpp
          grep -F 'removeStaleRegistration' packaging/windows/update_helper.cpp
          grep -F 'registrationRepairAvailable' src/AppUpdateManager.h
          grep -F 'repairStaleRegistration' qml/components/UpdateDialog.qml
          grep -F 'Range' src/AppUpdateManager.cpp
          grep -F 'Content-Range' src/AppUpdateManager.cpp
          grep -F 'partialInstallerPath' src/AppUpdateManager.cpp
          grep -F 'migrateToPerUser' qml/components/UpdateDialog.qml
          grep -F 'verifySetup(request, lockedSetup)' packaging/windows/update_helper.cpp
          grep -F 'waitParent(request)' packaging/windows/update_helper.cpp
          grep -F 'm_deviceTransactionBusy' src/AppUpdateManager.cpp
          grep -F 'setDeviceTransactionBusy' qml/Main.qml
          grep -F -- '--update-health-check=' src/main.cpp
          grep -F 'IsHelperUpdate' packaging/windows/installer.iss
          grep -F 'runasoriginaluser' packaging/windows/installer.iss
          grep -F 'SonKuPik-K500-Updater.exe' .github/workflows/windows-stable-release.yml
          grep -F 'QML_NAMED_ELEMENT(AppUpdater)' src/AppUpdateManager.h
          grep -F 'class AppUpdateManager : public QObject' src/AppUpdateManager.h
          if grep -Fq 'class AppUpdateManager final' src/AppUpdateManager.h; then
            echo 'Qt 6.8 generated QML singleton wrapper cannot derive from a final class' >&2
            exit 1
          fi
          grep -F 'qml/components/UpdateDialog.qml' CMakeLists.txt
          grep -F 'AppUpdater.checkForUpdates(false)' qml/Main.qml
          grep -F 'Update sekarang' qml/components/UpdateDialog.qml

      - name: Reject unsafe update shortcuts
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq 'disable.*(defender|antivirus)|Add-MpPreference|Set-MpPreference' src/AppUpdateManager.cpp packaging/windows/installer.iss; then
            echo 'Updater must never weaken Windows security controls' >&2
            exit 1
          fi
          if grep -Fq 'http://' src/AppUpdateManager.cpp; then
            echo 'Updater must use HTTPS only' >&2
            exit 1
          fi
          if grep -Eq 'Qt\.openUrlExternally|QDesktopServices::openUrl' qml/components/UpdateDialog.qml src/AppUpdateManager.cpp; then
            echo 'Primary update flow must remain in-app and must not hand users to a browser' >&2
            exit 1
          fi

  inno-compile:
    name: Compile smart Inno installer
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Activate MSVC 2022 for standalone helper
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Create minimal packaging fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package,dist,build/packaging | Out-Null
          # Native dummy implements ONLY updater health/relaunch tests. It does
          # not access K500 hardware and must never be published as an app.
          & cl /nologo /std:c++20 /EHsc /DUNICODE /D_UNICODE /Fepackage/SonKuPik-K500.exe tests/windows/update_handoff_fixture.cpp /link /SUBSYSTEM:WINDOWS shell32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Installer test-only application fixture failed to compile' }
          # Compile the actual standalone Win32 helper without a Qt dependency.
          & cl /nologo /std:c++20 /EHsc /DUNICODE /D_UNICODE /DSONKUPIK_UPDATE_HELPER_CI=1 /Fepackage/SonKuPik-K500-Updater.exe packaging/windows/update_helper.cpp /link /SUBSYSTEM:WINDOWS shell32.lib bcrypt.lib user32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Native update coordinator compilation failed' }
          & cl /nologo /std:c++20 /EHsc /DUNICODE /D_UNICODE /Febuild/packaging/P3-Fake-Installer.exe tests/windows/update_failure_installer_fixture.cpp /link /SUBSYSTEM:WINDOWS shell32.lib
          if ($LASTEXITCODE -ne 0) { throw 'P3 fake failure installer fixture failed to compile' }
          $helperTest = Start-Process -FilePath 'package/SonKuPik-K500-Updater.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($helperTest.ExitCode -ne 0) { throw "Native update coordinator self-test failed: $($helperTest.ExitCode)" }
          # Exercise the production Windows BCrypt streaming verifier: accept a
          # correct file/hash pair and reject a changed file without installing.
          $fixture = (Join-Path (Resolve-Path 'package').Path 'updater-hash-fixture.bin')
          [IO.File]::WriteAllBytes($fixture, [byte[]](0..255))
          $hash = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $good = Start-Process -FilePath 'package/SonKuPik-K500-Updater.exe' -ArgumentList @('--verify-self-test', ('"' + $fixture + '"'), $hash) -Wait -PassThru
          if ($good.ExitCode -ne 0) { throw "Valid helper SHA-256 fixture failed: $($good.ExitCode)" }
          [IO.File]::AppendAllText($fixture, 'tamper')
          $bad = Start-Process -FilePath 'package/SonKuPik-K500-Updater.exe' -ArgumentList @('--verify-self-test', ('"' + $fixture + '"'), $hash) -Wait -PassThru
          if ($bad.ExitCode -ne 41) { throw "Tampered helper SHA-256 fixture did not fail closed: $($bad.ExitCode)" }
          Remove-Item $fixture -Force
          Copy-Item LICENSE package/LICENSE
          python -m pip install --disable-pip-version-check --quiet pillow
          python -m unittest discover -s tests -p test_installer_brand_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer branding tests failed' }
          python packaging/windows/generate_brand_assets.py --icon package/SonKuPik-K500.ico --wizard build/packaging/wizard.bmp --wizard-small build/packaging/wizard-small.bmp
          if ($LASTEXITCODE -ne 0) { throw 'Installer branding generation failed' }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          "INNO_ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compile installer script
        shell: pwsh
        run: |
          # Headless CI must never block on updater MessageBox diagnostics.
          $env:SONKUPIK_UPDATE_HELPER_TEST = '1'
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(SonkupikStudioNative VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)') { throw 'Version not found' }
          $version = $Matches[1]
          $env:SONKUPIK_APP_DIR = (Resolve-Path package).Path
          $env:SONKUPIK_OUTPUT_DIR = (Resolve-Path dist).Path
          $env:SONKUPIK_APP_ICON = (Resolve-Path package/SonKuPik-K500.ico).Path
          $env:SONKUPIK_WIZARD_IMAGE = (Resolve-Path build/packaging/wizard.bmp).Path
          $env:SONKUPIK_WIZARD_SMALL_IMAGE = (Resolve-Path build/packaging/wizard-small.bmp).Path
          & $env:INNO_ISCC "/DAppVersion=$version" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup script failed to compile' }
          $setup = "dist/SonKuPik-K500-v$version-Windows-Setup.exe"
          if (-not (Test-Path $setup)) { throw 'Expected Setup EXE was not produced' }
          # P2: compile a separately named per-user installer from the same
          # package, with lowest privileges and no machine-wide migration.
          & $env:INNO_ISCC "/DAppVersion=$version" "/DPerUser=1" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Per-user Inno Setup script failed to compile' }
          $perUserSetup = "dist/SonKuPik-K500-v$version-Windows-Setup-PerUser.exe"
          if (-not (Test-Path $perUserSetup)) { throw 'Expected per-user Setup EXE was not produced' }

          # A registered machine-wide copy must make the per-user package fail
          # closed. This protects users from two shortcuts/uninstall entries.
          $machineKey = 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F568FE8-A747-4CD0-A727-5FE81A405500}_is1'
          & reg.exe ADD $machineKey /v DisplayName /t REG_SZ /d 'SonKuPik K500 CI machine fixture' /f | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not create machine-wide collision fixture' }
          try {
            $blockedDir = Join-Path $env:LOCALAPPDATA 'Programs\SonKuPik-K500-P2-BLOCKED'
            if (Test-Path $blockedDir) { Remove-Item $blockedDir -Recurse -Force }
            $blocked = Start-Process -FilePath (Resolve-Path $perUserSetup).Path -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$blockedDir"
            ) -Wait -PassThru
            if ($blocked.ExitCode -eq 0) { throw 'Per-user installer accepted an existing machine-wide registration' }
            if (Test-Path (Join-Path $blockedDir 'SonKuPik-K500.exe')) {
              throw 'Blocked per-user installer wrote application files despite machine-wide collision'
            }
          }
          finally {
            & reg.exe DELETE $machineKey /f | Out-Null
          }

          # Fresh per-user package install/uninstall.
          $testDir = Join-Path $env:LOCALAPPDATA 'Programs\SonKuPik-K500-P3-CI'
          if (Test-Path $testDir) { Remove-Item $testDir -Recurse -Force }
          $install = Start-Process -FilePath (Resolve-Path $perUserSetup).Path -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$testDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Per-user installer smoke test failed: $($install.ExitCode)" }
          foreach ($name in @('SonKuPik-K500.exe', 'SonKuPik-K500-Updater.exe', 'unins000.exe')) {
            if (-not (Test-Path (Join-Path $testDir $name))) { throw "Per-user installation missing $name" }
          }
          $uninstall = Start-Process -FilePath (Join-Path $testDir 'unins000.exe') -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Per-user uninstall failed: $($uninstall.ExitCode)" }

          # P3 real helper update: installed user copy -> verified Setup -> backup
          # -> install -> health check -> relaunch -> recovery snapshot cleanup.
          $defaultDir = Join-Path $env:LOCALAPPDATA 'Programs\SonKuPik K500'
          if (Test-Path $defaultDir) { Remove-Item $defaultDir -Recurse -Force }
          $seed = Start-Process -FilePath (Resolve-Path $perUserSetup).Path -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($seed.ExitCode -ne 0) { throw "Could not seed per-user update fixture: $($seed.ExitCode)" }

          $healthMarker = Join-Path $env:TEMP 'SonKuPik-K500-CI-update-health.marker'
          $restartMarker = Join-Path $env:TEMP 'SonKuPik-K500-CI-update-relaunch.marker'
          Remove-Item $healthMarker,$restartMarker -Force -ErrorAction SilentlyContinue
          $setupAbs = (Resolve-Path $perUserSetup).Path
          $setupHash = (Get-FileHash $setupAbs -Algorithm SHA256).Hash.ToLowerInvariant()
          $log = Join-Path $env:TEMP 'SonKuPik-K500-CI-update-handoff.log'
          $backup = Join-Path $env:TEMP 'SonKuPik-K500-CI-recovery'
          Remove-Item $log,("$log.inno.log") -Force -ErrorAction SilentlyContinue
          if (Test-Path $backup) { Remove-Item $backup -Recurse -Force }
          $parent = Start-Process -FilePath 'pwsh.exe' -ArgumentList @('-NoProfile','-Command','Start-Sleep -Seconds 2') -PassThru
          $helperArgs = @(
            '--parent-pid', "$($parent.Id)",
            '--setup', ('"' + $setupAbs + '"'),
            '--app', ('"' + (Join-Path $defaultDir 'SonKuPik-K500.exe') + '"'),
            '--target-app', ('"' + (Join-Path $defaultDir 'SonKuPik-K500.exe') + '"'),
            '--version', $version,
            '--previous-version', $version,
            '--log', ('"' + $log + '"'),
            '--sha256', $setupHash,
            '--scope', 'user',
            '--mode', 'update',
            '--backup', ('"' + $backup + '"')
          )
          $handoff = Start-Process -FilePath 'package/SonKuPik-K500-Updater.exe' -ArgumentList $helperArgs -Wait -PassThru
          if ($handoff.ExitCode -ne 0) { throw "Non-admin update handoff failed: $($handoff.ExitCode); log: $log" }
          $ready = $false
          foreach ($attempt in 1..30) {
            if ((Test-Path $healthMarker) -and (Test-Path $restartMarker)) { $ready = $true; break }
            Start-Sleep -Milliseconds 250
          }
          if (-not $ready) { throw 'Updater did not health-check AND relaunch installed application' }
          if (-not ((Get-Content $log -Raw).Contains('recovery snapshot released'))) {
            throw 'Updater log did not report successful recovery-snapshot release'
          }
          if (Test-Path $backup) { throw 'Successful update left stale recovery snapshot' }
          $cleanup = Start-Process -FilePath (Join-Path $defaultDir 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($cleanup.ExitCode -ne 0) { throw "Per-user update fixture cleanup failed: $($cleanup.ExitCode)" }

          # P3 executable rollback qualification. The fake installer corrupts
          # the app before failing; the helper must restore and health-check old.
          $rollbackDir = Join-Path $env:LOCALAPPDATA 'Programs\SonKuPik-K500-P3-ROLLBACK'
          if (Test-Path $rollbackDir) { Remove-Item $rollbackDir -Recurse -Force }
          $seedRollback = Start-Process -FilePath (Resolve-Path $perUserSetup).Path -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$rollbackDir"
          ) -Wait -PassThru
          if ($seedRollback.ExitCode -ne 0) { throw 'Could not seed rollback fixture' }
          $originalAppHash = (Get-FileHash (Join-Path $rollbackDir 'SonKuPik-K500.exe') -Algorithm SHA256).Hash
          $rollbackKey = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F568FE8-A747-4CD0-A727-5FE81A405500}_is1'
          $originalRegistry = (& reg.exe QUERY $rollbackKey /v DisplayVersion | Out-String)
          if ($originalRegistry -notmatch [regex]::Escape($version)) { throw 'Rollback fixture did not have expected original registry version' }
          $fakeSetup = (Resolve-Path 'build/packaging/P3-Fake-Installer.exe').Path
          $fakeHash = (Get-FileHash $fakeSetup -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:SONKUPIK_UPDATE_HELPER_TEST = '1'

          foreach ($case in @(
            @{ Mode='nonzero'; Expected=23; Name='installer-nonzero' },
            @{ Mode='badhealth'; Expected=24; Name='failed-health-check' }
          )) {
            Remove-Item $healthMarker,$restartMarker -Force -ErrorAction SilentlyContinue
            $env:SONKUPIK_P3_FAKE_INSTALL_MODE = $case.Mode
            $caseLog = Join-Path $env:TEMP ("SonKuPik-K500-P3-" + $case.Name + '.log')
            $caseBackup = Join-Path $env:TEMP ("SonKuPik-K500-P3-" + $case.Name + '-recovery')
            Remove-Item $caseLog -Force -ErrorAction SilentlyContinue
            if (Test-Path $caseBackup) { Remove-Item $caseBackup -Recurse -Force }
            $parent = Start-Process -FilePath 'pwsh.exe' -ArgumentList @('-NoProfile','-Command','Start-Sleep -Seconds 1') -PassThru
            $args = @(
              '--parent-pid', "$($parent.Id)",
              '--setup', ('"' + $fakeSetup + '"'),
              '--app', ('"' + (Join-Path $rollbackDir 'SonKuPik-K500.exe') + '"'),
              '--target-app', ('"' + (Join-Path $rollbackDir 'SonKuPik-K500.exe') + '"'),
              '--version', $version,
              '--previous-version', $version,
              '--log', ('"' + $caseLog + '"'),
              '--sha256', $fakeHash,
              '--scope', 'user',
              '--mode', 'update',
              '--backup', ('"' + $caseBackup + '"')
            )
            $result = Start-Process -FilePath 'package/SonKuPik-K500-Updater.exe' -ArgumentList $args -Wait -PassThru
            if ($result.ExitCode -ne $case.Expected) {
              throw "$($case.Name) returned $($result.ExitCode), expected $($case.Expected)"
            }
            if ((Get-FileHash (Join-Path $rollbackDir 'SonKuPik-K500.exe') -Algorithm SHA256).Hash -ne $originalAppHash) {
              throw "$($case.Name) did not restore the original application bytes"
            }
            $restoredRegistry = (& reg.exe QUERY $rollbackKey /v DisplayVersion | Out-String)
            if (($restoredRegistry -notmatch [regex]::Escape($version)) -or
                ($restoredRegistry -match 'P3-BROKEN-REGISTRY')) {
              throw "$($case.Name) did not restore the original uninstall registry metadata"
            }
            if (Test-Path $caseBackup) { throw "$($case.Name) left recovery snapshot after successful rollback" }
            if (-not ((Get-Content $caseLog -Raw).Contains('Rollback health check passed'))) {
              throw "$($case.Name) did not prove rollback health check"
            }
          }
          Remove-Item Env:SONKUPIK_P3_FAKE_INSTALL_MODE -ErrorAction SilentlyContinue
          $rollbackCleanup = Start-Process -FilePath (Join-Path $rollbackDir 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($rollbackCleanup.ExitCode -ne 0) { throw 'Rollback fixture uninstall failed' }

          # P3 explicit Program Files -> per-user migration. Seed machine install,
          # preserve user-owned data sentinels, then let helper validate user copy
          # BEFORE elevated removal of the old machine installation.
          if (Test-Path $defaultDir) { Remove-Item $defaultDir -Recurse -Force }
          $machineDir = Join-Path $env:RUNNER_TEMP 'SonKuPik-K500-P3-MACHINE'
          if (Test-Path $machineDir) { Remove-Item $machineDir -Recurse -Force }
          $machineInstall = Start-Process -FilePath (Resolve-Path $setup).Path -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$machineDir"
          ) -Wait -PassThru
          if ($machineInstall.ExitCode -ne 0) { throw "Machine fixture install failed: $($machineInstall.ExitCode)" }

          $presetMarker = Join-Path $env:USERPROFILE 'Documents\SonKuPik K500\Presets\P3-preserve.marker'
          $cacheMarker = Join-Path $env:LOCALAPPDATA 'MasArray\SonKuPik K500\official-presets\P3-preserve.marker'
          New-Item -ItemType Directory -Force -Path (Split-Path $presetMarker),(Split-Path $cacheMarker) | Out-Null
          Set-Content $presetMarker 'preset-user-data-must-survive' -Encoding ascii
          Set-Content $cacheMarker 'official-cache-must-survive' -Encoding ascii
          & reg.exe ADD 'HKCU\Software\MasArray\SonKuPik K500' /v P3Persistence /t REG_SZ /d 'qsettings-must-survive' /f | Out-Null

          Remove-Item $healthMarker,$restartMarker -Force -ErrorAction SilentlyContinue
          $migrationLog = Join-Path $env:TEMP 'SonKuPik-K500-P3-migration.log'
          $migrationBackup = Join-Path $env:TEMP 'SonKuPik-K500-P3-migration-recovery'
          if (Test-Path $migrationBackup) { Remove-Item $migrationBackup -Recurse -Force }
          # Suppress interactive helper error dialogs in CI only; any migration
          # failure must surface as an exit code/log instead of hanging a runner.
          $env:SONKUPIK_UPDATE_HELPER_TEST = '1'
          $migrationHash = (Get-FileHash $perUserSetup -Algorithm SHA256).Hash.ToLowerInvariant()
          $parent = Start-Process -FilePath 'pwsh.exe' -ArgumentList @('-NoProfile','-Command','Start-Sleep -Seconds 1') -PassThru
          $migrationArgs = @(
            '--parent-pid', "$($parent.Id)",
            '--setup', ('"' + (Resolve-Path $perUserSetup).Path + '"'),
            '--app', ('"' + (Join-Path $machineDir 'SonKuPik-K500.exe') + '"'),
            '--target-app', ('"' + (Join-Path $defaultDir 'SonKuPik-K500.exe') + '"'),
            '--version', $version,
            '--previous-version', $version,
            '--log', ('"' + $migrationLog + '"'),
            '--sha256', $migrationHash,
            '--scope', 'user',
            '--mode', 'migrate',
            '--backup', ('"' + $migrationBackup + '"')
          )
          $migration = Start-Process -FilePath 'package/SonKuPik-K500-Updater.exe' -ArgumentList $migrationArgs -Wait -PassThru
          if ($migration.ExitCode -ne 0) { throw "Explicit machine-to-user migration failed: $($migration.ExitCode)" }
          if (Test-Path (Join-Path $machineDir 'SonKuPik-K500.exe')) { throw 'Migration left old machine application active' }
          if (-not (Test-Path (Join-Path $defaultDir 'SonKuPik-K500.exe'))) { throw 'Migration did not create per-user application' }
          & reg.exe QUERY 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F568FE8-A747-4CD0-A727-5FE81A405500}_is1' *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Migration left machine-wide uninstall registration' }
          & reg.exe QUERY 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F568FE8-A747-4CD0-A727-5FE81A405500}_is1' *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Migration did not create per-user uninstall registration' }
          if (Test-Path $migrationBackup) { throw 'Successful migration left stale machine recovery snapshot' }
          if ((Get-Content $presetMarker -Raw).Trim() -ne 'preset-user-data-must-survive') { throw 'Migration changed user preset sentinel' }
          if ((Get-Content $cacheMarker -Raw).Trim() -ne 'official-cache-must-survive') { throw 'Migration changed official cache sentinel' }
          $qsetting = (& reg.exe QUERY 'HKCU\Software\MasArray\SonKuPik K500' /v P3Persistence | Out-String)
          if ($qsetting -notmatch 'qsettings-must-survive') { throw 'Migration changed QSettings sentinel' }
          if (-not ((Get-Content $migrationLog -Raw).Contains('migration verified'))) { throw 'Migration helper did not log verified completion' }

          $migrationCleanup = Start-Process -FilePath (Join-Path $defaultDir 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($migrationCleanup.ExitCode -ne 0) { throw 'Migrated per-user fixture cleanup failed' }
          Remove-Item $presetMarker,$cacheMarker -Force -ErrorAction SilentlyContinue
          & reg.exe DELETE 'HKCU\Software\MasArray\SonKuPik K500' /v P3Persistence /f *> $null

          # Explicit stale-registration repair: delete only a key whose recorded
          # app/uninstaller are both gone; refuse an active registration.
          $staleKey = 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F568FE8-A747-4CD0-A727-5FE81A405500}_is1'
          $stalePath = Join-Path $env:RUNNER_TEMP 'SonKuPik-K500-P3-STALE-MISSING'
          if (Test-Path $stalePath) { Remove-Item $stalePath -Recurse -Force }
          & reg.exe ADD $staleKey /v 'Inno Setup: App Path' /t REG_SZ /d $stalePath /f | Out-Null
          $staleLog = Join-Path $env:TEMP 'SonKuPik-K500-P3-stale-registration.log'
          $repair = Start-Process -FilePath 'package/SonKuPik-K500-Updater.exe' -ArgumentList @(
            '--remove-stale-registration','machine',
            '--expected-path',('"' + $stalePath + '"'),
            '--log',('"' + $staleLog + '"')
          ) -Wait -PassThru
          if ($repair.ExitCode -ne 0) { throw "Verified stale registration cleanup failed: $($repair.ExitCode)" }
          & reg.exe QUERY $staleKey *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Verified stale machine registration was not removed' }

          $activePath = Join-Path $env:RUNNER_TEMP 'SonKuPik-K500-P3-ACTIVE-REG'
          New-Item -ItemType Directory -Force -Path $activePath | Out-Null
          Copy-Item package/SonKuPik-K500.exe (Join-Path $activePath 'SonKuPik-K500.exe')
          & reg.exe ADD $staleKey /v 'Inno Setup: App Path' /t REG_SZ /d $activePath /f | Out-Null
          $refuse = Start-Process -FilePath 'package/SonKuPik-K500-Updater.exe' -ArgumentList @(
            '--remove-stale-registration','machine',
            '--expected-path',('"' + $activePath + '"'),
            '--log',('"' + $staleLog + '"')
          ) -Wait -PassThru
          if ($refuse.ExitCode -ne 63) { throw "Active registration cleanup did not fail closed: $($refuse.ExitCode)" }
          & reg.exe QUERY $staleKey *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Active machine registration was incorrectly deleted' }
          & reg.exe DELETE $staleKey /f *> $null
          Remove-Item $activePath -Recurse -Force

      # This is an installer UI fixture, NOT a distributable application:
      # the package contains a placeholder SonKuPik-K500.exe for wizard review.
      - name: Prepare wizard-only visual preview (do not install)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'SonKuPik-K500-v*-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Preview fixture Setup EXE is missing' }
          Copy-Item $setup.FullName 'build/packaging/INNO-WIZARD-PREVIEW-DO-NOT-INSTALL.exe'

      - name: Upload wizard-only preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: K500-Inno-Wizard-Preview-${{ github.sha }}
          path: build/packaging/INNO-WIZARD-PREVIEW-DO-NOT-INSTALL.exe
          if-no-files-found: error
          retention-days: 7
