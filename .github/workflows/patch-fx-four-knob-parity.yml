name: Patch FX four knob parity

on:
  push:
    branches:
      - ui/reverb-four-knobs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/reverb-four-knobs
      - name: Refine Reverb UX and prepare Echo DIRECT
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          rack_path = Path('qml/components/RackFaderPanel.qml')
          rack = rack_path.read_text(encoding='utf-8')

          rack = replace_once(
              rack,
              '''    // as a dedicated instrument surface. Reverb uses four matching premium knobs\n    // (LEVEL, DECAY, PRE, DIRECT), while Echo keeps its three verified controls.\n''',
              '''    // as a dedicated instrument surface. Reverb uses four matching premium knobs\n    // (LEVEL, DECAY, PRE, DIRECT). Echo reserves the same four-knob geometry\n    // (LEVEL, REPEAT, DELAY, DIRECT); Echo DIRECT stays transport-gated until\n    // its native command/byte mapping is captured and verified.\n''',
              'FX surface contract')

          rack = replace_once(
              rack,
              '''    readonly property bool reverbMode: root.title === "Reverb"\n    readonly property real fxLevelNorm: root.clamp(root.fxVisual0 / 100.0, 0, 1)\n''',
              '''    readonly property bool reverbMode: root.title === "Reverb"\n    // FX_FOUR_KNOB_GEOMETRY_V1 — any four-control FX page gets the same\n    // premium control width, so Reverb and Echo never jump horizontally.\n    readonly property bool fourControlFx: root.compactCluster && root.channels && root.channels.length >= 4\n    readonly property real fxLevelNorm: root.clamp(root.fxVisual0 / 100.0, 0, 1)\n''',
              'four-knob geometry property')

          rack = replace_once(
              rack,
              '''        if (t === "Reverb") {\n            if (l === "LEVEL") return "effects.reverb.level"\n            if (l === "DIRECT") return "effects.reverb.direct"\n            if (l === "DECAY") return "effects.reverb.decayMs"\n            if (l === "PRE") return "effects.reverb.predelayMs"\n            return ""\n        }\n        var section = ""\n''',
              '''        if (t === "Reverb") {\n            if (l === "LEVEL") return "effects.reverb.level"\n            if (l === "DIRECT") return "effects.reverb.direct"\n            if (l === "DECAY") return "effects.reverb.decayMs"\n            if (l === "PRE") return "effects.reverb.predelayMs"\n            return ""\n        }\n        // ECHO_DIRECT_KNOB_PREP_V1 — Echo DIRECT is intentionally presentation-only\n        // until a native donor capture proves its command and byte position. Do not\n        // guess a transport path just to make the prepared control appear live.\n        if (t === "Echo") return ""\n        var section = ""\n''',
              'Echo evidence gate')

          rack = replace_once(
              rack,
              '''                    Layout.preferredWidth: root.reverbMode ? 392 : 318\n                    Layout.minimumWidth: root.reverbMode ? 360 : 288\n                    Layout.maximumWidth: root.reverbMode ? 420 : 336\n''',
              '''                    Layout.preferredWidth: root.fourControlFx ? 392 : 318\n                    Layout.minimumWidth: root.fourControlFx ? 360 : 288\n                    Layout.maximumWidth: root.fourControlFx ? 420 : 336\n''',
              'FX control cluster width')

          rack = replace_once(
              rack,
              '''                            Layout.minimumWidth: 88\n                            property real localValue: Number(modelData.value)\n\n                            StudioKnob {\n                                anchors.centerIn: parent\n''',
              '''                            Layout.minimumWidth: 88\n                            property real localValue: Number(modelData.value)\n                            readonly property bool channelEditable: modelData.editable === undefined || Boolean(modelData.editable)\n\n                            StudioKnob {\n                                anchors.centerIn: parent\n                                enabled: fxChannel.channelEditable\n                                opacity: fxChannel.channelEditable ? 1.0 : 0.62\n''',
              'prepared control disabled state')

          rack_path.write_text(rack, encoding='utf-8')

          workspace_path = Path('qml/components/SectionWorkspace.qml')
          workspace = workspace_path.read_text(encoding='utf-8')
          workspace = replace_once(
              workspace,
              '''                                    title: "Echo"\n                                    channels: [\n                                        {label:"LEVEL",value:Number(root.nestedValue("effects","echo","level",100)),from:0,to:100,step:1,unit:"%",decimals:0},\n                                        {label:"REPEAT",value:Number(root.nestedValue("effects","echo","repeat",12)),from:0,to:100,step:1,unit:"",decimals:0},\n                                        {label:"DELAY",value:Number(root.nestedValue("effects","echo","leftDelayMs",400)),from:0,to:1000,step:1,unit:"ms",decimals:0}\n                                    ]\n''',
              '''                                    title: "Echo"\n                                    // ECHO_DIRECT_KNOB_PREP_V1 — reserve the fourth knob now so the\n                                    // final native mapping can be enabled without another UX reflow.\n                                    // It remains disabled until a donor capture verifies the write path.\n                                    channels: [\n                                        {label:"LEVEL",value:Number(root.nestedValue("effects","echo","level",100)),from:0,to:100,step:1,unit:"%",decimals:0},\n                                        {label:"REPEAT",value:Number(root.nestedValue("effects","echo","repeat",12)),from:0,to:100,step:1,unit:"",decimals:0},\n                                        {label:"DELAY",value:Number(root.nestedValue("effects","echo","leftDelayMs",400)),from:0,to:1000,step:1,unit:"ms",decimals:0},\n                                        {label:"DIRECT",value:Number(root.nestedValue("effects","echo","direct",100)),from:0,to:100,step:1,unit:"%",decimals:0,editable:false}\n                                    ]\n''',
              'Echo DIRECT channel')
          workspace_path.write_text(workspace, encoding='utf-8')

          guard_path = Path('.github/workflows/p1-fx-rack-centering.yml')
          guard = guard_path.read_text(encoding='utf-8')
          guard = replace_once(
              guard,
              '''              'captured Reverb DIRECT is the fourth matching knob': 'REVERB_DIRECT_KNOB_NATIVE_V2' in rack and 'REVERB_DIRECT_KNOB_NATIVE_V2' in workspace and '{label:"DIRECT",value:Number(root.nestedValue("effects","reverb","direct",100))' in workspace and 'id: reverbDirectFader' not in rack,\n''',
              '''              'captured Reverb DIRECT is the fourth matching knob': 'REVERB_DIRECT_KNOB_NATIVE_V2' in rack and 'REVERB_DIRECT_KNOB_NATIVE_V2' in workspace and '{label:"DIRECT",value:Number(root.nestedValue("effects","reverb","direct",100))' in workspace and 'id: reverbDirectFader' not in rack,\n              'Echo reserves a transport-gated fourth DIRECT knob': 'ECHO_DIRECT_KNOB_PREP_V1' in rack and 'ECHO_DIRECT_KNOB_PREP_V1' in workspace and '{label:"DIRECT",value:Number(root.nestedValue("effects","echo","direct",100))' in workspace and 'editable:false' in workspace,\n              'four-control FX pages share geometry': 'FX_FOUR_KNOB_GEOMETRY_V1' in rack and 'root.fourControlFx ? 392 : 318' in rack,\n''',
              'FX guard parity checks')
          guard_path.write_text(guard, encoding='utf-8')

      - name: Commit UX parity patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qml/components/RackFaderPanel.qml qml/components/SectionWorkspace.qml .github/workflows/p1-fx-rack-centering.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Align Reverb and Echo four-knob FX UX"
          git push origin HEAD:ui/reverb-four-knobs
