name: Guard official preset library

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/k500/K500PresetFileBridge.*'
      - 'src/k500/K500OfficialPresetSync.cpp'
      - 'src/k500/K500PresetBatchBridge.cpp'
      - 'src/k500/K500PresetFileBridgeAccess.cpp'
      - 'qml/components/MassUploadTransferWindow.qml'
      - 'resources/presets/**'
      - 'packaging/windows/installer.iss'
      - '.github/workflows/official-preset-library.yml'
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'src/k500/K500PresetFileBridge.*'
      - 'src/k500/K500OfficialPresetSync.cpp'
      - 'src/k500/K500PresetBatchBridge.cpp'
      - 'src/k500/K500PresetFileBridgeAccess.cpp'
      - 'qml/components/MassUploadTransferWindow.qml'
      - 'resources/presets/**'
      - 'packaging/windows/installer.iss'
      - '.github/workflows/official-preset-library.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard unified preset and update contracts
        shell: pwsh
        run: |
          $header = Get-Content 'src/k500/K500PresetFileBridge.h' -Raw
          $bridge = Get-Content 'src/k500/K500PresetFileBridge.cpp' -Raw
          $sync = Get-Content 'src/k500/K500OfficialPresetSync.cpp' -Raw
          $batch = Get-Content 'src/k500/K500PresetBatchBridge.cpp' -Raw
          $mass = Get-Content 'qml/components/MassUploadTransferWindow.qml' -Raw
          $access = Get-Content 'src/k500/K500PresetFileBridgeAccess.cpp' -Raw
          $cmake = Get-Content 'CMakeLists.txt' -Raw
          $installer = Get-Content 'packaging/windows/installer.iss' -Raw

          foreach ($token in @('combinedPresets','officialSyncBusy','syncOfficialPresets','officialSyncStatus')) {
            if (-not $header.Contains($token)) { throw "Official library header regression: $token" }
          }
          foreach ($token in @(
            'api.github.com/repos/masarray/k500/contents/resources/presets?ref=main',
            'raw.githubusercontent.com',
            'validPresetBytes',
            'QSaveFile',
            'officialPresetLibrary/gitSha'
          )) {
            if (-not $sync.Contains($token)) { throw "Official sync safety regression: $token" }
          }
          foreach ($token in @('fileBridge.combinedPresets','syncOfficialPresets()','SONKUPIK','LOCAL','Remove All')) {
            if (-not $mass.Contains($token)) { throw "Unified Mass Upload regression: $token" }
          }
          if (-not $batch.Contains('resourcePath = path.startsWith')) { throw 'Bundled qrc presets can no longer enter transfer upload.' }
          if (-not $access.Contains('OFFICIAL_PRESET_AUTO_SYNC_V1')) { throw 'Automatic official preset update check was removed.' }
          if (-not $cmake.Contains('Qt6::Network') -or -not $cmake.Contains('K500OfficialPresetSync.cpp')) { throw 'Qt Network official sync build contract missing.' }
          foreach ($token in @('SetupIconFile={#AppIcon}','WizardImageFile={#WizardImage}','WizardSmallImageFile={#WizardSmallImage}')) {
            if (-not $installer.Contains($token)) { throw "Installer branding regression: $token" }
          }

          foreach ($token in @(
            'OFFICIAL_CACHE_IDENTITY_TRUTH_V1',
            'bytes,',
            'QString(),'
          )) {
            if (-not $bridge.Contains($token)) { throw "Official cache/catalog truth regression: $token" }
          }
          if ($bridge.Contains('Official cached preset; sync to refresh')) {
            throw 'Cache/catalog mismatch must not claim stale provenance or promise refresh without evidence.'
          }

          $presetFiles = @(Get-ChildItem 'resources/presets' -Filter '*.k500' -File | Sort-Object Name)
          if ($presetFiles.Count -ne 10) { throw "Official preset library must contain exactly 10 .k500 files; found $($presetFiles.Count)" }
          foreach ($file in $presetFiles) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -ne 1144) { throw "$($file.Name) size regression: $($bytes.Length)" }
            $sum = 0
            foreach ($b in $bytes) { $sum = ($sum + [int]$b) -band 0xff }
            if ($sum -ne 0) { throw "$($file.Name) additive checksum regression: $sum" }
          }

          $expected = @(
            @{ path='resources/presets/01_KONSER_NYANYI.k500';       name='KONSER NYANYI';    sha='761d0ecf1f470ce433fcf760d7ee1317e994dbefbb16fc71e8498aea9d99d6c4' },
            @{ path='resources/presets/02_MC_HOST_RADIO.k500';       name='MC HOST RADIO';    sha=$null },
            @{ path='resources/presets/03_KAR_DANGDUT.k500';name='KAR DANGDUT';      sha='ec683042962c635d8d87d262512a694797bd62842c07775e53eb497f34d329bc' },
            @{ path='resources/presets/04_POP_ROCK_BALLAD.k500';            name='POP ROCK BALLAD';  sha='d18c9ddf4d8ba9d5d5fa6f027b97cc31784138a510c1e35778b8995e380172f5' },
            @{ path='resources/presets/05_POP_KENANGAN_V2.k500';    name='POP KENANGAN V2';  sha='e0d6e985f068576a37ea776c1ed730b63bafac44d3afc80ab31f8541ff6398b5' },
            @{ path='resources/presets/06_SHOLAWAT_SYAHDU.k500';   name='SHOLAWAT SYAHDU';  sha='e7854512443699f6b3202db488a9d2d137162b4d4e756b4f7c34950a541f909c' },
            @{ path='resources/presets/07_JAZZ_LOUNGE.k500';            name='JAZZ LOUNGE';      sha='934caa877de5e8cb7ef2dfe8d12a99a4b804989807357ce62805e419b0a6bae7' },
            @{ path='resources/presets/08_BLUES_CLUB.k500';           name='BLUES CLUB';       sha='741bfa917a8d491070d18d223e4be7a5010d7c4edb171f2e0e65f95cbbe22146' },
            @{ path='resources/presets/09_ACOUSTIC_NATURAL.k500';        name='ACOUSTIC NATURAL'; sha='8a5ce6f8b310d24d47d755f99c5acf9b9d992f9a85a2e13ccb7156c0f1d8b81c' },
            @{ path='resources/presets/10_REGGAE_DUB.k500';          name='REGGAE DUB';       sha='1984d309db61c7258329765306e3e573e64730b04a5cd4472568c3f332742c90' }
          )
          foreach ($entry in $expected) {
            $bytes = [IO.File]::ReadAllBytes($entry.path)
            $nameBytes = $bytes[0x454..0x474]
            $name = [Text.Encoding]::ASCII.GetString($nameBytes).Split([char]0)[0].Trim()
            if ($name -ne $entry.name) { throw "$($entry.path) identity regression: '$name'" }
            if ($name.Length -gt 16) { throw "$($entry.path) visible name exceeds 16 characters: '$name'" }
            if ($entry.sha) {
              $sha = (Get-FileHash $entry.path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($sha -ne $entry.sha) { throw "$($entry.path) SHA-256 regression: $sha" }
            }
            $catalogToken = '{"' + $entry.name + '"'
            if (-not $bridge.Contains($catalogToken)) { throw "$($entry.path) built-in catalog identity is stale: $($entry.name)" }
          }
          Write-Host 'Official preset library structure + identity + cache/catalog parity PASS'
