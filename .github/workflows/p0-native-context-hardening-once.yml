name: P0 native context hardening once

on:
  push:
    branches: [hardening/p0-native-context-work]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P0 captured-native hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old[:120]!r}")
              text = text.replace(old, new, 1)
              p.write_text(text)

          # --- Protocol: canonical 24-bit bypass image and captured USB read mode ---
          replace_once('src/k500/K500Protocol.h',
          '''struct K500OutputBlockState\n{''',
          '''struct K500EqBypassImage\n{\n    quint8 m0 = 0;\n    quint8 m1 = 0;\n    quint8 m2 = 0;\n};\n\nstruct K500OutputBlockState\n{''')

          replace_once('src/k500/K500Protocol.h',
          '''QByteArray fxEqBypassMask(quint8 mask);''',
          '''bool setEqBypass(K500EqBypassImage &image, const QString &section, bool enabled);\nbool eqBypassEnabled(const K500EqBypassImage &image, const QString &section);\nQByteArray eqBypassWrite(const K500EqBypassImage &image);''')

          replace_once('src/k500/K500Protocol.cpp',
          '''quint8 outDbToRaw(double db)\n{\n    return K500Frame::clampByte(qRound(db * 2.0 + 75.0));\n}\n}''',
          '''quint8 outDbToRaw(double db)\n{\n    return K500Frame::clampByte(qRound(db * 2.0 + 75.0));\n}\n\nbool eqBypassSpec(const QString &section, int *byteIndex, quint8 *mask)\n{\n    const QString key = section.trimmed().toLower();\n    if (key == QStringLiteral("mic") || key == QStringLiteral("mica") || key == QStringLiteral("micb")) { *byteIndex = 0; *mask = 0x60; return true; }\n    if (key == QStringLiteral("music"))    { *byteIndex = 0; *mask = 0x80; return true; }\n    if (key == QStringLiteral("main"))     { *byteIndex = 1; *mask = 0x01; return true; }\n    if (key == QStringLiteral("surround")) { *byteIndex = 1; *mask = 0x04; return true; }\n    if (key == QStringLiteral("center"))   { *byteIndex = 1; *mask = 0x10; return true; }\n    if (key == QStringLiteral("sub") || key == QStringLiteral("subwoofer")) { *byteIndex = 1; *mask = 0x40; return true; }\n    if (key == QStringLiteral("reverb"))   { *byteIndex = 2; *mask = 0x01; return true; }\n    if (key == QStringLiteral("echo"))     { *byteIndex = 2; *mask = 0x02; return true; }\n    return false;\n}\n}\n''')

          replace_once('src/k500/K500Protocol.cpp',
          '''QByteArray fxEqBypassMask(quint8 mask)\n{\n    // FX_EQ_BYPASS_CAPTURED_V1 — native KTV writes a shared runtime bitmask\n    // through CMD 0x0F / subcommand 0x40 / address 0xFFFD. Capture proves\n    // bit0 = Reverb EQ bypass and bit1 = Echo EQ bypass; trailing byte is 0x02.\n    return K500Frame::build(bytes({0x06, 0x0F, 0x40, 0xFD, 0xFF, mask, 0x02}));\n}\n''',
          '''bool setEqBypass(K500EqBypassImage &image, const QString &section, bool enabled)\n{\n    int byteIndex = -1;\n    quint8 mask = 0;\n    if (!eqBypassSpec(section, &byteIndex, &mask))\n        return false;\n    quint8 *target = byteIndex == 0 ? &image.m0 : (byteIndex == 1 ? &image.m1 : &image.m2);\n    *target = enabled ? static_cast<quint8>(*target | mask)\n                      : static_cast<quint8>(*target & static_cast<quint8>(~mask));\n    return true;\n}\n\nbool eqBypassEnabled(const K500EqBypassImage &image, const QString &section)\n{\n    int byteIndex = -1;\n    quint8 mask = 0;\n    if (!eqBypassSpec(section, &byteIndex, &mask))\n        return false;\n    const quint8 value = byteIndex == 0 ? image.m0 : (byteIndex == 1 ? image.m1 : image.m2);\n    return (value & mask) == mask;\n}\n\nQByteArray eqBypassWrite(const K500EqBypassImage &image)\n{\n    // EQ_BYPASS_24BIT_CAPTURED_V2 — native KTV writes the complete shared\n    // 3-byte bypass image. Preserve every unrelated/reserved bit via RMW.\n    return K500Frame::build(bytes({0x06, 0x0F, 0x40, image.m0, image.m1, image.m2, 0x02}));\n}\n''')

          replace_once('src/k500/K500Protocol.cpp',
          '''    if (!expect(readBlock(0x0000, 0x003A, 0x00), {0xAA, 0x06, 0x40, 0x00, 0x00, 0x3A, 0x00, 0x00, 0x80}, QStringLiteral("USB read-block"))) return false;''',
          '''    if (!expect(readBlock(0x0000, 0x003A, 0x02), {0xAA, 0x06, 0x40, 0x00, 0x00, 0x3A, 0x00, 0x02, 0x7E}, QStringLiteral("USB read-block captured mode 0x02"))) return false;''')
          replace_once('src/k500/K500Protocol.cpp',
          '''    if (!expect(readBlock(0x03A0, 0x000B, 0x00), {0xAA, 0x06, 0x40, 0xA0, 0x03, 0x0B, 0x00, 0x00, 0x0C}, QStringLiteral("USB final read-block"))) return false;''',
          '''    if (!expect(readBlock(0x03A0, 0x000B, 0x02), {0xAA, 0x06, 0x40, 0xA0, 0x03, 0x0B, 0x00, 0x02, 0x0A}, QStringLiteral("USB final read-block captured mode 0x02"))) return false;''')

          old_bypass = '''    // FX_EQ_BYPASS_CAPTURED_V1 — exact USB donor vectors.\n    // 0x00 = both bypasses OFF, 0x01 = Reverb ON / Echo OFF,\n    // 0x03 = Reverb ON / Echo ON. Echo toggling in the donor capture alternates\n    // 0x01 <-> 0x03, proving that the two controls share one bitmask byte.\n    if (!expect(K500Frame::toUsbFrame(fxEqBypassMask(0x00)), {0xAA,0x06,0x00,0x0F,0x40,0xFD,0xFF,0x00,0x02,0xAD}, QStringLiteral("FX EQ bypass mask 0 USB capture"))) return false;\n    if (!expect(K500Frame::toUsbFrame(fxEqBypassMask(0x01)), {0xAA,0x06,0x00,0x0F,0x40,0xFD,0xFF,0x01,0x02,0xAC}, QStringLiteral("Reverb EQ bypass ON USB capture"))) return false;\n    if (!expect(K500Frame::toUsbFrame(fxEqBypassMask(0x03)), {0xAA,0x06,0x00,0x0F,0x40,0xFD,0xFF,0x03,0x02,0xAA}, QStringLiteral("Reverb and Echo EQ bypass ON USB capture"))) return false;\n'''
          new_bypass = '''    // EQ_BYPASS_24BIT_CAPTURED_V2 — sequential donor vectors prove one shared\n    // 24-bit image across Mic/Music/Main/Surround/Center/Sub/Reverb/Echo.\n    K500EqBypassImage bypass{0x1D, 0xAA, 0x00};\n    if (!expect(K500Frame::toUsbFrame(eqBypassWrite(bypass)), {0xAA,0x06,0x00,0x0F,0x40,0x1D,0xAA,0x00,0x02,0xE2}, QStringLiteral("EQ bypass baseline USB capture"))) return false;\n    if (!setEqBypass(bypass, QStringLiteral("sub"), true) || !expect(K500Frame::toUsbFrame(eqBypassWrite(bypass)), {0xAA,0x06,0x00,0x0F,0x40,0x1D,0xEA,0x00,0x02,0xA2}, QStringLiteral("Sub EQ bypass ON USB capture"))) return false;\n    if (!setEqBypass(bypass, QStringLiteral("center"), true) || !expect(K500Frame::toUsbFrame(eqBypassWrite(bypass)), {0xAA,0x06,0x00,0x0F,0x40,0x1D,0xFA,0x00,0x02,0x92}, QStringLiteral("Center EQ bypass ON USB capture"))) return false;\n    if (!setEqBypass(bypass, QStringLiteral("surround"), true) || !expect(K500Frame::toUsbFrame(eqBypassWrite(bypass)), {0xAA,0x06,0x00,0x0F,0x40,0x1D,0xFE,0x00,0x02,0x8E}, QStringLiteral("Surround EQ bypass ON USB capture"))) return false;\n    if (!setEqBypass(bypass, QStringLiteral("main"), true) || !expect(K500Frame::toUsbFrame(eqBypassWrite(bypass)), {0xAA,0x06,0x00,0x0F,0x40,0x1D,0xFF,0x00,0x02,0x8D}, QStringLiteral("Main EQ bypass ON USB capture"))) return false;\n    if (!setEqBypass(bypass, QStringLiteral("mic"), true) || !expect(K500Frame::toUsbFrame(eqBypassWrite(bypass)), {0xAA,0x06,0x00,0x0F,0x40,0x7D,0xFF,0x00,0x02,0x2D}, QStringLiteral("Mic EQ bypass ON USB capture"))) return false;\n    if (!setEqBypass(bypass, QStringLiteral("music"), true) || !expect(K500Frame::toUsbFrame(eqBypassWrite(bypass)), {0xAA,0x06,0x00,0x0F,0x40,0xFD,0xFF,0x00,0x02,0xAD}, QStringLiteral("Music EQ bypass ON USB capture"))) return false;\n    if (!setEqBypass(bypass, QStringLiteral("reverb"), true) || !expect(K500Frame::toUsbFrame(eqBypassWrite(bypass)), {0xAA,0x06,0x00,0x0F,0x40,0xFD,0xFF,0x01,0x02,0xAC}, QStringLiteral("Reverb EQ bypass ON USB capture"))) return false;\n    if (!setEqBypass(bypass, QStringLiteral("echo"), true) || !expect(K500Frame::toUsbFrame(eqBypassWrite(bypass)), {0xAA,0x06,0x00,0x0F,0x40,0xFD,0xFF,0x03,0x02,0xAA}, QStringLiteral("Echo EQ bypass ON USB capture"))) return false;\n    if (!eqBypassEnabled(bypass, QStringLiteral("mic")) || !eqBypassEnabled(bypass, QStringLiteral("echo"))) return fail(QStringLiteral("EQ bypass decode mismatch"));\n'''
          replace_once('src/k500/K500Protocol.cpp', old_bypass, new_bypass)

          # --- Controller: hydrate/read-modify-write the complete bypass image ---
          replace_once('src/k500/K500Controller.h',
          '''    void queueFxEqBypass(const QString &path);''',
          '''    void queueEqBypass(const QString &path);''')
          replace_once('src/k500/K500Controller.h',
          '''    quint8 m_fxEqBypassMask = 0;''',
          '''    K500EqBypassImage m_eqBypass;\n    bool m_eqBypassReady = false;''')

          replace_once('src/k500/K500Controller.cpp',
          '''    m_echo.leftPredelayMs = fileU16(memory, 0x00CE, 100);\n    m_echoRaw = echoSeed(memory);\n''',
          '''    m_echo.leftPredelayMs = fileU16(memory, 0x00CE, 100);\n    m_echoRaw = echoSeed(memory);\n\n    // EQ_BYPASS_24BIT_CAPTURED_V2 — Retrieve All contains the authoritative\n    // shared bypass image at active-memory offsets 0x027D..0x027F. Hydrate it\n    // before LIVE is enabled so the first toggle can always be a safe RMW.\n    m_eqBypass = K500EqBypassImage{byteAt(memory, 0x027D), byteAt(memory, 0x027E), byteAt(memory, 0x027F)};\n    m_eqBypassReady = memory.size() > 0x027F;\n''')

          replace_once('src/k500/K500Controller.cpp',
          '''    // FX_EQ_BYPASS_CAPTURED_V1 — no readback form of runtime register 0xFFFD\n    // has been captured, so a fresh device session starts from the UI default.\n    m_fxEqBypassMask = 0;''',
          '''    m_eqBypass = K500EqBypassImage{};\n    m_eqBypassReady = false;''')

          pattern = re.compile(r'''    // FX_EQ_BYPASS_CAPTURED_V1 — shared register 0xFFFD bit0=Reverb, bit1=Echo\.\n    // Always update only the selected bit so toggling one section cannot silently\n    // disable the other section's bypass state\.\n    if \(path == QStringLiteral\("eq\.reverb\.bypass"\) \|\| path == QStringLiteral\("eq\.echo\.bypass"\)\) \{.*?        return;\n    \}\n''', re.S)
          p = Path('src/k500/K500Controller.cpp')
          text = p.read_text()
          replacement = '''    // EQ_BYPASS_24BIT_CAPTURED_V2 — every PEQ bypass button edits one bit-group\n    // inside the same device-owned 24-bit image. Never synthesize a mask from UI\n    // defaults; only mutate the Retrieve-All snapshot and preserve all other bits.\n    static const QRegularExpression eqBypassPath(QStringLiteral(R"(^eq\\.(mic|music|main|surround|center|sub|reverb|echo)\\.bypass$)"));\n    if (const auto match = eqBypassPath.match(path); match.hasMatch()) {\n        if (!m_liveEnabled || !m_eqBypassReady) {\n            emit writeDeferred(path, QStringLiteral("EQ bypass write requires complete device Retrieve All hydration"));\n            return;\n        }\n        const QString section = match.captured(1);\n        if (!K500Protocol::setEqBypass(m_eqBypass, section, value.toBool())) {\n            emit unsupportedPath(path);\n            return;\n        }\n        if (m_activeMemory.size() > 0x027F) {\n            m_activeMemory[0x027D] = char(m_eqBypass.m0);\n            m_activeMemory[0x027E] = char(m_eqBypass.m1);\n            m_activeMemory[0x027F] = char(m_eqBypass.m2);\n        }\n        queueEqBypass(path);\n        return;\n    }\n'''
          text2, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit('failed to replace Controller EQ bypass routing')
          p.write_text(text2)

          pattern = re.compile(r'''void K500Controller::queueFxEqBypass\(const QString &path\)\n\{.*?\n\}\n\nvoid K500Controller::queueOutput''', re.S)
          p = Path('src/k500/K500Controller.cpp')
          text = p.read_text()
          replacement = '''void K500Controller::queueEqBypass(const QString &path)\n{\n    if (!m_liveEnabled || !m_eqBypassReady)\n        return;\n    queueBlockFrame(QStringLiteral("eq:bypass-global"), K500Protocol::eqBypassWrite(m_eqBypass),\n                    QStringLiteral("EQ Bypass · %1 · %2 %3 %4")\n                        .arg(path)\n                        .arg(m_eqBypass.m0, 2, 16, QLatin1Char('0'))\n                        .arg(m_eqBypass.m1, 2, 16, QLatin1Char('0'))\n                        .arg(m_eqBypass.m2, 2, 16, QLatin1Char('0')));\n}\n\nvoid K500Controller::queueOutput'''
          text2, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit('failed to replace queueFxEqBypass')
          p.write_text(text2)

          # --- Native startup Retrieve All uses USB mode byte 0x02 ---
          replace_once('src/k500/K500DeviceManager.cpp',
          '''    const quint8 mode = m_io.kind() == K500WinIo::Kind::UsbHid ? 0x00 : 0x63;''',
          '''    // RETRIEVE_ALL_USB_MODE02_CAPTURED_V1 — native KTV startup capture.\n    const quint8 mode = m_io.kind() == K500WinIo::Kind::UsbHid ? 0x02 : 0x63;''')

          # --- StudioEngine: expose authoritative startup bypass state to the UI ---
          replace_once('src/StudioEngine.cpp',
          '''#include "StudioEngine.h"\n\n#include <QtMath>''',
          '''#include "StudioEngine.h"\n#include "k500/K500Protocol.h"\n\n#include <QtMath>''')
          replace_once('src/StudioEngine.cpp',
          '''    QVariantMap eqState;\n    for (const LiveEqDescriptor &section : LiveEqSections) {''',
          '''    const K500EqBypassImage eqBypass{byteAt(memory, 0x027D), byteAt(memory, 0x027E), byteAt(memory, 0x027F)};\n    QVariantMap eqState;\n    for (const LiveEqDescriptor &section : LiveEqSections) {''')
          replace_once('src/StudioEngine.cpp',
          '''        eqState.insert(key, QVariantMap{\n            {QStringLiteral("bands"), bands},\n            {QStringLiteral("hpfHz"), hpf},\n            {QStringLiteral("lpfHz"), lpf},\n            {QStringLiteral("hpType"), hpType},\n            {QStringLiteral("lpType"), lpType},\n        });''',
          '''        QString bypassKey = key;\n        if (key == QStringLiteral("micA") || key == QStringLiteral("micB")) bypassKey = QStringLiteral("mic");\n        else if (key.endsWith(QStringLiteral("Alt"))) bypassKey.chop(3);\n        eqState.insert(key, QVariantMap{\n            {QStringLiteral("bands"), bands},\n            {QStringLiteral("hpfHz"), hpf},\n            {QStringLiteral("lpfHz"), lpf},\n            {QStringLiteral("hpType"), hpType},\n            {QStringLiteral("lpType"), lpType},\n            {QStringLiteral("bypass"), K500Protocol::eqBypassEnabled(eqBypass, bypassKey)},\n        });''')

          # --- QML: every captured PEQ bypass is native/non-destructive ---
          p = Path('qml/components/SectionEqGraph.qml')
          text = p.read_text()
          old = '''    // FX_EQ_BYPASS_CAPTURED_V1 — only Reverb/Echo currently have a verified\n    // hardware PEQ-bypass command. Other sections keep the reversible local\n    // zero-gain audition until their own native bypass captures exist.\n    readonly property string nativeFxEqBypassKey: {\n        var key = String(root.sectionLabel || "").trim().toLowerCase()\n        return key === "reverb" || key === "echo" ? key : ""\n    }\n'''
          new = '''    // EQ_BYPASS_24BIT_CAPTURED_V2 — all visible PEQ sections now use the\n    // captured native shared bypass image; no section destructively zeros bands.\n    readonly property string nativeEqBypassKey: {\n        var key = String(root.sectionLabel || "").trim().toLowerCase()\n        if (key === "mic a" || key === "mic b") return "mic"\n        if (key === "subwoofer") return "sub"\n        if (key === "music" || key === "reverb" || key === "echo" || key === "main" || key === "surround" || key === "center" || key === "sub") return key\n        return ""\n    }\n    readonly property string deviceEqStateKey: {\n        var key = String(root.sectionLabel || "").trim().toLowerCase()\n        if (key === "mic a") return "micA"\n        if (key === "mic b") return "micB"\n        if (key === "subwoofer") return "sub"\n        return root.nativeEqBypassKey\n    }\n'''
          if old not in text: raise SystemExit('SectionEqGraph native bypass key block not found')
          text = text.replace(old, new, 1)

          old_func = re.compile(r'''    function setEqBypass\(enabled\)\{.*?\n    \}\n    function selectCompareSide''', re.S)
          new_func = '''    function deviceEqBypassValue(){\n        if(!root.engine || !root.engine.deviceStateReady || !root.deviceEqStateKey.length)return false\n        var eq=root.engine.deviceState ? root.engine.deviceState.eq : null\n        var section=eq ? eq[root.deviceEqStateKey] : null\n        return section && section.bypass !== undefined ? Boolean(section.bypass) : false\n    }\n    function syncEqBypassFromDevice(){\n        if(!root.engine || !root.engine.deviceStateReady || !root.nativeEqBypassKey.length)return\n        root.eqBypassActive=root.deviceEqBypassValue()\n        root.bypassSnapshot=null\n        curve.requestPaint()\n    }\n    function setEqBypass(enabled){\n        if(enabled===eqBypassActive)return\n        if(!root.nativeEqBypassKey.length)return\n        if(enabled)saveCompareSide()\n        eqBypassActive=enabled\n        bypassSnapshot=null\n        if(root.engine && typeof root.engine.editDevicePath === "function")\n            root.engine.editDevicePath("eq." + root.nativeEqBypassKey + ".bypass", enabled)\n        if(!enabled)updateActiveCompareSnapshot()\n        curve.requestPaint()\n    }\n    function selectCompareSide'''
          text2, n = old_func.subn(new_func, text, count=1)
          if n != 1: raise SystemExit('SectionEqGraph setEqBypass function not replaced')
          text = text2
          old_comp = '''    Component.onCompleted: {\n        ensureStartupCrossoverDefaults()\n        selectBand(0)\n        Qt.callLater(function(){root.primeCompareFromCurrent()})\n    }'''
          new_comp = '''    Component.onCompleted: {\n        ensureStartupCrossoverDefaults()\n        selectBand(0)\n        Qt.callLater(function(){root.primeCompareFromCurrent();root.syncEqBypassFromDevice()})\n    }\n\n    Connections {\n        target: root.engine\n        function onDeviceStateChanged(){ root.syncEqBypassFromDevice() }\n    }'''
          if old_comp not in text: raise SystemExit('SectionEqGraph Component.onCompleted block not found')
          text = text.replace(old_comp, new_comp, 1)
          p.write_text(text)

          # --- Echo live UX: activate all capture-verified knobs ---
          replace_once('qml/components/RackFaderPanel.qml',
          '''        // ECHO_DIRECT_KNOB_PREP_V1 — Echo DIRECT is intentionally presentation-only\n        // until a native donor capture proves its command and byte position. Do not\n        // guess a transport path just to make the prepared control appear live.\n        if (t === "Echo") return ""''',
          '''        // ECHO_CMD0D_LIVE_BRIDGE_V2 — donor captures verify all four visible\n        // Echo controls as fields in the same native full-image CMD 0x0D.\n        if (t === "Echo") {\n            if (l === "LEVEL") return "effects.echo.level"\n            if (l === "REPEAT") return "effects.echo.repeat"\n            if (l === "DELAY") return "effects.echo.leftDelayMs"\n            if (l === "DIRECT") return "effects.echo.direct"\n            return ""\n        }''')

          replace_once('qml/components/SectionWorkspace.qml',
          '''                                    // ECHO_DIRECT_KNOB_PREP_V1 — reserve the fourth knob now so the\n                                    // final native mapping can be enabled without another UX reflow.\n                                    // It remains disabled until a donor capture verifies the write path.\n                                    channels: [\n                                        {label:"LEVEL",value:Number(root.nestedValue("effects","echo","level",100)),from:0,to:100,step:1,unit:"%",decimals:0},\n                                        {label:"REPEAT",value:Number(root.nestedValue("effects","echo","repeat",12)),from:0,to:100,step:1,unit:"",decimals:0},\n                                        {label:"DELAY",value:Number(root.nestedValue("effects","echo","leftDelayMs",400)),from:0,to:1000,step:1,unit:"ms",decimals:0},\n                                        {label:"DIRECT",value:Number(root.nestedValue("effects","echo","direct",100)),from:0,to:100,step:1,unit:"%",decimals:0,editable:false}\n                                    ]''',
          '''                                    // ECHO_CMD0D_CAPTURED_V2 — all four visible controls are live\n                                    // native fields; REPEAT uses the captured 0..10 scalar range.\n                                    channels: [\n                                        {label:"LEVEL",value:Number(root.nestedValue("effects","echo","level",100)),from:0,to:100,step:1,unit:"%",decimals:0},\n                                        {label:"REPEAT",value:Number(root.nestedValue("effects","echo","repeat",2)),from:0,to:10,step:1,unit:"",decimals:0},\n                                        {label:"DELAY",value:Number(root.nestedValue("effects","echo","leftDelayMs",300)),from:0,to:1000,step:1,unit:"ms",decimals:0},\n                                        {label:"DIRECT",value:Number(root.nestedValue("effects","echo","direct",100)),from:0,to:100,step:1,unit:"%",decimals:0}\n                                    ]''')

          # Leave a compact permanent protocol note; remove this one-shot workflow.
          Path('docs/P0_NATIVE_CONTEXT_HARDENING.md').write_text('''# P0 Native Context Hardening\n\nCaptured-native invariants implemented in P0:\n\n- USB startup Retrieve All uses `CMD 0x40` mode byte `0x02`, 58-byte blocks, 939-byte active memory.\n- EQ bypass is one shared 24-bit image written by `CMD 0x0F`: `40 M0 M1 M2 02`.\n- Retrieve All owns the initial bypass image at active-memory offsets `0x027D..0x027F`.\n- Bypass mapping: Mic `M0:0x60`, Music `M0:0x80`, Main `M1:0x01`, Surround `M1:0x04`, Center `M1:0x10`, Sub `M1:0x40`, Reverb `M2:0x01`, Echo `M2:0x02`.\n- Every bypass edit is read/modify/write against the hydrated device image; unrelated bits are preserved.\n- Reverb remains full-image `CMD 0x0B`; Echo remains full-image `CMD 0x0D`; unknown bytes are preserved from device truth.\n- Echo LEVEL/REPEAT/LEFT DELAY/DIRECT are capture-verified live controls.\n''')
          PY
          git rm .github/workflows/p0-native-context-hardening-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/k500/K500Protocol.h src/k500/K500Protocol.cpp src/k500/K500Controller.h src/k500/K500Controller.cpp src/k500/K500DeviceManager.cpp src/StudioEngine.cpp qml/components/SectionEqGraph.qml qml/components/RackFaderPanel.qml qml/components/SectionWorkspace.qml docs/P0_NATIVE_CONTEXT_HARDENING.md
          git commit -m "Harden P0 native device context and EQ bypass"
          git push
