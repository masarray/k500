name: One-shot Reverb DIRECT fader patch

on:
  push:
    branches:
      - fix/reverb-native-command

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reverb-native-command
          fetch-depth: 0

      - name: Add native Reverb DIRECT fader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Wire device-state DIRECT value into the Reverb rack.
          workspace_path = Path('qml/components/SectionWorkspace.qml')
          workspace = workspace_path.read_text(encoding='utf-8')
          ws_old = '''                                    title: "Reverb"\n                                    channels: [\n'''
          ws_new = '''                                    title: "Reverb"\n                                    // REVERB_DIRECT_FADER_NATIVE_V1 — captured CMD 0x0B data[2].\n                                    directValue: Number(root.nestedValue("effects","reverb","direct",100))\n                                    channels: [\n'''
          if 'REVERB_DIRECT_FADER_NATIVE_V1' not in workspace:
              if ws_old not in workspace:
                  raise SystemExit('Reverb RackFaderPanel anchor not found in SectionWorkspace.qml')
              workspace = workspace.replace(ws_old, ws_new, 1)
              workspace_path.write_text(workspace, encoding='utf-8')

          # 2) Add a dedicated console-style DIRECT fader to the compact Reverb instrument surface.
          rack_path = Path('qml/components/RackFaderPanel.qml')
          rack = rack_path.read_text(encoding='utf-8')
          if 'property real directValue: 100' not in rack:
              anchor = '    property color accentColor: Theme.accent\n'
              if anchor not in rack:
                  raise SystemExit('RackFaderPanel accentColor anchor not found')
              rack = rack.replace(anchor, anchor + '    property real directValue: 100\n', 1)

          rack = rack.replace(
              '    // as a dedicated instrument surface: three premium knobs at the left and a\n',
              '    // as a dedicated instrument surface: three premium knobs at the left, the\n'
              '    // captured native DIRECT fader on Reverb, and a\n',
              1)
          rack = rack.replace(
              '        // fields are exposed here. DIRECT is supported by the backend for future UI use.\n',
              '        // fields are exposed here. DIRECT is rendered by the native-style Reverb fader.\n',
              1)

          if 'id: reverbDirectFader' not in rack:
              field_anchor = '''                Item {\n                    id: fieldSlot\n'''
              direct_block = '''                // REVERB_DIRECT_FADER_NATIVE_V1 — native KTV exposes DIRECT as an\n                // independent 0..100 control. Keep the three spatial-design knobs intact\n                // and add DIRECT as a real console fader backed by CMD 0x0B data[2].\n                Item {\n                    visible: root.reverbMode\n                    Layout.preferredWidth: 64\n                    Layout.minimumWidth: 64\n                    Layout.maximumWidth: 64\n                    Layout.fillHeight: true\n\n                    ColumnLayout {\n                        anchors.fill: parent\n                        spacing: 3\n\n                        Text {\n                            Layout.alignment: Qt.AlignHCenter\n                            text: "DIRECT"\n                            color: reverbDirectFader.highlighted ? root.accentColor : Theme.textDim\n                            font.family: Theme.monoFamily\n                            font.pixelSize: 9\n                            font.weight: reverbDirectFader.highlighted ? Font.Bold : Font.DemiBold\n                            font.letterSpacing: .35\n                            Behavior on color { ColorAnimation { duration:75 } }\n                        }\n\n                        StudioFader {\n                            id: reverbDirectFader\n                            Layout.alignment: Qt.AlignHCenter\n                            Layout.preferredWidth: 48\n                            value: root.directValue\n                            from: 0\n                            to: 100\n                            step: 1\n                            defaultValue: 100\n                            accentColor: root.accentColor\n                            onValueEdited: function(v) { root.dispatchLive("DIRECT",v) }\n                        }\n\n                        Rectangle {\n                            Layout.alignment: Qt.AlignHCenter\n                            Layout.preferredWidth: 58\n                            Layout.preferredHeight: 23\n                            radius: 8\n                            color: reverbDirectFader.highlighted ? "#081013" : "#05080A"\n                            border.width: 1\n                            border.color: reverbDirectFader.highlighted ? root.accentColor : "#020304"\n                            Row {\n                                anchors.centerIn: parent\n                                spacing: 3\n                                Text {\n                                    text: Math.round(reverbDirectFader.previewValue)\n                                    color: Theme.amber\n                                    font.family: Theme.monoFamily\n                                    font.pixelSize: 9\n                                    font.weight: Font.Bold\n                                }\n                                Text {\n                                    text: "%"\n                                    color: reverbDirectFader.highlighted ? Theme.textSoft : Theme.textDim\n                                    font.family: Theme.monoFamily\n                                    font.pixelSize: 7\n                                }\n                            }\n                            Behavior on border.color { ColorAnimation { duration:75 } }\n                        }\n\n                        Item { Layout.fillHeight: true }\n                    }\n                }\n\n'''
              if field_anchor not in rack:
                  raise SystemExit('RackFaderPanel fieldSlot anchor not found')
              rack = rack.replace(field_anchor, direct_block + field_anchor, 1)

          rack_path.write_text(rack, encoding='utf-8')

          # 3) Extend the existing FX guard so DIRECT cannot regress out of the UI.
          guard_path = Path('.github/workflows/p1-fx-rack-centering.yml')
          guard = guard_path.read_text(encoding='utf-8')
          if "- 'qml/components/SectionWorkspace.qml'" not in guard:
              guard = guard.replace(
                  "      - 'qml/components/RackFaderPanel.qml'\n",
                  "      - 'qml/components/RackFaderPanel.qml'\n      - 'qml/components/SectionWorkspace.qml'\n",
                  1)
          if "workspace = Path('qml/components/SectionWorkspace.qml')" not in guard:
              guard = guard.replace(
                  "          rack = Path('qml/components/RackFaderPanel.qml').read_text(encoding='utf-8')\n",
                  "          rack = Path('qml/components/RackFaderPanel.qml').read_text(encoding='utf-8')\n          workspace = Path('qml/components/SectionWorkspace.qml').read_text(encoding='utf-8')\n",
                  1)
          direct_check = "              'captured Reverb DIRECT fader remains live': 'REVERB_DIRECT_FADER_NATIVE_V1' in rack and 'property real directValue: 100' in rack and 'id: reverbDirectFader' in rack and 'root.dispatchLive(\"DIRECT\",v)' in rack and 'directValue: Number(root.nestedValue(\"effects\",\"reverb\",\"direct\",100))' in workspace,\n"
          if 'captured Reverb DIRECT fader remains live' not in guard:
              check_anchor = "              'three premium knobs remain parameter-driven': 'premium: true' in rack and 'model: root.channels' in rack,\n"
              if check_anchor not in guard:
                  raise SystemExit('Premium FX guard check anchor not found')
              guard = guard.replace(check_anchor, check_anchor + direct_check, 1)
          guard_path.write_text(guard, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- qml/components/RackFaderPanel.qml qml/components/SectionWorkspace.qml .github/workflows/p1-fx-rack-centering.yml; then
            echo 'DIRECT fader patch already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qml/components/RackFaderPanel.qml qml/components/SectionWorkspace.qml .github/workflows/p1-fx-rack-centering.yml
          git commit -m 'Add native Reverb DIRECT fader'
          git push origin HEAD:fix/reverb-native-command
