name: Native K500 Control Limits

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/k500/K500NativeLimits.h'
      - 'src/k500/K500Protocol.cpp'
      - 'src/k500/K500Controller.cpp'
      - 'src/StudioEngine.*'
      - 'qml/components/SectionWorkspace.qml'
      - 'qml/components/RackFaderPanel.qml'
      - 'qml/components/MasterStripPanel.qml'
      - 'qml/components/MusicInputPanel.qml'
      - 'docs/K500_NATIVE_CONTROL_LIMITS.md'
      - '.github/workflows/native-control-limits.yml'
  pull_request:
    paths:
      - 'src/k500/K500NativeLimits.h'
      - 'src/k500/K500Protocol.cpp'
      - 'src/k500/K500Controller.cpp'
      - 'src/StudioEngine.*'
      - 'qml/components/SectionWorkspace.qml'
      - 'qml/components/RackFaderPanel.qml'
      - 'qml/components/MasterStripPanel.qml'
      - 'qml/components/MusicInputPanel.qml'
      - 'docs/K500_NATIVE_CONTROL_LIMITS.md'
      - '.github/workflows/native-control-limits.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard physical native endpoint contract
        shell: python
        run: |
          from pathlib import Path

          limits = Path('src/k500/K500NativeLimits.h').read_text(encoding='utf-8')
          protocol = Path('src/k500/K500Protocol.cpp').read_text(encoding='utf-8')
          controller = Path('src/k500/K500Controller.cpp').read_text(encoding='utf-8')
          engine = Path('src/StudioEngine.cpp').read_text(encoding='utf-8')
          qml = Path('qml/components/SectionWorkspace.qml').read_text(encoding='utf-8')
          rack = Path('qml/components/RackFaderPanel.qml').read_text(encoding='utf-8')
          master = Path('qml/components/MasterStripPanel.qml').read_text(encoding='utf-8')
          music_input = Path('qml/components/MusicInputPanel.qml').read_text(encoding='utf-8')
          doc = Path('docs/K500_NATIVE_CONTROL_LIMITS.md').read_text(encoding='utf-8')

          expected_limits = {
              'namespace TopVolume': 'Top volume domain',
              'Max = 84': 'Top volume maximum',
              'namespace MusicInputGain': 'Music input gain domain',
              'MinDb = -12.0': 'Music input gain minimum',
              'MaxDb = 12.0': 'Music input gain maximum',
              'namespace MicFbx': 'Mic FBX domain',
              'Max = 3': 'Mic FBX maximum',
              'DecayMinMs = 500': 'Reverb decay minimum',
              'DecayMaxMs = 5000': 'Reverb decay maximum',
              'PredelayMinMs = 0': 'Reverb predelay minimum',
              'PredelayMaxMs = 100': 'Reverb predelay maximum',
              'HpfMinHz = 20': 'Reverb HPF minimum',
              'HpfMaxHz = 1000': 'Reverb HPF maximum',
              'LpfMinHz = 4000': 'Reverb LPF minimum',
              'LpfMaxHz = 16000': 'Reverb LPF maximum',
          }

          failed = []
          for token, label in expected_limits.items():
              if token not in limits:
                  failed.append(label)

          checks = {
              'protocol clamps to native limits': 'K500NativeLimits::Reverb::DecayMinMs' in protocol and 'K500NativeLimits::Reverb::LpfMaxHz' in protocol,
              'controller clamps to native limits': 'K500NativeLimits::Reverb::PredelayMaxMs' in controller and 'K500NativeLimits::Reverb::HpfMaxHz' in controller,
              'engine exposes native limits': 'QVariantMap StudioEngine::nativeLimits() const' in engine,
              'qml consumes native limits': 'nativeLimit("reverb","decayMinMs",500)' in qml and 'nativeLimit("reverb","lpfMaxHz",16000)' in qml,
              'master strip consumes registry': 'nativeLimit("topVolume","max",84)' in master,
              'music input consumes registry': music_input.count('nativeLimit("musicInputGain","minDb",-12)') >= 5 and music_input.count('nativeLimit("musicInputGain","maxDb",12)') >= 5,
              'FBX consumes registry': 'nativeLimit("micFbx","max",3)' in qml,
              'effect filter types are hidden': qml.count('showTypes: false') >= 2,
              'Reverb visual uses native timing endpoints': '(root.fxVisual1 - 500) / 4500.0' in rack and 'root.fxVisual2 / 100.0' in rack,
              'evidence doc records native V3.10': 'native KTV V3.10' in doc and '500 ms' in doc and '16000 Hz' in doc,
              'historical evidence is recoverable': '8524101578b18e96ffb5a8381b83036e37260718' in doc and 'a61b4ba3c3580d785f14123391de6d441ae71898' in doc and '6ca67ff22c7dd706f8c1bc53f59c81189ade7487' in doc,
              'wire width warning is explicit': 'Wire width is NOT a UI-domain specification' in limits,
          }
          failed += [name for name, ok in checks.items() if not ok]

          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + '  ' + name)

          if failed:
              raise SystemExit('Native limit contract failed: ' + ', '.join(failed))

          print('ALL NATIVE K500 CONTROL LIMIT GUARDS PASSED')
