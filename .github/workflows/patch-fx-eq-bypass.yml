name: Patch native FX EQ bypass

on:
  push:
    branches:
      - fix/echo-native-command

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/echo-native-command
          fetch-depth: 1

      - name: Implement captured Reverb and Echo EQ bypass
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Protocol declaration.
          replace_once(
              'src/k500/K500Protocol.h',
              '''QByteArray echoBlock(const K500EchoBlockState &state, const QByteArray &deviceData);\nQByteArray outputBlock(const QString &section,\n''',
              '''QByteArray echoBlock(const K500EchoBlockState &state, const QByteArray &deviceData);\nQByteArray fxEqBypassMask(quint8 mask);\nQByteArray outputBlock(const QString &section,\n''',
              'protocol header bypass declaration')

          # Native 0xFFFD shared bitmask command captured from both FX sections.
          replace_once(
              'src/k500/K500Protocol.cpp',
              '''QByteArray outputBlock(const QString &section,\n''',
              '''QByteArray fxEqBypassMask(quint8 mask)\n{\n    // FX_EQ_BYPASS_CAPTURED_V1 — native KTV writes a shared runtime bitmask\n    // through CMD 0x0F / subcommand 0x40 / address 0xFFFD. Capture proves\n    // bit0 = Reverb EQ bypass and bit1 = Echo EQ bypass; trailing byte is 0x02.\n    return K500Frame::build(bytes({0x06, 0x0F, 0x40, 0xFD, 0xFF, mask, 0x02}));\n}\n\nQByteArray outputBlock(const QString &section,\n''',
              'protocol bypass builder')

          replace_once(
              'src/k500/K500Protocol.cpp',
              '''    if (!expect(micEqLink(false), {0xAA, 0x04, 0x3C, 0x00, 0x00, 0xC4, 0xFC}, QStringLiteral("mic EQ link off"))) return false;\n''',
              '''    // FX_EQ_BYPASS_CAPTURED_V1 — exact USB donor vectors.\n    // 0x00 = both bypasses OFF, 0x01 = Reverb ON / Echo OFF,\n    // 0x03 = Reverb ON / Echo ON. Echo toggling in the donor capture alternates\n    // 0x01 <-> 0x03, proving that the two controls share one bitmask byte.\n    if (!expect(K500Frame::toUsbFrame(fxEqBypassMask(0x00)), {0xAA,0x06,0x00,0x0F,0x40,0xFD,0xFF,0x00,0x02,0xAD}, QStringLiteral("FX EQ bypass mask 0 USB capture"))) return false;\n    if (!expect(K500Frame::toUsbFrame(fxEqBypassMask(0x01)), {0xAA,0x06,0x00,0x0F,0x40,0xFD,0xFF,0x01,0x02,0xAC}, QStringLiteral("Reverb EQ bypass ON USB capture"))) return false;\n    if (!expect(K500Frame::toUsbFrame(fxEqBypassMask(0x03)), {0xAA,0x06,0x00,0x0F,0x40,0xFD,0xFF,0x03,0x02,0xAA}, QStringLiteral("Reverb and Echo EQ bypass ON USB capture"))) return false;\n\n    if (!expect(micEqLink(false), {0xAA, 0x04, 0x3C, 0x00, 0x00, 0xC4, 0xFC}, QStringLiteral("mic EQ link off"))) return false;\n''',
              'protocol bypass golden vectors')

          # Controller declaration/state.
          replace_once(
              'src/k500/K500Controller.h',
              '''    void queueReverb(const QString &path);\n    void queueEcho(const QString &path);\n    void queueOutput(const QString &section, const QString &path);\n''',
              '''    void queueReverb(const QString &path);\n    void queueEcho(const QString &path);\n    void queueFxEqBypass(const QString &path);\n    void queueOutput(const QString &section, const QString &path);\n''',
              'controller bypass queue declaration')

          replace_once(
              'src/k500/K500Controller.h',
              '''    K500EchoBlockState m_echo;\n    QByteArray m_echoRaw;\n    QHash<QString, K500OutputBlockState> m_outputs;\n''',
              '''    K500EchoBlockState m_echo;\n    QByteArray m_echoRaw;\n    quint8 m_fxEqBypassMask = 0;\n    QHash<QString, K500OutputBlockState> m_outputs;\n''',
              'controller bypass state')

          # Runtime route. Preserve the other FX bit on every toggle.
          replace_once(
              'src/k500/K500Controller.cpp',
              '''    m_echo = K500EchoBlockState{};\n    m_echoRaw.clear();\n    m_outputs.clear();\n''',
              '''    m_echo = K500EchoBlockState{};\n    m_echoRaw.clear();\n    // FX_EQ_BYPASS_CAPTURED_V1 — no readback form of runtime register 0xFFFD\n    // has been captured, so a fresh device session starts from the UI default.\n    m_fxEqBypassMask = 0;\n    m_outputs.clear();\n''',
              'controller bypass reset')

          replace_once(
              'src/k500/K500Controller.cpp',
              '''    if (const auto match = echoPath.match(path); match.hasMatch()) {\n        if (updateEchoState(match.captured(1), value)) {\n            queueEcho(path);\n            return;\n        }\n    }\n\n    bool isTopMusicPath = true;\n''',
              '''    if (const auto match = echoPath.match(path); match.hasMatch()) {\n        if (updateEchoState(match.captured(1), value)) {\n            queueEcho(path);\n            return;\n        }\n    }\n\n    // FX_EQ_BYPASS_CAPTURED_V1 — shared register 0xFFFD bit0=Reverb, bit1=Echo.\n    // Always update only the selected bit so toggling one section cannot silently\n    // disable the other section's bypass state.\n    if (path == QStringLiteral("eq.reverb.bypass") || path == QStringLiteral("eq.echo.bypass")) {\n        const quint8 bit = path == QStringLiteral("eq.reverb.bypass") ? quint8(0x01) : quint8(0x02);\n        if (value.toBool())\n            m_fxEqBypassMask = static_cast<quint8>(m_fxEqBypassMask | bit);\n        else\n            m_fxEqBypassMask = static_cast<quint8>(m_fxEqBypassMask & static_cast<quint8>(~bit));\n        queueFxEqBypass(path);\n        return;\n    }\n\n    bool isTopMusicPath = true;\n''',
              'controller bypass route')

          replace_once(
              'src/k500/K500Controller.cpp',
              '''    queueBlockFrame(QStringLiteral("fx:echo"), K500Protocol::echoBlock(m_echo, m_echoRaw),\n                    QStringLiteral("Echo · %1").arg(path));\n}\n\nvoid K500Controller::queueOutput(const QString &section, const QString &path)\n''',
              '''    queueBlockFrame(QStringLiteral("fx:echo"), K500Protocol::echoBlock(m_echo, m_echoRaw),\n                    QStringLiteral("Echo · %1").arg(path));\n}\n\nvoid K500Controller::queueFxEqBypass(const QString &path)\n{\n    if (!m_liveEnabled)\n        return;\n    queueBlockFrame(QStringLiteral("fx:eq-bypass"), K500Protocol::fxEqBypassMask(m_fxEqBypassMask),\n                    QStringLiteral("FX EQ Bypass · %1 · mask 0x%2")\n                        .arg(path)\n                        .arg(m_fxEqBypassMask, 2, 16, QLatin1Char('0')));\n}\n\nvoid K500Controller::queueOutput(const QString &section, const QString &path)\n''',
              'controller bypass queue')

          # QML: Reverb/Echo now use native non-destructive bypass instead of
          # rewriting five band gains to zero and then restoring them.
          replace_once(
              'qml/components/SectionEqGraph.qml',
              '''    property var bypassSnapshot: null\n    property bool eqBypassActive: false\n\n    // PEQ_AB_AUTO_ACTIVE_V2\n''',
              '''    property var bypassSnapshot: null\n    property bool eqBypassActive: false\n    // FX_EQ_BYPASS_CAPTURED_V1 — only Reverb/Echo currently have a verified\n    // hardware PEQ-bypass command. Other sections keep the reversible local\n    // zero-gain audition until their own native bypass captures exist.\n    readonly property string nativeFxEqBypassKey: {\n        var key = String(root.sectionLabel || "").trim().toLowerCase()\n        return key === "reverb" || key === "echo" ? key : ""\n    }\n\n    // PEQ_AB_AUTO_ACTIVE_V2\n''',
              'QML native bypass section key')

          replace_once(
              'qml/components/SectionEqGraph.qml',
              '''    function totalDb(f){ var d=crossDb(f); for(var i=0;i<bands.count;++i)d+=bandDb(bands.get(i),f); return clamp(d,-48,48) }\n''',
              '''    function totalDb(f){\n        var d=crossDb(f)\n        if(!root.eqBypassActive)for(var i=0;i<bands.count;++i)d+=bandDb(bands.get(i),f)\n        return clamp(d,-48,48)\n    }\n''',
              'QML bypass visual response')

          replace_once(
              'qml/components/SectionEqGraph.qml',
              '''    function setEqBypass(enabled){\n        if(enabled===eqBypassActive)return\n        if(enabled){\n            saveCompareSide()\n            bypassSnapshot=captureEqState()\n            eqBypassActive=true\n            for(var i=0;i<bands.count;++i){\n                var b=bands.get(i)\n                bands.setBand(i,Number(b.freq),0,Number(b.q))\n            }\n        }else{\n            var restore=cloneState(bypassSnapshot)\n            eqBypassActive=false\n            bypassSnapshot=null\n            applyEqState(restore)\n            updateActiveCompareSnapshot()\n        }\n        curve.requestPaint()\n    }\n''',
              '''    function setEqBypass(enabled){\n        if(enabled===eqBypassActive)return\n\n        // FX_EQ_BYPASS_CAPTURED_V1 — Reverb/Echo bypass is a real native toggle.\n        // Do not destructively flatten their stored EQ bands: the device owns a\n        // separate bypass bit and should reveal the exact saved curve when disabled.\n        if(root.nativeFxEqBypassKey.length){\n            if(enabled)saveCompareSide()\n            eqBypassActive=enabled\n            bypassSnapshot=null\n            if(root.engine && typeof root.engine.editDevicePath === "function")\n                root.engine.editDevicePath("eq." + root.nativeFxEqBypassKey + ".bypass", enabled)\n            if(!enabled)updateActiveCompareSnapshot()\n            curve.requestPaint()\n            return\n        }\n\n        if(enabled){\n            saveCompareSide()\n            bypassSnapshot=captureEqState()\n            eqBypassActive=true\n            for(var i=0;i<bands.count;++i){\n                var b=bands.get(i)\n                bands.setBand(i,Number(b.freq),0,Number(b.q))\n            }\n        }else{\n            var restore=cloneState(bypassSnapshot)\n            eqBypassActive=false\n            bypassSnapshot=null\n            applyEqState(restore)\n            updateActiveCompareSnapshot()\n        }\n        curve.requestPaint()\n    }\n''',
              'QML native bypass routing')

          # Capture note kept in-repo so the bit semantics do not regress later.
          doc = Path('docs/protocol/FX_EQ_BYPASS_CAPTURE_MAP.md')
          doc.parent.mkdir(parents=True, exist_ok=True)
          doc.write_text('''# Reverb / Echo EQ Bypass — Native Capture Map\n\nMarker: `FX_EQ_BYPASS_CAPTURED_V1`\n\nNative KTV uses a shared runtime register command, not five PEQ gain writes:\n\n```text\nUSB: AA 06 00 0F 40 FD FF MASK 02 CHECKSUM\nBT : AA 06    0F 40 FD FF MASK 02 CHECKSUM\n```\n\n`MASK` is a bitfield proven by the supplied HHD captures:\n\n- bit 0 (`0x01`) = Reverb EQ Bypass\n- bit 1 (`0x02`) = Echo EQ Bypass\n- `0x00` = Reverb OFF, Echo OFF\n- `0x01` = Reverb ON, Echo OFF\n- `0x03` = Reverb ON, Echo ON\n\nReverb capture alternates `0x00 <-> 0x01`. Echo capture alternates `0x01 <-> 0x03` while Reverb stays ON, proving both toggles share one mask byte and each write must preserve the other bit.\n\nObserved response/ack frame after each write:\n\n```text\n55 0E 00 F0 00 05 08 0D 66 66 66 66 66 66 66 00 00 1E\n```\n\nNo native readback form for runtime register `0xFFFD` is proven by these captures. Until such a capture exists, a fresh controller session starts from UI default mask `0x00`; do not invent a read command.\n''', encoding='utf-8')

          # Mechanical guard before commit.
          required = {
              'src/k500/K500Protocol.cpp': ['FX_EQ_BYPASS_CAPTURED_V1', 'fxEqBypassMask', '0xFD, 0xFF'],
              'src/k500/K500Controller.cpp': ['eq.reverb.bypass', 'eq.echo.bypass', 'queueFxEqBypass'],
              'qml/components/SectionEqGraph.qml': ['nativeFxEqBypassKey', 'editDevicePath("eq." + root.nativeFxEqBypassKey + ".bypass"'],
          }
          for file, tokens in required.items():
              text = Path(file).read_text(encoding='utf-8')
              missing = [token for token in tokens if token not in text]
              if missing:
                  raise SystemExit(f'{file}: missing guard tokens {missing}')

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-fx-eq-bypass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/k500/K500Protocol.h src/k500/K500Protocol.cpp src/k500/K500Controller.h src/k500/K500Controller.cpp qml/components/SectionEqGraph.qml docs/protocol/FX_EQ_BYPASS_CAPTURE_MAP.md .github/workflows/patch-fx-eq-bypass.yml
          git diff --cached --check
          git commit -m "Implement native Reverb and Echo EQ bypass"
          git push origin HEAD:fix/echo-native-command
