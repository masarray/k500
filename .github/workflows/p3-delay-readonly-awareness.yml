name: Guard output delay capture parity

on:
  pull_request:
    paths:
      - 'src/k500/K500Protocol.*'
      - 'src/k500/K500Controller.*'
      - 'src/k500/K500PresetEditMapper.cpp'
      - 'src/StudioEngine.cpp'
      - 'qml/components/RackFilterPanel.qml'
      - 'qml/components/SectionWorkspace.qml'
      - 'docs/K500_OUTPUT_DELAY_CAPTURE_MAP.md'
      - '.github/workflows/p3-delay-readonly-awareness.yml'
  push:
    branches:
      - 'fix/p3-delay-readonly-awareness'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify capture-backed output delay parity
        shell: python
        run: |
          from pathlib import Path

          protocol_h = Path('src/k500/K500Protocol.h').read_text(encoding='utf-8')
          protocol = Path('src/k500/K500Protocol.cpp').read_text(encoding='utf-8')
          controller = Path('src/k500/K500Controller.cpp').read_text(encoding='utf-8')
          preset = Path('src/k500/K500PresetEditMapper.cpp').read_text(encoding='utf-8')
          studio = Path('src/StudioEngine.cpp').read_text(encoding='utf-8')
          rack = Path('qml/components/RackFilterPanel.qml').read_text(encoding='utf-8')
          section = Path('qml/components/SectionWorkspace.qml').read_text(encoding='utf-8')
          evidence = Path('docs/K500_OUTPUT_DELAY_CAPTURE_MAP.md').read_text(encoding='utf-8')
          main_cpp = Path('src/main.cpp').read_text(encoding='utf-8')

          assert 'OUTPUT_DELAY_CMD0E_CAPTURED_V1' in protocol
          assert 'OutputDelayMinMs = 0' in protocol_h
          assert 'OutputDelayMaxMs = 50' in protocol_h

          # Main is normal wire order.
          main_block = protocol.split('if (section == QStringLiteral("main"))', 1)[1].split('else if (section == QStringLiteral("surround"))', 1)[0]
          assert 'writeU16Le(data, 16, safeLDelay);' in main_block
          assert 'writeU16Le(data, 18, safeRDelay);' in main_block

          # Surround is the capture-proven exception: R first, L second.
          surround_block = protocol.split('else if (section == QStringLiteral("surround"))', 1)[1].split('} else {', 1)[0]
          assert 'writeU16Le(data, 16, safeRDelay);' in surround_block
          assert 'writeU16Le(data, 18, safeLDelay);' in surround_block

          # Center/Sub use one mono delay word.
          assert 'writeU16Le(data, 16, safeMonoDelay);' in protocol

          # Authoritative readback / persistence offsets must stay aligned.
          for token in [
              'fileU16(memory, 0x0034, 0)',
              'fileU16(memory, 0x0036, 0)',
              'fileU16(memory, 0x00D8, 0)',
              'fileU16(memory, 0x00DA, 0)',
              'fileU16(memory, 0x005C, 0)',
              'fileU16(memory, 0x0070, 0)',
          ]:
              assert token in controller, f'missing controller delay seed: {token}'

          for token in [
              'b.addU16(0x0034',
              'b.addU16(0x0036',
              'b.addU16(0x00D8',
              'b.addU16(0x00DA',
              'b.addU16(0x005C',
              'b.addU16(0x0070',
          ]:
              assert token in preset, f'missing preset delay persistence: {token}'

          assert 'lDelayMs' in studio and 'rDelayMs' in studio and 'outputDelayMs' in studio

          # All six semantic controls are live; no old evidence-gate marker may return.
          assert 'OUTPUT_DELAY_CMD0E_CAPTURED_V1' in rack
          assert 'OUTPUT_DELAY_UI_PARITY_EVIDENCE_GATE_V1' not in section
          for token in [
              'outputs.main.lDelayMs',
              'outputs.main.rDelayMs',
              'outputs.surround.lDelayMs',
              'outputs.surround.rDelayMs',
              'outputs.center.outputDelayMs',
              'outputs.sub.outputDelayMs',
          ]:
              assert token in rack, f'missing QML delay route: {token}'

          main_ui = section.split('title: "Main Bus"', 1)[1].split('title:"Surround Bus"', 1)[0]
          surround_ui = section.split('title:"Surround Bus"', 1)[1].split('title:"Center Bus"', 1)[0]
          center_ui = section.split('title:"Center Bus"', 1)[1].split('title:"Subwoofer Bus"', 1)[0]
          sub_ui = section.split('title:"Subwoofer Bus"', 1)[1]
          assert 'L DELAY' in main_ui and 'R DELAY' in main_ui and 'editable:false' not in main_ui
          assert 'L DELAY' in surround_ui and 'R DELAY' in surround_ui and 'editable:false' not in surround_ui
          assert 'OUTPUT DELAY' in center_ui and 'editable:false' not in center_ui
          assert 'OUTPUT DELAY' in sub_ui and 'editable:false' not in sub_ui

          assert 'opposite wire order from Main' in evidence
          assert 'Surround L Delay = 14 ms' in evidence and 'Surround R Delay = 20 ms' in evidence
          assert 'SURROUND_DELAY_ACTUAL_REFERENCE_V1' in main_cpp
          assert 'putFileU16(memory, 0x00D8, 14)' in main_cpp
          assert 'putFileU16(memory, 0x00DA, 20)' in main_cpp
          assert '0..50 ms' in evidence
          assert 'RSP 0xF1' in evidence

          print('Output delay capture parity guard passed')
