name: P5 QML Object Load

on:
  workflow_dispatch:
  push:
    paths:
      - 'qml/**'
      - 'CMakeLists.txt'
      - '.github/workflows/p5-qml-object-load.yml'
  pull_request:
    paths:
      - 'qml/**'
      - 'CMakeLists.txt'
      - '.github/workflows/p5-qml-object-load.yml'

jobs:
  qml-object-load:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard P5 lazy-load and EQ lifetime invariants
        shell: pwsh
        run: |
          $wrapper = Get-Content 'qml/components/SystemWorkspace.qml' -Raw
          $impl = Get-Content 'qml/components/SystemWorkspaceImpl.qml' -Raw
          $eqHost = Get-Content 'qml/components/SectionEqGraphHost.qml' -Raw
          $cmake = Get-Content 'CMakeLists.txt' -Raw

          foreach ($token in @('P5_LAZY_SYSTEM_WORKSPACE_V1','Loader','asynchronous: true','SystemWorkspaceImpl','loadRequested')) {
            if (-not $wrapper.Contains($token)) { throw "P5 lazy System regression: missing '$token'" }
          }
          if (-not $impl.Contains('P2_DEVICE_PRESET_UI_V1') -or -not $impl.Contains('MassUploadTransferWindow')) {
            throw 'P5 System implementation no longer preserves the existing workspace contract'
          }
          if (-not $cmake.Contains('qml/components/SystemWorkspaceImpl.qml')) {
            throw 'P5 System implementation is not registered in qt_add_qml_module'
          }
          if (-not $eqHost.Contains('CRASH_SAFE_FIXED_EQ_PAGES_V1')) {
            throw 'P5 must preserve fixed persistent EQ page ownership'
          }
          $eqCount = ([regex]::Matches($eqHost, 'SectionEqGraph\s*\{')).Count
          if ($eqCount -ne 8) {
            throw "P5 EQ lifetime regression: expected 8 persistent SectionEqGraph pages, found $eqCount"
          }
          if ($eqHost.Contains('Loader {')) {
            throw 'P5 must not lazy-load/destroy fixed EQ pages'
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl

      - name: Run QML lint target
        shell: pwsh
        run: cmake --build build --target all_qmllint
