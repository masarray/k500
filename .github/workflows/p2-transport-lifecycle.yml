name: P2 Transport Lifecycle

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  transport-lifecycle:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl

      - name: Build P2 lifecycle harness
        shell: pwsh
        run: cmake --build build --config Release --target k500_p2_transport_lifecycle_test

      - name: Run worker lifecycle stress
        shell: pwsh
        run: |
          & build/k500_p2_transport_lifecycle_test.exe
          if ($LASTEXITCODE -ne 0) { throw "P2 transport lifecycle self-test failed with exit code $LASTEXITCODE" }
