name: Finalize Reverb protocol once

on:
  push:
    branches:
      - fix/reverb-native-command

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reverb-native-command
          fetch-depth: 0
      - name: Fix protocol golden vector and preservation guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/k500/K500Protocol.cpp')
          text = path.read_text(encoding='utf-8')

          wrong_surround = '''    if (!expect(outputBlock(QStringLiteral("surround"), surround, QByteArray(OutputDataLength, char(0))), {0xAA,0x25,0x0E,0x02,0x63,0x00,0x61,0x00,0x57,0x00,0x55,0x00,0x50,0x00,0x4B,0x00,0x1E,0x64,0x01,0x01,0x03,0x00,0x04,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x35}, QStringLiteral("surround output block"))) return false;'''
          correct_surround = '''    if (!expect(outputBlock(QStringLiteral("surround"), surround, QByteArray(OutputDataLength, char(0))), {0xAA,0x25,0x0E,0x02,0x63,0x00,0x61,0x00,0x57,0x00,0x55,0x00,0x50,0x00,0x4B,0x00,0x1E,0x64,0x01,0x01,0x03,0x00,0x04,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x35}, QStringLiteral("surround output block"))) return false;'''
          if wrong_surround not in text:
              raise SystemExit('Wrong Surround golden vector anchor not found')
          text = text.replace(wrong_surround, correct_surround, 1)

          old_preserve = '''    if (preservedReverbFrame.size() < 19 || byteFromChar(preservedReverbFrame.at(4)) != 0x5A
        || byteFromChar(preservedReverbFrame.at(6)) != 0x5A || byteFromChar(preservedReverbFrame.at(17)) != 0x5A)
        return fail(QStringLiteral("Reverb block must preserve unknown device bytes"));'''
          new_preserve = '''    if (preservedReverbFrame.size() < 19
        || byteFromChar(preservedReverbFrame.at(4)) != 0x5A
        || byteFromChar(preservedReverbFrame.at(6)) != 0x5A
        || byteFromChar(preservedReverbFrame.at(7)) != 0x5A
        || byteFromChar(preservedReverbFrame.at(8)) != 0x5A
        || byteFromChar(preservedReverbFrame.at(17)) != 0x5A)
        return fail(QStringLiteral("Reverb block must preserve unknown device bytes"));'''
          if old_preserve not in text:
              raise SystemExit('Reverb preservation anchor not found')
          text = text.replace(old_preserve, new_preserve, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit final fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/k500/K500Protocol.cpp
          git rm .github/workflows/finalize-reverb-once.yml
          git commit -m 'Fix Reverb protocol self-test and finalize'
          git push origin HEAD:fix/reverb-native-command
