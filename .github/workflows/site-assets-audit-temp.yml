name: Generate audited landing assets

on:
  push:
    branches:
      - feat/site-regression-audit
    paths:
      - site/.asset-audit-trigger

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate local WebP landing assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          src = root / 'assets' / 'k500 screenshot'
          out = root / 'site' / 'assets'
          out.mkdir(parents=True, exist_ok=True)

          mapping = {
              'Music Setting Section.png': 'music.webp',
              'Mic Setting Section.png': 'mic-a.webp',
              'Mic B Section.png': 'mic-b.webp',
              'Vocal Effect Reverb Section.png': 'reverb.webp',
              'Vocal Echo Delay Section.png': 'echo-delay.webp',
              'Main Output Section.png': 'main-output.webp',
              'Center Section.png': 'center.webp',
              'Surround Section.png': 'surround.webp',
              'Subwoofer Section.png': 'subwoofer.webp',
              'System Section.png': 'system.webp',
              'Ktv-device.png': 'k500-device.webp',
          }

          for source_name, output_name in mapping.items():
              image = Image.open(src / source_name)
              if image.width > 1600:
                  height = round(image.height * 1600 / image.width)
                  image = image.resize((1600, height), Image.Resampling.LANCZOS)
              if image.mode not in ('RGB', 'RGBA'):
                  image = image.convert('RGBA' if 'transparency' in image.info else 'RGB')
              quality = 84 if output_name == 'k500-device.webp' else 82
              image.save(out / output_name, format='WEBP', quality=quality, method=6)
              print(f'{source_name} -> {output_name}: {(out / output_name).stat().st_size} bytes')

          logo = Image.open(root / 'assets' / 'SonKuPik-k500-logo.png').convert('RGBA')
          if max(logo.size) > 512:
              ratio = 512 / max(logo.size)
              logo = logo.resize((round(logo.width * ratio), round(logo.height * ratio)), Image.Resampling.LANCZOS)
          logo.save(out / 'sonkupik-k500-logo.webp', format='WEBP', lossless=True, method=6)
          print(f'logo -> sonkupik-k500-logo.webp: {(out / "sonkupik-k500-logo.webp").stat().st_size} bytes')

          for temporary in (
              root / 'site' / '.asset-audit-trigger',
              root / '.github' / 'workflows' / 'site-assets-audit-temp.yml',
          ):
              if temporary.exists():
                  temporary.unlink()
          PY

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site .github/workflows/site-assets-audit-temp.yml
          git commit -m "perf(site): self-host optimized WebP product assets"
          git push origin HEAD:${GITHUB_REF_NAME}
