name: Guard Startup Limit Interaction

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'src/StudioEngine.cpp'
      - 'src/StudioEngine.h'
      - 'src/main.cpp'
      - 'qml/components/RackFaderPanel.qml'
      - 'qml/components/SystemWorkspaceImpl.qml'
      - '.github/workflows/startup-limit-interaction-guard.yml'
  push:
    branches:
      - 'fix/startup-limit-fader-stability-20261004'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable Startup Limits gesture ownership
        shell: python
        run: |
          from pathlib import Path

          agents = Path('AGENTS.md').read_text(encoding='utf-8')
          engine_h = Path('src/StudioEngine.h').read_text(encoding='utf-8')
          engine_cpp = Path('src/StudioEngine.cpp').read_text(encoding='utf-8')
          main = Path('src/main.cpp').read_text(encoding='utf-8')
          rack = Path('qml/components/RackFaderPanel.qml').read_text(encoding='utf-8')
          system = Path('qml/components/SystemWorkspaceImpl.qml').read_text(encoding='utf-8')

          assert '## UI interaction-state invariant' in agents
          assert 'dynamic JS arrays that embed live engine/device values' in agents

          for token in [
              'Q_PROPERTY(double musicInitVol',
              'Q_PROPERTY(double musicMaxVol',
              'Q_PROPERTY(double micInitVol',
              'Q_PROPERTY(double micMaxVol',
              'Q_PROPERTY(double effectInitLevel',
          ]:
              assert token in engine_h, f'missing StudioEngine startup owner: {token}'

          for token in [
              'setMusicInitVol',
              'setMusicMaxVol',
              'setMicInitVol',
              'setMicMaxVol',
              'setEffectInitLevel',
          ]:
              assert token in engine_cpp, f'missing StudioEngine startup setter: {token}'

          startup = system.split('title:"Startup Limits"', 1)[1].split('StudioPanel {', 1)[0]
          assert 'channels:root.startupLimitChannels' in startup
          assert 'valueResolver:root.startupLimitValue' in startup
          assert 'channels:[' not in startup
          assert 'STARTUP_LIMIT_STABLE_MODEL_V1' in system

          assert 'STARTUP_LIMIT_STABLE_MODEL_V1' in rack
          assert 'property var valueResolver' in rack
          assert 'channel.localValue = v' in rack
          assert 'root.dispatchLive(channel.modelData.label' in rack
          assert 'String(channel.modelData.label) === "MUSIC MAX"' not in rack

          assert 'musicInitBeforeMaxEdit' in main
          assert 'effectInitBeforeMaxEdit' in main
          assert 'qFuzzyCompare(studioEngine.micInitVol(), micInitBeforeMaxEdit)' in main

          print('Startup Limits interaction ownership guard passed')
