name: P3 Authoritative State Reconciliation

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/k500/K500CanonicalState.*'
      - 'src/k500/K500Controller.*'
      - 'src/k500/K500DeviceManager.*'
      - 'src/k500/P1CanonicalStateSelfTestMain.cpp'
      - 'src/main.cpp'
      - 'src/k500/K500Protocol.*'
      - 'src/k500/K500ResponseParser.*'
      - 'src/k500/K500PresetManager.*'
      - 'src/StudioEngine.*'
      - 'qml/components/SectionWorkspace.qml'
      - 'qml/components/MusicTonePanel.qml'
      - 'qml/components/ParameterSlider.qml'
      - 'qml/components/SystemWorkspaceImpl.qml'
      - 'qml/components/MasterStripPanel.qml'
      - 'qml/components/StudioFader.qml'
      - 'qml/components/RackFaderPanel.qml'
      - 'qml/components/TopBar.qml'
      - 'docs/K500_NATIVE_VALUE_RANGES.md'
      - 'docs/K500_CAPTURED_RUNTIME_STATUS.md'
      - 'docs/MUSIC_TONE_CAPTURE_MAP.md'
      - 'docs/K500_FBX_CAPTURE_MAP.md'
      - 'docs/K500_MUSIC_CROSSOVER_TYPE_CAPTURE.md'
      - 'docs/K500_SYSTEM_MUSIC_MAX_CAPTURE.md'
      - 'docs/protocol/FX_EQ_BYPASS_CAPTURE_MAP.md'
      - 'docs/P3_AUTHORITATIVE_RECONCILIATION.md'
      - '.github/workflows/p3-authoritative-reconciliation.yml'
  pull_request:
    paths:
      - 'src/k500/K500CanonicalState.*'
      - 'src/k500/K500Controller.*'
      - 'src/k500/K500DeviceManager.*'
      - 'src/k500/P1CanonicalStateSelfTestMain.cpp'
      - 'src/main.cpp'
      - 'src/k500/K500Protocol.*'
      - 'src/k500/K500ResponseParser.*'
      - 'src/k500/K500PresetManager.*'
      - 'src/StudioEngine.*'
      - 'qml/components/SectionWorkspace.qml'
      - 'qml/components/MusicTonePanel.qml'
      - 'qml/components/ParameterSlider.qml'
      - 'qml/components/SystemWorkspaceImpl.qml'
      - 'qml/components/MasterStripPanel.qml'
      - 'qml/components/StudioFader.qml'
      - 'qml/components/RackFaderPanel.qml'
      - 'docs/K500_NATIVE_VALUE_RANGES.md'
      - 'docs/K500_SYSTEM_MUSIC_MAX_CAPTURE.md'
      - 'docs/protocol/FX_EQ_BYPASS_CAPTURE_MAP.md'
      - 'docs/P3_AUTHORITATIVE_RECONCILIATION.md'
      - '.github/workflows/p3-authoritative-reconciliation.yml'

jobs:
  reconciliation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl

      - name: Build canonical/P3 reconciliation self-test
        shell: pwsh
        run: cmake --build build --config Release --target k500_p1_state_selftest

      - name: Run canonical/P3 reconciliation self-test
        shell: pwsh
        run: build/k500_p1_state_selftest.exe

      - name: Guard P3 reconciliation contract
        shell: python
        run: |
          from pathlib import Path

          state_h = Path('src/k500/K500CanonicalState.h').read_text(encoding='utf-8')
          state_cpp = Path('src/k500/K500CanonicalState.cpp').read_text(encoding='utf-8')
          controller = Path('src/k500/K500Controller.cpp').read_text(encoding='utf-8')
          manager = Path('src/k500/K500DeviceManager.cpp').read_text(encoding='utf-8')
          manager_h = Path('src/k500/K500DeviceManager.h').read_text(encoding='utf-8')
          protocol_h = Path('src/k500/K500Protocol.h').read_text(encoding='utf-8')
          protocol_cpp = Path('src/k500/K500Protocol.cpp').read_text(encoding='utf-8')
          response_h = Path('src/k500/K500ResponseParser.h').read_text(encoding='utf-8')
          response_cpp = Path('src/k500/K500ResponseParser.cpp').read_text(encoding='utf-8')
          preset_manager = Path('src/k500/K500PresetManager.cpp').read_text(encoding='utf-8')
          studio_h = Path('src/StudioEngine.h').read_text(encoding='utf-8')
          studio_cpp = Path('src/StudioEngine.cpp').read_text(encoding='utf-8')
          qml = Path('qml/components/SectionWorkspace.qml').read_text(encoding='utf-8')
          music_tone_qml = Path('qml/components/MusicTonePanel.qml').read_text(encoding='utf-8')
          parameter_slider = Path('qml/components/ParameterSlider.qml').read_text(encoding='utf-8')
          system_qml = Path('qml/components/SystemWorkspaceImpl.qml').read_text(encoding='utf-8')
          master_strip_qml = Path('qml/components/MasterStripPanel.qml').read_text(encoding='utf-8')
          studio_fader_qml = Path('qml/components/StudioFader.qml').read_text(encoding='utf-8')
          rack_fader_qml = Path('qml/components/RackFaderPanel.qml').read_text(encoding='utf-8')
          topbar = Path('qml/components/TopBar.qml').read_text(encoding='utf-8')
          native_ranges = Path('docs/K500_NATIVE_VALUE_RANGES.md').read_text(encoding='utf-8')
          runtime_status = Path('docs/K500_CAPTURED_RUNTIME_STATUS.md').read_text(encoding='utf-8')
          music_tone_doc = Path('docs/MUSIC_TONE_CAPTURE_MAP.md').read_text(encoding='utf-8')
          fbx_doc = Path('docs/K500_FBX_CAPTURE_MAP.md').read_text(encoding='utf-8')
          music_xover_doc = Path('docs/K500_MUSIC_CROSSOVER_TYPE_CAPTURE.md').read_text(encoding='utf-8')
          music_max_doc = Path('docs/K500_SYSTEM_MUSIC_MAX_CAPTURE.md').read_text(encoding='utf-8')
          eq_bypass_doc = Path('docs/protocol/FX_EQ_BYPASS_CAPTURE_MAP.md').read_text(encoding='utf-8')
          main = Path('src/main.cpp').read_text(encoding='utf-8')
          test = Path('src/k500/P1CanonicalStateSelfTestMain.cpp').read_text(encoding='utf-8')

          checks = {
              'reconciliation API exists': 'reconcileSnapshot' in state_h and 'P3_AUTHORITATIVE_RECONCILIATION_V1' in state_cpp,
              'inflight barrier': 'Cannot reconcile while canonical commands are still in flight' in state_cpp,
              'desired intent preserved': 'DesiredState intentionally survives' in state_cpp,
              'divergence is explicit': 'divergentDesiredPaths' in state_cpp and 'divergentDesiredCount' in state_h,
              'controller has separate reconciliation path': 'reconcileFromDeviceMemory' in controller and 'applyDeviceMemory(memory, true)' in controller,
              'ordinary live edits are non-disruptive': 'P3_1_NONDISRUPTIVE_LIVE_EDIT_V1' in manager and 'if (accepted)\n            scheduleAuthoritativeReconciliation();' not in manager,
              'explicit reconciliation machinery retained': 'AuthoritativeReconcileIdleMs = 700' in manager and 'startAuthoritativeReconciliation' in manager,
              'full proven readback reused': 'requestActiveMemoryReadback();' in manager and 'reconciliationMemoryReady' in manager_h,
              'studio hydrates reconciliation truth': '&K500DeviceManager::reconciliationMemoryReady' in main,
              'native range contract exists': 'K500_NATIVE_VALUE_CONTRACT_V1' in protocol_h and 'FxHpfMaxHz = 1000' in protocol_h and 'FxLpfMinHz = 4000' in protocol_h,
              'transport clamps native reverb domain': 'ReverbDecayMinMs' in protocol_cpp and 'ReverbPredelayMaxMs' in protocol_cpp,
              'qml uses native reverb domain': 'from:500,to:5000' in qml and 'from:0,to:100' in qml and 'hpfMinHz' in qml and 'lpfMaxHz' in qml,
              'engine exposes section ranges': 'hpfMinHz READ hpfMinHz' in studio_h and 'lpfMaxHz READ lpfMaxHz' in studio_h,
              'native range documentation present': 'Reverb Decay' in native_ranges and '4000' in native_ranges and '16000' in native_ranges,
              'player status comes from captured RX': 'PLAYER_STATUS_CAPTURED_V1' in response_h and 'tryDecodePlaying' in response_cpp and '0x04u' in response_cpp and 'deviceManager.playing' in topbar,
              'player UI has no local optimistic toggle': 'transportPlaying' not in topbar and 'sendPlayerCommand("playPause")' in topbar,
              'use-init never pretends PC preference is device truth': 'USE_INIT_DEVICE_TRUTH_V1' in preset_manager and 'QSettings' not in preset_manager and 'useInitVolumeKnown' in system_qml,
              'use-init hydrates from captured C0 bit': 'tryDecodeUseInitVolume' in response_cpp and 'response.data.at(7)' in response_cpp and 'm_useInitVolumeKnown = true' in preset_manager,
              'mute hydrates from captured C0 bit': 'MUTE_CONNECT_CAPTURED_V1' in response_h and 'tryDecodeMuted' in response_cpp and '0x02u' in response_cpp and 'setMuted(decodedMuted)' in manager,
              'music tone captured writes are implemented': 'musicNoiseGateRaw' in protocol_cpp and 'musicBass' in protocol_cpp and 'music.noiseGateDb' in controller and 'music.bassDb' in controller,
              'music tone native UI range is guarded': 'from:-91;to:-50' in music_tone_qml and 'offAtMin:true' in music_tone_qml and 'from:-12;to:12' in music_tone_qml and 'offAtMin' in parameter_slider,
              'music tone capture evidence documented': 'raw `0x00` = OFF' in music_tone_doc and 'raw = round((dB + 12.0) * 10)' in music_tone_doc,
              'fbx native range is 0..4': 'MicFbxMinLevel = 0' in protocol_h and 'MicFbxMaxLevel = 4' in protocol_h and 'from:0,to:4' in qml,
              'fbx read uses direct active-memory offset': 'byteAt(memory, 0x001B, 0)' in controller and 'byteAt(memory, 0x001B)' in studio_cpp and 'fileU8(memory, 0x001B)' not in studio_cpp,
              'fbx write owns one byte and fixed neighbour': 'FBX_NATIVE_0_4_CAPTURED_V1' in protocol_cpp and 'qBound(NativeRange::MicFbxMinLevel' in protocol_cpp and 'body.append(char(0x00));' in protocol_cpp,
              'fbx capture evidence documented': 'activeMemory[0x001B]' in fbx_doc and 'Level 4' in fbx_doc and 'RSP `0xFA`' in fbx_doc and 'observational evidence only' in fbx_doc,
              'music crossover type decoder exists': 'MUSIC_CROSSOVER_TYPE_READBACK_V1' in protocol_h and 'crossoverFilterLabel' in protocol_cpp and 'case 0x07' in protocol_cpp,
              'music crossover type readback uses exact active offsets': 'byteAt(memory, 0x0007)' in studio_cpp and 'byteAt(memory, 0x0008)' in studio_cpp and 'byteAt(memory, 0x0007)' in controller and 'byteAt(memory, 0x0008)' in controller,
              'music crossover types are canonical captured truth': 'it.key() == QStringLiteral("music")' in controller and 'captured(prefix + QStringLiteral("hpType")' in controller and 'captured(prefix + QStringLiteral("lpType")' in controller,
              'music crossover capture evidence documented': 'activeMemory[0x0007]' in music_xover_doc and 'activeMemory[0x0008]' in music_xover_doc and '0 = Bypass' in music_xover_doc and '7 | HP LR 24' in music_xover_doc,
              'eq bypass is active-low enable semantics': 'EQ_ENABLE_ACTIVE_LOW_BYPASS_V1' in protocol_cpp and 'return (value & mask) != mask;' in protocol_cpp and '*target & static_cast<quint8>(~mask)' in protocol_cpp and 'FD = Music EQ ACTIVE' in eq_bypass_doc and '7D = Music EQ BYPASSED' in eq_bypass_doc,
              'music max protocol ceiling is captured': 'musicMaxVol = 84' in protocol_h and 'qMin(state.topMusicVol, safeMusicMax)' in protocol_cpp and 'system.musicMaxVol' in controller and 'qMin(m_music.topMusicVol, m_music.musicMaxVol)' in controller,
              'music max UI keeps native ruler ceiling': 'musicMaxVol READ musicMaxVol' in studio_h and 'setMusicMaxVol' in studio_cpp and 'hardMax' in studio_fader_qml and 'root.engine.musicMaxVol' in master_strip_qml and 'system.musicMaxVol' in rack_fader_qml and 'root.engine.musicMaxVol' in system_qml,
              'music max capture evidence documented': 'TopMusic = min(TopMusic, MusicMax)' in music_max_doc and 'Music Max 20' in music_max_doc and 'raising Max' in music_max_doc,
              'runtime capture contract documented': 'STOPPED' in runtime_status and 'PLAYING' in runtime_status and 'AA 03 00 12 00 03 E8' in runtime_status and 'C0 data[7] bit 0x04 set' in runtime_status and 'C0 data[7] bit 0x02 set' in runtime_status,
              'hardware-free self-test': 'P3 authoritative reconciliation self-test passed' in test,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + '  ' + name)
          if failed:
              raise SystemExit('P3 reconciliation guard failed: ' + ', '.join(failed))
          print('ALL P3 AUTHORITATIVE RECONCILIATION GUARDS PASSED')
