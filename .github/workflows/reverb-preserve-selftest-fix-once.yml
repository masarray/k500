name: One-shot Reverb preserve self-test fix

# Trigger after the workflow exists on the focused branch.
on:
  push:
    branches:
      - fix/reverb-native-command

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reverb-native-command
          fetch-depth: 0
      - name: Fix Reverb preserved-byte frame indexes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/k500/K500Protocol.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''    if (preservedReverbFrame.size() < 19
            || byteAt(preservedReverbFrame, 4) != 0x5A
            || byteAt(preservedReverbFrame, 6) != 0x5A
            || byteAt(preservedReverbFrame, 7) != 0x5A
            || byteAt(preservedReverbFrame, 8) != 0x5A
            || byteAt(preservedReverbFrame, 17) != 0x5A) {
'''
          new = '''    if (preservedReverbFrame.size() < 20
            || byteAt(preservedReverbFrame, 5) != 0x5A
            || byteAt(preservedReverbFrame, 7) != 0x5A
            || byteAt(preservedReverbFrame, 8) != 0x5A
            || byteAt(preservedReverbFrame, 9) != 0x5A
            || byteAt(preservedReverbFrame, 18) != 0x5A) {
'''
          if old not in text:
              raise SystemExit('Reverb preservation self-test anchor not found or already changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898218+github-actions[bot]@users.noreply.github.com'
          git add src/k500/K500Protocol.cpp
          git commit -m 'Fix Reverb preservation self-test indexes'
          git push origin HEAD:fix/reverb-native-command
