name: Guard P4 PC preset upload

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/k500/K500PresetUploadBridge.cpp'
      - 'src/k500/K500PresetManager.*'
      - 'src/k500/K500PresetFileBridge.*'
      - 'src/k500/K500PresetCodec.*'
      - 'qml/components/SystemWorkspace.qml'
      - 'qml/components/MassUploadTransferWindow.qml'
      - 'CMakeLists.txt'
      - '.github/workflows/p4-pc-preset-upload.yml'
  pull_request:
    paths:
      - 'src/k500/K500PresetUploadBridge.cpp'
      - 'src/k500/K500PresetManager.*'
      - 'src/k500/K500PresetFileBridge.*'
      - 'src/k500/K500PresetCodec.*'
      - 'qml/components/SystemWorkspace.qml'
      - 'qml/components/MassUploadTransferWindow.qml'
      - 'CMakeLists.txt'
      - '.github/workflows/p4-pc-preset-upload.yml'

jobs:
  p4-upload:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard P4 upload safety contract
        shell: pwsh
        run: |
          $upload = Get-Content 'src/k500/K500PresetUploadBridge.cpp' -Raw
          $manager = Get-Content 'src/k500/K500PresetManager.cpp' -Raw
          $header = Get-Content 'src/k500/K500PresetManager.h' -Raw
          $fileBridge = Get-Content 'src/k500/K500PresetFileBridge.cpp' -Raw
          $system = Get-Content 'qml/components/SystemWorkspace.qml' -Raw
          $transfer = Get-Content 'qml/components/MassUploadTransferWindow.qml' -Raw
          $cmake = Get-Content 'CMakeLists.txt' -Raw

          foreach ($token in @('DEVICE_TRUTH_UPLOAD_V1','usbStoreAvailable','DeviceSlotImageLength','m_storeImage = image','beginStoreSlot(false)','Operation::Upload')) {
            if (-not $upload.Contains($token)) { throw "P4 upload contract missing '$token'" }
          }
          if ($upload.Contains('startReadback') -or $upload.Contains('m_readbackMemory')) {
            throw 'P4 regression: PC preset upload must never replace its staged file image with device readback before Store'
          }

          # Upload remains one transaction through Store -> Recall -> 939-byte
          # readback. LIVE may return only from finishOperation after resync.
          foreach ($token in @('m_operation == Operation::Upload','m_step = Step::RecallDelay','K500PresetProtocol::recallMode(uploadedSlot)','startReadback(ReadbackPurpose::Recall)','finishOperation(QStringLiteral("Upload"), resolvedSlot)')) {
            if (-not $manager.Contains($token)) { throw "P4 upload->device-resync contract missing '$token'" }
          }
          if ($manager.Contains('finishOperation(QStringLiteral("Upload"), uploadedSlot)')) {
            throw 'P4 regression: Upload must not finish/re-enable LIVE immediately after Store commit'
          }

          if (-not $header.Contains('uploadSlotImage')) { throw 'P4 QML upload entry point missing' }
          if (-not $fileBridge.Contains('return K500PresetCodec::buildDeviceSlotImage(m_sourceBytes)')) {
            throw 'P4 regression: file bridge no longer exposes the staged verified slot image'
          }

          # PC selection is still staging-only. Explicit offline Preview is the
          # only PC-file action allowed to hydrate StudioEngine.
          foreach ($token in @('OFFLINE_PREVIEW_V1','previewLoadedPreset','hydrateFromDeviceMemory(preview)')) {
            if (-not $fileBridge.Contains($token)) { throw "P4 offline preview contract missing '$token'" }
          }
          $hydrateCount = ([regex]::Matches($fileBridge, 'hydrateFromDeviceMemory\(preview\)')).Count
          if ($hydrateCount -ne 1) { throw "P4 preview regression: expected one explicit hydrate, found $hydrateCount" }
          $loadStart = $fileBridge.IndexOf('bool K500PresetFileBridge::loadValidatedBytes')
          $loadEnd = $fileBridge.IndexOf('bool K500PresetFileBridge::loadFile', $loadStart)
          if ($loadStart -lt 0 -or $loadEnd -le $loadStart) { throw 'P4 loadValidatedBytes boundary missing' }
          if ($fileBridge.Substring($loadStart, $loadEnd - $loadStart).Contains('hydrateFromDeviceMemory')) {
            throw 'P4 device-truth regression: clicking/selecting a PC preset must remain staging-only'
          }

          foreach ($token in @('P4_PC_PRESET_UPLOAD_UI_V1','root.fileBridge.checksumOk','root.presetManager.usbStoreAvailable','root.presetManager.uploadSlotImage(root.selectedDeviceSlot + 1','previewOrUploadLoadedPreset','root.fileBridge.previewLoadedPreset()','enabled: root.offlineFileMode ? root.stagedPresetReady : root.pcUploadReady','editTracking = false')) {
            if (-not $system.Contains($token)) { throw "P4 UI safety contract missing '$token'" }
          }

          if ($system.Contains('P4_2_PRESET_BATCH_UI_V1')) {
            foreach ($token in @('MassUploadTransferWindow','OFFLINE_MASS_PREP_V1','massPresetDialog.openTransfer()')) {
              if (-not $system.Contains($token)) { throw "P4.2 System transfer-list safety regression: missing '$token'" }
            }
            foreach ($token in @('maxSlots: 10','buildTransferUploadEntries','massUploadSlotImages(entries)','root.presetManager.usbStoreAvailable')) {
              if (-not $transfer.Contains($token)) { throw "P4.2 transfer-list safety regression: missing '$token'" }
            }
            if ($system.Contains('FileDialog.OpenFiles')) { throw 'P4.2 regression: direct multi-file upload must not bypass transfer review' }
            if ($system -match 'text:\s*root\.presetManager.*"Mass"[\s\S]{0,180}enabled:\s*root\.massUploadReady') {
              throw 'P4.2 regression: Mass transfer preparation must remain available offline'
            }
          }

          if (-not $system.Contains('P6_PC_PRESET_LIBRARY_UI_V1')) {
            throw 'P6 regression: PC library must remain a separate UI domain from DEVICE PRESET SLOTS'
          }
          foreach ($token in @('PC PRESET LIBRARY','DEVICE PRESET SLOTS','OFFLINE_DEVICE_SLOT_V1','root.fileBridge.loadBuiltInPreset(index)','root.fileBridge.loadFolderPreset(index)')) {
            if (-not $system.Contains($token)) { throw "P6/P4 separation regression: missing '$token'" }
          }

          if (-not $cmake.Contains('K500PresetUploadBridge.cpp') -or -not $cmake.Contains('MassUploadTransferWindow.qml')) {
            throw 'P4 upload/transfer UI bridge missing from native build'
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl

      - name: Build native app and tests
        shell: pwsh
        run: cmake --build build --config Release

      - name: Re-run permanent Store protocol self-test
        shell: pwsh
        run: '& build/k500_p2_selftest.exe'

      - name: Re-run P3.4 donor persistence
        shell: pwsh
        run: '& build/k500_p34_edit_persistence_test.exe tests/fixtures/donor-sample.k500'

      - name: Re-run P3 donor corpus
        shell: pwsh
        run: '& build/k500_p32_corpus_test.exe tests/fixtures/donor-sample.k500'
