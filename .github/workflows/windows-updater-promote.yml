name: Windows Stable — Per-User only

# SINGLE_PER_USER_STABLE_V1: promote the EXACT owner-accepted RC Per-User
# installer. Never rebuild, package, advertise or upload machine/Smart installers.
# Automatically publish after a successful exact-main K500 CI push; optional
# manual dispatch is fail-closed on the same gate and SHA.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["K500 CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: k500-single-user-stable
  cancel-in-progress: false

jobs:
  promote-user:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - name: Checkout current main acceptance record
        uses: actions/checkout@v4

      - name: Verify exact accepted RC and single-user asset
        id: accepted
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Stable release must run on main' }
          $mainSha = (gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq '.commit.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or $mainSha -ne $env:GITHUB_SHA) {
            throw 'Promotion checkout is not the current main commit'
          }
          if ($env:CI_EVENT_NAME -eq 'workflow_run') {
            if ($env:CI_SOURCE_EVENT -ne 'push' -or $env:CI_CONCLUSION -ne 'success' -or $env:CI_HEAD_SHA -ne $mainSha) {
              throw 'Exact-main push CI has not passed'
            }
          } else {
            $results = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$mainSha&per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or @($results.workflow_runs | Where-Object {
              $_.name -eq 'K500 CI' -and $_.event -eq 'push' -and $_.status -eq 'completed' -and $_.conclusion -eq 'success'
            }).Count -eq 0) { throw 'No exact-main successful K500 CI push exists' }
          }
          $cmake = Get-Content 'CMakeLists.txt' -Raw
          if ($cmake -notmatch 'project\(SonkupikStudioNative VERSION (1\.1\.4) LANGUAGES CXX\)') {
            throw 'Wrong version for v1.1.4 stable'
          }
          $version = $Matches[1]
          $gate = Get-Content 'docs/V1_1_4_UPDATER_RC_ACCEPTANCE.md' -Raw
          function Gate([string]$key) {
            $m = [regex]::Match($gate, "(?m)^$([regex]::Escape($key))=(.*)$")
            if (-not $m.Success) { throw "Missing acceptance token $key" }
            return $m.Groups[1].Value.Trim()
          }
          if ((Gate 'UPDATER_V1_1_4_ACCEPTANCE') -ne 'accepted') {
            throw 'Owner acceptance is not approved'
          }
          $tag = Gate 'UPDATER_V1_1_4_ACCEPTED_TAG'
          $commit = (Gate 'UPDATER_V1_1_4_ACCEPTED_COMMIT').ToLowerInvariant()
          $hash = (Gate 'UPDATER_V1_1_4_USER_SHA256').ToLowerInvariant()
          if ($tag -ne 'v1.1.4-rc.3' -or $commit -ne '4fd638c77392942b2560e9a74f59e12ac7474844' -or
              $hash -ne 'aee9c45916e69bcfcfb07dddc15ee33270dd12a18e7ec68a7f54995c7aec29fc') {
            throw 'Unexpected immutable RC.3 acceptance identity'
          }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft -or $release.tag_name -ne $tag -or
              [string]$release.target_commitish -ne $commit) {
            throw 'The accepted RC release or source commit does not match'
          }
          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $ref.object.type -ne 'commit' -or
              $ref.object.sha.ToLowerInvariant() -ne $commit) {
            throw 'Accepted tag does not resolve to the audited source commit'
          }
          $asset = "SonKuPik-K500-$tag-Windows-Setup-PerUser.exe"
          $matches = @($release.assets | Where-Object { $_.name -eq $asset -and $_.size -gt 50000000 })
          if ($matches.Count -ne 1) { throw 'Exactly one audited RC Per-User asset is required' }
          $digest = [string]$matches[0].digest
          if ($digest -and $digest -ne "sha256:$hash") { throw 'GitHub asset digest does not match owner acceptance' }
          $stable = "v$version"
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'User-Agent'='SonKuPik-single-user-promotion' }
          $lookup = Invoke-WebRequest "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$stable" -Headers $headers -SkipHttpErrorCheck
          if ($lookup.StatusCode -eq 200) { throw "Stable tag $stable exists and must not be overwritten" }
          if ($lookup.StatusCode -ne 404) { throw "Cannot validate stable tag availability: HTTP $($lookup.StatusCode)" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "stable=$stable" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Download and verify exact Per-User RC.3 bytes only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.accepted.outputs.tag }}'
          $asset = '${{ steps.accepted.outputs.asset }}'
          $hash = '${{ steps.accepted.outputs.hash }}'
          New-Item -ItemType Directory -Path rc,dist -Force | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir rc --pattern $asset
          if ($LASTEXITCODE -ne 0) { throw 'RC Per-User asset download failed' }
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir rc --pattern 'updater-rc-manifest.json'
          if ($LASTEXITCODE -ne 0) { throw 'RC manifest download failed' }
          $file = Join-Path rc $asset
          if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
            throw 'Per-User RC binary hash mismatch'
          }
          $rc = Get-Content rc/updater-rc-manifest.json -Raw | ConvertFrom-Json
          if ($rc.schema -ne 'sonkupik-k500-updater-rc-v1' -or
              $rc.releaseTag -ne $tag -or $rc.commit -ne '${{ steps.accepted.outputs.commit }}' -or
              $rc.version -ne '${{ steps.accepted.outputs.version }}' -or $rc.stableReleaseEligible -ne $false) {
            throw 'RC manifest provenance invalid'
          }
          $entry = @($rc.artifacts | Where-Object { $_.file -eq $asset -and $_.sha256 -eq $hash })
          if ($entry.Count -ne 1 -or [int64]$entry[0].bytes -ne (Get-Item $file).Length) {
            throw 'RC manifest does not match accepted Per-User bytes'
          }
          $stableName = 'SonKuPik-K500-v${{ steps.accepted.outputs.version }}-Windows-Setup-PerUser.exe'
          Copy-Item $file (Join-Path dist $stableName)
          if ((Get-FileHash (Join-Path dist $stableName) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
            throw 'Stable staging changed the accepted installer bytes'
          }
          "$hash  $stableName" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          $manifest = [ordered]@{
            schema = 'sonkupik-k500-release-manifest-v3'
            product = 'SonKuPik K500'
            channel = 'stable'
            version = '${{ steps.accepted.outputs.version }}'
            commit = '${{ steps.accepted.outputs.commit }}'
            acceptedRcTag = $tag
            acceptedRcCommit = '${{ steps.accepted.outputs.commit }}'
            promotionModel = 'byte-identical-rc-artifact-promotion'
            target = 'windows-x64'
            stableReleaseEligible = $true
            installerTechnology = 'Inno Setup 6'
            distributionModel = 'per-user-only-no-uac'
            primaryDownload = $stableName
            hardwareAcceptance = 'owner-confirmed-preset-library'
            machineScopeUpdates = 'not-published-use-explicit-migration'
            artifacts = @([ordered]@{ file=$stableName; sha256=$hash; bytes=(Get-Item (Join-Path dist $stableName)).Length })
          }
          $manifest | ConvertTo-Json -Depth 7 | Set-Content -Encoding utf8 dist/release-manifest.json

      - name: Test original Per-User bytes, no admin, preserve user data
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'dist/SonKuPik-K500-v${{ steps.accepted.outputs.version }}-Windows-Setup-PerUser.exe').Path
          $dir = Join-Path $env:LOCALAPPDATA 'Programs/SonKuPik K500'
          $reg = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F568FE8-A747-4CD0-A727-5FE81A405500}_is1'
          $machine = 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8F568FE8-A747-4CD0-A727-5FE81A405500}_is1'
          if (Test-Path $dir) { throw 'Refusing to replace an existing user install on runner' }
          & reg.exe QUERY $reg /reg:64 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Runner already contains registered user install' }
          & reg.exe QUERY $machine /reg:64 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Runner has machine install; no admin migration will be attempted' }
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Per-User install failed' }
          $app = Join-Path $dir 'SonKuPik-K500.exe'
          if (-not (Test-Path $app)) { throw 'Installer did not use default user LocalAppData' }
          foreach ($arg in @('--update-scope-check=user','--update-health-check=1.1.4')) {
            $p = Start-Process $app -ArgumentList $arg -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "App regression $arg failed" }
          }
          & reg.exe QUERY $reg /reg:64 *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Missing HKCU uninstall registration' }
          & reg.exe QUERY $machine /reg:64 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Installer must not register under HKLM' }
          $sentinel = Join-Path $dir 'owner-preserved-data.txt'
          [IO.File]::WriteAllText($sentinel,'DO-NOT-DELETE')
          $again = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($again.ExitCode -ne 0 -or (Get-Content $sentinel -Raw) -ne 'DO-NOT-DELETE') {
            throw 'Per-User reinstall did not preserve user state'
          }
          $uninstall = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or -not (Test-Path $sentinel)) {
            throw 'Uninstall failed or deleted owner data'
          }
          # PER_USER_ABSENT_HKLM_PROBE_EXIT_V1 — reg.exe QUERY deliberately
          # returned 1 for the ABSENT machine registration (a passing test).
          # Start-Process does not clear the last native command exit code;
          # without this, the GitHub pwsh wrapper falsely exits 1.
          $global:LASTEXITCODE = 0
          Write-Host 'Per-User install/reinstall/uninstall, HKCU scope and data preservation PASS'

      - name: Publish one immutable public Per-User installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.accepted.outputs.stable }}
          target_commitish: ${{ steps.accepted.outputs.commit }}
          name: SonKuPik K500 ${{ steps.accepted.outputs.stable }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            SonKuPik K500 v1.1.4 stable — user-approved GEN5 preset bank, Velvet R1 MC HOST, and clear [UAUDIO]/[BT] labels.

            **One Windows x64 Per-User installer. No machine-wide installer or Smart Installer.**
            Installs to %LOCALAPPDATA%\Programs\SonKuPik K500 with standard Windows user privileges (no UAC elevation requested). The EXE is byte-for-byte identical to the approved v1.1.4-rc.3 Per-User installer; no release rebuild.

            Existing machine-wide installations require separate explicit migration; this installer never silently escalates or uninstalls machine-wide software.
            Unsigned open-source build; Windows SmartScreen may still display its normal publisher warning.
          files: |
            dist/SonKuPik-K500-v${{ steps.accepted.outputs.version }}-Windows-Setup-PerUser.exe
            dist/SHA256SUMS.txt
            dist/release-manifest.json
          fail_on_unmatched_files: true
          overwrite_files: false
