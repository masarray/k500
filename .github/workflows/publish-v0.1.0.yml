name: Publish v0.1.0 release

on:
  push:
    branches:
      - agent/embed-plus-jakarta-font
    paths:
      - '.github/workflows/publish-v0.1.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: masarray/k500
      TAG: v0.1.0
      TARGET_SHA: 719c368cd817033db078665842998233408410d3
      ARTIFACT_ID: '9256001899'
      ASSET: SONKUPIK-STUDIO-v0.1.0-Windows.zip
    steps:
      - name: Download verified Windows artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "${ASSET}"
          test -s "${ASSET}"

      - name: Generate checksum and release notes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "${ASSET}" > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<'EOF'
          ## SONKUPIK STUDIO v0.1.0

          Initial native Windows release of the K500 / SONKUPIK STUDIO Qt application.

          ### Highlights
          - Native Qt/QML Windows application; no Electron/Node runtime.
          - Native K500 USB HID and Bluetooth SPP transport architecture.
          - K500 protocol framing, response parsing, heartbeat, handshake, scalar readback and LIVE gating.
          - Music PEQ and crossover editing with DAW/FabFilter-style interactions.
          - Improved fader interaction and control caption visibility.
          - Plus Jakarta Sans embedded as the single application font (Regular, Medium, SemiBold, Bold).
          - SIL Open Font License included for bundled Plus Jakarta Sans assets.

          ### Validation
          This build is produced from `main` commit `719c368cd817033db078665842998233408410d3`.

          GitHub Actions passed:
          - typography regression guard
          - PEQ interaction parity guard
          - fader interaction parity guard
          - control caption awareness guard
          - Windows Qt configure/build/deploy
          - embedded font runtime self-test
          - K500 protocol + RX parser self-test
          - StudioEngine self-test

          ### Windows package
          Download `SONKUPIK-STUDIO-v0.1.0-Windows.zip`, extract the complete ZIP, then run:

          `SONKUPIK-STUDIO-Native-UI.exe`

          Keep the deployed Qt DLL/plugin folders beside the executable.

          ### Hardware note
          Native transport and protocol logic are covered by automated tests, but real K500 USB/Bluetooth hardware should still be validated on the target device before treating this as a production hardware release.
          EOF

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi
          gh release create "${TAG}" \
            "${ASSET}" \
            SHA256SUMS.txt \
            --repo "${REPO}" \
            --target "${TARGET_SHA}" \
            --title "SONKUPIK STUDIO v0.1.0" \
            --notes-file RELEASE_NOTES.md
