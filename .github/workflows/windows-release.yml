name: Windows Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'packaging/windows/**'
      - '.github/workflows/windows-release.yml'
  push:
    branches:
      - main
    paths:
      - 'CMakeLists.txt'
      - 'packaging/windows/**'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: write

jobs:
  package-windows:
    name: Installer + true portable single EXE
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version
        id: meta
        shell: pwsh
        run: |
          $cmake = Get-Content 'CMakeLists.txt' -Raw
          if ($cmake -notmatch 'project\(SonkupikStudioNative VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)') {
            throw 'Unable to read project version from CMakeLists.txt'
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Packaging SONKUPIK STUDIO v$version"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl
          cmake --build build --config Release

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package,dist | Out-Null
          Copy-Item build/SONKUPIK-STUDIO-Native-UI.exe package/
          windeployqt --release --qmldir qml package/SONKUPIK-STUDIO-Native-UI.exe

      - name: Validate deployed application
        shell: pwsh
        run: |
          foreach ($arg in @('--font-self-test','--protocol-self-test','--engine-self-test')) {
            $p = Start-Process -FilePath 'package/SONKUPIK-STUDIO-Native-UI.exe' -ArgumentList $arg -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$arg failed with exit code $($p.ExitCode)" }
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path $makensis)) { throw 'makensis.exe not found' }

      - name: Build installer and true portable single EXE
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          $appDir = (Resolve-Path package).Path
          $distDir = (Resolve-Path dist).Path
          $setup = Join-Path $distDir "SONKUPIK-STUDIO-v$version-Windows-Setup.exe"
          $portable = Join-Path $distDir "SONKUPIK-STUDIO-v$version-Windows-Portable-Single.exe"

          & $makensis "/DAPP_DIR=$appDir" "/DOUT_FILE=$setup" "/DAPP_VERSION=$version" packaging/windows/installer.nsi
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $setup)) { throw 'Installer packaging failed' }

          & $makensis "/DAPP_DIR=$appDir" "/DOUT_FILE=$portable" "/DAPP_VERSION=$version" packaging/windows/portable.nsi
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $portable)) { throw 'Portable single-EXE packaging failed' }

      - name: Validate portable wrapper end-to-end
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $portable = "dist/SONKUPIK-STUDIO-v$version-Windows-Portable-Single.exe"
          foreach ($arg in @('--font-self-test','--protocol-self-test','--engine-self-test')) {
            $p = Start-Process -FilePath $portable -ArgumentList $arg -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Portable $arg failed with exit code $($p.ExitCode)" }
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SONKUPIK-STUDIO-Windows-${{ steps.meta.outputs.version }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SONKUPIK STUDIO ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/SONKUPIK-STUDIO-v${{ steps.meta.outputs.version }}-Windows-Setup.exe
            dist/SONKUPIK-STUDIO-v${{ steps.meta.outputs.version }}-Windows-Portable-Single.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
