name: Guard final UX polish

on:
  push:
    branches:
      - fix/reverb-native-command
  pull_request:
    paths:
      - 'qml/components/BandInspector.qml'
      - 'qml/components/CrossoverInspector.qml'
      - '.github/workflows/final-ux-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reverb-native-command
          fetch-depth: 0

      - name: Apply captured Reverb live paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("qml/components/RackFaderPanel.qml")
          text = path.read_text(encoding="utf-8")
          token = "REVERB_CMD0B_LIVE_BRIDGE_V1"
          marker = '        var section = ""\n'
          insert = '''        // REVERB_CMD0B_LIVE_BRIDGE_V1
        if (t === "Reverb") {
            if (l === "LEVEL") return "effects.reverb.level"
            if (l === "DIRECT") return "effects.reverb.direct"
            if (l === "DECAY") return "effects.reverb.decayMs"
            if (l === "PRE") return "effects.reverb.predelayMs"
            return ""
        }
'''
          if token not in text:
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit("RackFaderPanel var-section anchor not found")
              path.write_text(text[:pos] + insert + text[pos:], encoding="utf-8")
          PY

      - name: Commit Reverb bridge when needed
        shell: bash
        run: |
          if git diff --quiet -- qml/components/RackFaderPanel.qml; then
            echo "Reverb bridge already present"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add qml/components/RackFaderPanel.qml
            git commit -m "Wire captured Reverb controls [reverb-live-bridge]"
            git push origin HEAD:fix/reverb-native-command
          fi

      - name: Verify inspector action scope copy
        shell: python
        run: |
          from pathlib import Path

          band = Path('qml/components/BandInspector.qml').read_text(encoding='utf-8')
          cross = Path('qml/components/CrossoverInspector.qml').read_text(encoding='utf-8')

          assert 'FINAL_INSPECTOR_SCOPE_COPY_V1' in band
          assert 'FINAL_INSPECTOR_SCOPE_COPY_V1' in cross
          assert 'text: "RESET BAND"' in band
          assert 'text: "RESET EDGE"' in cross
          assert 'text: "Reset"' not in band
          assert 'text: "Reset"' not in cross
          assert 'onClicked: root.resetRequested()' in band
          assert 'onClicked: root.resetRequested()' in cross
          print('Final inspector UX scope guard passed')
