name: Windows Stable Release

# Public stable publisher for the hardware-accepted Windows USB baseline.
# Standard Inno Setup installer + ordinary portable ZIP; unsigned open-source build.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/windows-stable-release.yml'

permissions:
  contents: write

env:
  QT_VERSION: '6.10.2'
  HARDWARE_ACCEPTANCE: accepted-windows-usb

jobs:
  package-windows-stable:
    name: Stable Inno installer + portable ZIP
    runs-on: windows-2022

    steps:
      - name: Checkout exact stable commit
        uses: actions/checkout@v4

      - name: Read stable version
        id: meta
        shell: pwsh
        run: |
          $cmake = Get-Content 'CMakeLists.txt' -Raw
          if ($cmake -notmatch 'project\(SonkupikStudioNative VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)') {
            throw 'Unable to read project version from CMakeLists.txt'
          }
          $version = $Matches[1]
          if ([version]$version -lt [version]'1.0.0') {
            throw "Stable publisher requires version >= 1.0.0; found $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Packaging SonKuPik K500 v$version PUBLIC STABLE"

      - name: Guard stable release truth
        shell: pwsh
        run: |
          if ($env:HARDWARE_ACCEPTANCE -ne 'accepted-windows-usb') {
            throw 'Stable publisher requires explicit Windows/USB hardware acceptance.'
          }

          $readiness = Get-Content 'docs/P5_RELEASE_READINESS.md' -Raw
          foreach ($token in @(
            'public stable approved',
            'Windows x64 + USB HID',
            'Bluetooth SPP remains available',
            'not part of the v1.0 hardware-qualified support claim'
          )) {
            if (-not $readiness.Contains($token)) { throw "Stable readiness contract missing '$token'" }
          }

          $preset = 'resources/presets/01_ALL_GENRE.k500'
          $bytes = [IO.File]::ReadAllBytes($preset)
          if ($bytes.Length -ne 0x0478) { throw "Mode 01 length invalid: $($bytes.Length)" }
          $sum = 0
          foreach ($b in $bytes) { $sum = ($sum + [int]$b) -band 0xff }
          if ($sum -ne 0) { throw "Mode 01 additive checksum invalid: $sum" }
          $mode01 = (Get-FileHash $preset -Algorithm SHA256).Hash.ToLowerInvariant()
          $golden = '9aebeb908295abda1182ddbadc3aa537ea16b4cfea241b64b5a5180e66670e74'
          if ($mode01 -ne $golden) { throw "Mode 01 native donor regressed: $mode01" }

          $installer = Get-Content 'packaging/windows/installer.iss' -Raw
          foreach ($token in @(
            'SetupIconFile={#AppIcon}',
            'WizardImageFile={#WizardImage}',
            'WizardSmallImageFile={#WizardSmallImage}'
          )) {
            if (-not $installer.Contains($token)) { throw "Installer branding contract missing '$token'" }
          }

          Write-Host "Stable truth PASS; native Mode 01 SHA256 $mode01"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl
          cmake --build build --config Release

      - name: Run full preset regression suite
        shell: pwsh
        run: |
          & build/k500_p2_selftest.exe
          if ($LASTEXITCODE -ne 0) { throw 'P2 preset protocol self-test failed' }
          & build/k500_p3_selftest.exe
          if ($LASTEXITCODE -ne 0) { throw 'P3 codec self-test failed' }
          & build/k500_p32_corpus_test.exe tests/fixtures/donor-sample.k500
          if ($LASTEXITCODE -ne 0) { throw 'P3.2 donor corpus failed' }
          & build/k500_p34_edit_persistence_test.exe tests/fixtures/donor-sample.k500
          if ($LASTEXITCODE -ne 0) { throw 'P3.4 donor persistence failed' }
          & build/k500_p42_batch_test.exe tests/fixtures/donor-sample.k500
          if ($LASTEXITCODE -ne 0) { throw 'P4.2 donor batch failed' }

      - name: Deploy direct Qt application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package,dist,build/packaging | Out-Null
          Copy-Item build/SONKUPIK-STUDIO-Native-UI.exe package/SonKuPik-K500.exe
          if (Test-Path LICENSE) { Copy-Item LICENSE package/ }
          windeployqt --release --qmldir qml package/SonKuPik-K500.exe

          @"
          Product: SonKuPik K500
          Channel: Public Stable
          Version: ${{ steps.meta.outputs.version }}
          Source: https://github.com/masarray/k500
          Official presets: https://github.com/masarray/k500/tree/main/resources/presets
          Commit: $env:GITHUB_SHA
          Qt: $env:QT_VERSION
          Hardware-qualified scope: Windows x64 + USB HID
          Bluetooth SPP: experimental / outside v1.0 hardware-qualified scope
          Distribution: unsigned open-source build; Inno Setup installer + portable ZIP
          "@ | Set-Content -Encoding utf8 package/BUILD-INFO.txt

      - name: Validate direct deployed application
        shell: pwsh
        run: |
          foreach ($arg in @('--font-self-test','--protocol-self-test','--engine-self-test')) {
            $p = Start-Process -FilePath 'package/SonKuPik-K500.exe' -ArgumentList $arg -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$arg failed with exit code $($p.ExitCode)" }
          }

      - name: Generate Windows installer branding
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          @'
          from PIL import Image

          source = Image.open('assets/SonKuPik-k500-logo.png').convert('RGBA')
          source.save('package/SonKuPik-K500.ico', format='ICO',
                      sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])

          def branded_bmp(size, logo_box, out_path):
              canvas = Image.new('RGB', size, (13, 18, 22))
              logo = source.copy()
              logo.thumbnail(logo_box, Image.Resampling.LANCZOS)
              x = (size[0] - logo.width) // 2
              y = max(12, (size[1] - logo.height) // 3)
              canvas.paste(logo, (x, y), logo)
              canvas.save(out_path, format='BMP')

          branded_bmp((164, 314), (132, 132), 'build/packaging/SonKuPik-K500-wizard.bmp')
          branded_bmp((55, 55), (48, 48), 'build/packaging/SonKuPik-K500-wizard-small.bmp')
          '@ | python -

          foreach ($file in @(
            'package/SonKuPik-K500.ico',
            'build/packaging/SonKuPik-K500-wizard.bmp',
            'build/packaging/SonKuPik-K500-wizard-small.bmp'
          )) {
            if (-not (Test-Path $file)) { throw "Installer branding generation failed: $file" }
          }

      - name: Install and locate Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          $iscc = $null
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($command) { $iscc = $command.Source }

          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:ChocolateyInstall\bin\ISCC.exe",
              "$env:ChocolateyInstall\lib\innosetup\tools\ISCC.exe"
            ) | Where-Object { $_ -and (Test-Path $_) }
            $iscc = $candidates | Select-Object -First 1
          }

          if (-not $iscc -and $env:ChocolateyInstall) {
            $innoRoot = Join-Path $env:ChocolateyInstall 'lib\innosetup'
            if (Test-Path $innoRoot) {
              $found = Get-ChildItem $innoRoot -Filter ISCC.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $iscc = $found.FullName }
            }
          }

          if (-not $iscc) {
            foreach ($root in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
              if ($root -and (Test-Path $root)) {
                $found = Get-ChildItem $root -Filter ISCC.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($found) { $iscc = $found.FullName; break }
              }
            }
          }

          if (-not $iscc) { throw 'Inno Setup ISCC.exe not found after Chocolatey install.' }
          "INNO_ISCC=$iscc" >> $env:GITHUB_ENV
          Write-Host "Using Inno Setup compiler: $iscc"

      - name: Build Inno installer and portable ZIP
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $env:SONKUPIK_APP_DIR = (Resolve-Path package).Path
          $env:SONKUPIK_OUTPUT_DIR = (Resolve-Path dist).Path
          $env:SONKUPIK_APP_ICON = (Resolve-Path package/SonKuPik-K500.ico).Path
          $env:SONKUPIK_WIZARD_IMAGE = (Resolve-Path build/packaging/SonKuPik-K500-wizard.bmp).Path
          $env:SONKUPIK_WIZARD_SMALL_IMAGE = (Resolve-Path build/packaging/SonKuPik-K500-wizard-small.bmp).Path

          & $env:INNO_ISCC "/DAppVersion=$version" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup packaging failed' }

          $setup = "dist/SonKuPik-K500-v$version-Windows-Setup.exe"
          if (-not (Test-Path $setup)) { throw 'Inno Setup output not found' }

          $portable = "dist/SonKuPik-K500-v$version-Windows-Portable.zip"
          Compress-Archive -Path 'package/*' -DestinationPath $portable -CompressionLevel Optimal -Force
          if (-not (Test-Path $portable)) { throw 'Portable ZIP packaging failed' }

      - name: Validate portable ZIP end-to-end
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $portable = "dist/SonKuPik-K500-v$version-Windows-Portable.zip"
          $testDir = Join-Path $env:RUNNER_TEMP 'sonkupik-portable-stable-test'
          if (Test-Path $testDir) { Remove-Item $testDir -Recurse -Force }
          Expand-Archive -Path $portable -DestinationPath $testDir -Force
          foreach ($arg in @('--font-self-test','--protocol-self-test','--engine-self-test')) {
            $p = Start-Process -FilePath (Join-Path $testDir 'SonKuPik-K500.exe') -ArgumentList $arg -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Portable ZIP $arg failed with exit code $($p.ExitCode)" }
          }

      - name: Validate Inno installer end-to-end
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $setup = (Resolve-Path "dist/SonKuPik-K500-v$version-Windows-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'SonKuPik-K500-stable-install-test'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $installArgs = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR=$installDir"))
          $install = Start-Process -FilePath $setup -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Inno installer failed with exit code $($install.ExitCode)" }
          foreach ($arg in @('--font-self-test','--protocol-self-test','--engine-self-test')) {
            $p = Start-Process -FilePath (Join-Path $installDir 'SonKuPik-K500.exe') -ArgumentList $arg -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Installed application $arg failed with exit code $($p.ExitCode)" }
          }

      - name: Generate hashes and stable release manifest
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          $releaseFiles = @(
            Get-Item "dist/SonKuPik-K500-v$version-Windows-Setup.exe"
            Get-Item "dist/SonKuPik-K500-v$version-Windows-Portable.zip"
          )
          $artifacts = @()
          foreach ($file in ($releaseFiles | Sort-Object Name)) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Add-Content -Encoding ascii dist/SHA256SUMS.txt
            $artifacts += [ordered]@{ file = $file.Name; sha256 = $hash; bytes = $file.Length }
          }

          $manifest = [ordered]@{
            schema = 'sonkupik-k500-release-manifest-v3'
            product = 'SonKuPik K500'
            channel = 'stable'
            version = $version
            commit = $env:GITHUB_SHA
            generatedUtc = [DateTime]::UtcNow.ToString('o')
            target = 'windows-x64'
            qtVersion = $env:QT_VERSION
            hardwareAcceptance = $env:HARDWARE_ACCEPTANCE
            hardwareQualifiedScope = 'Windows x64 + USB HID'
            bluetoothQualification = 'experimental-not-v1-qualified'
            stableReleaseEligible = $true
            codeSigning = 'unsigned-open-source'
            installerTechnology = 'Inno Setup 6'
            portableFormat = 'ZIP (non-self-extracting)'
            selfExtractingPortable = $false
            officialPresetSource = 'github:masarray/k500/resources/presets@main'
            mode01NativeSha256 = '9aebeb908295abda1182ddbadc3aa537ea16b4cfea241b64b5a5180e66670e74'
            regressionSuite = @('P0/P1 architecture','P2 preset protocol','P3 codec','P3.2 donor corpus','P3.4 edit persistence','P4.2 donor batch','runtime navigation self-tests','portable ZIP test','Inno installed-app test')
            artifacts = $artifacts
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 dist/release-manifest.json
          Get-Content dist/SHA256SUMS.txt
          Get-Content dist/release-manifest.json

      - name: Validate stable release manifest
        shell: pwsh
        run: |
          $manifest = Get-Content dist/release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne '${{ steps.meta.outputs.version }}') { throw 'Manifest version mismatch' }
          if ($manifest.commit -ne $env:GITHUB_SHA) { throw 'Manifest commit mismatch' }
          if ($manifest.product -ne 'SonKuPik K500') { throw 'Manifest product mismatch' }
          if ($manifest.channel -ne 'stable') { throw 'Manifest channel must be stable' }
          if ($manifest.hardwareAcceptance -ne 'accepted-windows-usb') { throw 'Stable hardware acceptance mismatch' }
          if ($manifest.hardwareQualifiedScope -ne 'Windows x64 + USB HID') { throw 'Stable support scope mismatch' }
          if ($manifest.bluetoothQualification -ne 'experimental-not-v1-qualified') { throw 'Bluetooth qualification must remain explicit' }
          if ($manifest.stableReleaseEligible -ne $true) { throw 'Stable release eligibility must be true' }
          if ($manifest.codeSigning -ne 'unsigned-open-source') { throw 'Unsigned OSS distribution status must be explicit' }
          if ($manifest.selfExtractingPortable -ne $false) { throw 'Portable distribution must not be self-extracting' }
          if ($manifest.mode01NativeSha256 -ne '9aebeb908295abda1182ddbadc3aa537ea16b4cfea241b64b5a5180e66670e74') { throw 'Native Mode 01 manifest identity mismatch' }
          if ($manifest.artifacts.Count -ne 2) { throw 'Manifest must describe installer and portable ZIP' }

      - name: Upload stable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonKuPik-K500-Windows-${{ steps.meta.outputs.version }}-Stable
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/release-manifest.json
          if-no-files-found: error

      - name: Publish GitHub stable release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SonKuPik K500 ${{ steps.meta.outputs.tag }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            Public stable release of SonKuPik K500.

            Hardware-qualified v1.0 scope: Windows x64 + K500 over USB HID. Bluetooth SPP remains available but is experimental and is not part of the v1.0 hardware-qualified support claim.

            Mode 01 uses the exact native `CONCERT HIFI V4` donor accepted on physical hardware. Official presets can continue to receive validated updates through the application's preset Sync feature.

            This is free/open-source software and the Windows binaries are currently unsigned. The installer uses standard Inno Setup 6 and the portable build is a normal ZIP.
          files: |
            dist/SonKuPik-K500-v${{ steps.meta.outputs.version }}-Windows-Setup.exe
            dist/SonKuPik-K500-v${{ steps.meta.outputs.version }}-Windows-Portable.zip
            dist/SHA256SUMS.txt
            dist/release-manifest.json
          fail_on_unmatched_files: true
          overwrite_files: true
