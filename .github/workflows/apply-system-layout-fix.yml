name: Apply System layout acceptance fix

on:
  push:
    branches:
      - fix/system-device-truth-mass-transfer
    paths:
      - '.github/workflows/apply-system-layout-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/system-device-truth-mass-transfer
          fetch-depth: 0

      - name: Apply Device Mode layout and MODE NAME field
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('qml/components/SystemWorkspace.qml')
          text = path.read_text(encoding='utf-8')

          if 'readonly property string selectedDeviceModeName' not in text:
              pattern = re.compile(
                  r'(    property var deviceSlots: \{\n'
                  r'        if \(!root\.deviceConnected\)\n'
                  r'            return root\.defaultDeviceSlots\n'
                  r'        var names = root\.systemValue\("deviceModeNames", root\.defaultDeviceSlots\)\n'
                  r'        return names && names\.length === 10 \? names : root\.defaultDeviceSlots\n'
                  r'    \}\n)'
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit('deviceSlots property anchor not found')
              addition = (
                  '    // MODE_NAME_UI_V1 — mirrors the selected hardware slot name only.\n'
                  '    // Persistent rename stays disabled until the donor write packet is captured.\n'
                  '    readonly property string selectedDeviceModeName: {\n'
                  '        if (!root.deviceConnected || root.selectedDeviceSlot < 0 || root.selectedDeviceSlot >= root.deviceSlots.length)\n'
                  '            return ""\n'
                  '        return String(root.deviceSlots[root.selectedDeviceSlot] || "").slice(0, 16)\n'
                  '    }\n'
              )
              text = text[:match.end()] + addition + text[match.end():]

          marker = 'text:"DEVICE PRESET SLOTS"'
          panel_start = text.index(marker)
          panel_end = text.index(
              '            ColumnLayout {\n                Layout.fillWidth: true\n                Layout.fillHeight: true\n                Layout.preferredWidth: 355',
              panel_start)
          panel = text[panel_start:panel_end]

          panel, n = re.subn(
              r'(\s*ColumnLayout \{\n\s*Layout\.fillWidth:true\n\s*Layout\.fillHeight:true\n)\s*Layout\.margins:12\n\s*spacing:8\n',
              lambda m: m.group(1) + '                        Layout.margins:10\n                        spacing:7\n',
              panel,
              count=1)
          if n != 1:
              raise SystemExit('Device content layout anchor not found')

          panel, n = re.subn(
              r'(\s*Rectangle \{\n\s*Layout\.fillWidth:true\n)\s*Layout\.preferredHeight:311\n\s*Layout\.minimumHeight:311\n\s*Layout\.maximumHeight:311\n',
              lambda m: m.group(1) + '                            Layout.fillHeight:true\n                            Layout.minimumHeight:311\n',
              panel,
              count=1)
          if n != 1 and 'Layout.maximumHeight:311' in panel:
              raise SystemExit('fixed Device slot height anchor not found')

          if 'id: deviceSlotColumn' not in panel:
              panel, n = re.subn(
                  r'(\s*Column \{\n)(\s*anchors\.fill:parent\n\s*anchors\.margins:7\n\s*spacing:3\n)',
                  lambda m: m.group(1) + '                                id: deviceSlotColumn\n' + m.group(2),
                  panel,
                  count=1)
              if n != 1:
                  raise SystemExit('Device slot column anchor not found')

          if 'height:Math.max(27, (deviceSlotColumn.height - (9 * deviceSlotColumn.spacing)) / 10)' not in panel:
              panel, n = re.subn(
                  r'(\s*)height:27\n',
                  lambda m: m.group(1) + 'height:Math.max(27, (deviceSlotColumn.height - (9 * deviceSlotColumn.spacing)) / 10)\n',
                  panel,
                  count=1)
              if n != 1:
                  raise SystemExit('fixed Device row height anchor not found')

          if 'text:"MODE NAME"' not in panel:
              init_id = panel.index('id:initVolumeCheck')
              insert_at = panel.rfind('                        RowLayout {', 0, init_id)
              if insert_at < 0:
                  raise SystemExit('Use init volume RowLayout anchor not found')
              mode_block = (
                  '                        // Native KTV parity: selected hardware Mode Name.\n'
                  '                        // Read-only until persistent rename traffic is donor-verified.\n'
                  '                        RowLayout {\n'
                  '                            Layout.fillWidth:true\n'
                  '                            spacing:7\n'
                  '                            Text {\n'
                  '                                text:"MODE NAME"\n'
                  '                                color:Theme.textDim\n'
                  '                                font.family:Theme.monoFamily\n'
                  '                                font.pixelSize:8\n'
                  '                                font.letterSpacing:1.0\n'
                  '                                Layout.preferredWidth:68\n'
                  '                            }\n'
                  '                            Rectangle {\n'
                  '                                Layout.fillWidth:true\n'
                  '                                Layout.preferredHeight:29\n'
                  '                                radius:6\n'
                  '                                color:"#080C10"\n'
                  '                                border.width:1\n'
                  '                                border.color:root.deviceConnected?Theme.borderSoft:"#20272D"\n'
                  '                                TextInput {\n'
                  '                                    anchors.fill:parent\n'
                  '                                    anchors.leftMargin:9\n'
                  '                                    anchors.rightMargin:9\n'
                  '                                    verticalAlignment:TextInput.AlignVCenter\n'
                  '                                    text:root.selectedDeviceModeName\n'
                  '                                    readOnly:true\n'
                  '                                    selectByMouse:true\n'
                  '                                    maximumLength:16\n'
                  '                                    color:root.deviceConnected?Theme.amber:Theme.textDim\n'
                  '                                    font.family:Theme.monoFamily\n'
                  '                                    font.pixelSize:9\n'
                  '                                    font.weight:Font.Bold\n'
                  '                                    clip:true\n'
                  '                                }\n'
                  '                                Text {\n'
                  '                                    anchors.left:parent.left\n'
                  '                                    anchors.leftMargin:9\n'
                  '                                    anchors.verticalCenter:parent.verticalCenter\n'
                  '                                    visible:!root.deviceConnected\n'
                  '                                    text:"Connect K500 to read"\n'
                  '                                    color:Theme.textDim\n'
                  '                                    font.family:Theme.monoFamily\n'
                  '                                    font.pixelSize:8\n'
                  '                                }\n'
                  '                            }\n'
                  '                            Text {\n'
                  '                                text:"READ ONLY"\n'
                  '                                color:Theme.textDim\n'
                  '                                font.family:Theme.monoFamily\n'
                  '                                font.pixelSize:7\n'
                  '                                font.weight:Font.Bold\n'
                  '                            }\n'
                  '                        }\n\n'
              )
              panel = panel[:insert_at] + mode_block + panel[insert_at:]

          panel, n = re.subn(
              r'(\s*SoftButton\{Layout\.fillWidth:true;text:"Reset all";compact:true;enabled:false\}\n\s*\}\n)\s*Item\{Layout\.fillHeight:true\}\n',
              r'\1',
              panel,
              count=1)
          if n != 1 and 'Item{Layout.fillHeight:true}' in panel:
              raise SystemExit('Device action spacer anchor not found')

          text = text[:panel_start] + panel + text[panel_end:]
          path.write_text(text, encoding='utf-8')

          out = path.read_text(encoding='utf-8')
          required = [
              'readonly property string selectedDeviceModeName',
              'id: deviceSlotColumn',
              'height:Math.max(27, (deviceSlotColumn.height - (9 * deviceSlotColumn.spacing)) / 10)',
              'text:"MODE NAME"',
              'text:"READ ONLY"',
              'text:"Connect K500 to read"',
          ]
          for token in required:
              if token not in out:
                  raise SystemExit(f'missing acceptance token: {token}')
          if 'Layout.maximumHeight:311' in out:
              raise SystemExit('fixed maximum Device slot height survived patch')

      - name: Commit acceptance fix
        shell: bash
        run: |
          if git diff --quiet -- qml/components/SystemWorkspace.qml; then
            echo 'No QML change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qml/components/SystemWorkspace.qml
          git commit -m 'Fix Device Mode layout and expose mode name'
          git push origin HEAD:fix/system-device-truth-mass-transfer
