name: P3 Authoritative Reconciliation Apply

on:
  push:
    paths:
      - '.github/workflows/p3-authoritative-reconciliation-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/p3-authoritative-reconciliation
          fetch-depth: 0

      - name: Apply P3 authoritative reconciliation milestone
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('src/k500/K500CanonicalState.h', '#include <QString>\n#include <QVariant>', '#include <QString>\n#include <QStringList>\n#include <QVariant>')
          replace_once('src/k500/K500CanonicalState.h', '    bool adoptSnapshot(const QByteArray &memory, QString *error = nullptr);\n    bool snapshotReady() const { return m_snapshotReady; }', '    bool adoptSnapshot(const QByteArray &memory, QString *error = nullptr);\n    // P3_AUTHORITATIVE_RECONCILIATION_V1 — replace hardware truth after a\n    // deliberate readback barrier while preserving unresolved DesiredState.\n    bool reconcileSnapshot(const QByteArray &memory, QString *error = nullptr);\n    bool snapshotReady() const { return m_snapshotReady; }\n    quint64 snapshotGeneration() const { return m_snapshotGeneration; }')
          replace_once('src/k500/K500CanonicalState.h', '    int confirmedCount() const { return m_confirmed.size(); }\n    int desiredCount() const { return m_desired.size(); }\n    int inFlightCount() const { return m_inFlightByKey.size(); }', '    int confirmedCount() const { return m_confirmed.size(); }\n    int desiredCount() const { return m_desired.size(); }\n    int inFlightCount() const { return m_inFlightByKey.size(); }\n    int divergentDesiredCount() const;\n    QStringList divergentDesiredPaths() const;')
          replace_once('src/k500/K500CanonicalState.h', '    QByteArray m_rawSnapshot;\n    QByteArray m_snapshotSha256;\n    QHash<QString, ValueState> m_confirmed;', '    QByteArray m_rawSnapshot;\n    QByteArray m_snapshotSha256;\n    quint64 m_snapshotGeneration = 0;\n    QHash<QString, ValueState> m_confirmed;')

          replace_once('src/k500/K500CanonicalState.cpp', '    m_rawSnapshot.clear();\n    m_snapshotSha256.clear();\n    m_confirmed.clear();', '    m_rawSnapshot.clear();\n    m_snapshotSha256.clear();\n    m_snapshotGeneration = 0;\n    m_confirmed.clear();')
          replace_once('src/k500/K500CanonicalState.cpp', '    m_snapshotSha256 = QCryptographicHash::hash(m_rawSnapshot, QCryptographicHash::Sha256);\n    m_snapshotReady = true;', '    m_snapshotSha256 = QCryptographicHash::hash(m_rawSnapshot, QCryptographicHash::Sha256);\n    m_snapshotGeneration = 1;\n    m_snapshotReady = true;')
          replace_once('src/k500/K500CanonicalState.cpp', 'void K500CanonicalState::confirm(const QString &path, const QVariant &value, Evidence evidence)\n{', 'bool K500CanonicalState::reconcileSnapshot(const QByteArray &memory, QString *error)\n{\n    // P3_AUTHORITATIVE_RECONCILIATION_V1\n    if (!m_sessionActive) {\n        setReason(error, QStringLiteral("No active device session"));\n        return false;\n    }\n    if (!m_snapshotReady) {\n        setReason(error, QStringLiteral("Initial authoritative snapshot has not been adopted"));\n        return false;\n    }\n    if (memory.size() != ActiveMemorySize) {\n        setReason(error, QStringLiteral("Reconciliation snapshot must be exactly %1 bytes, got %2").arg(ActiveMemorySize).arg(memory.size()));\n        return false;\n    }\n    if (!m_inFlightByKey.isEmpty()) {\n        setReason(error, QStringLiteral("Cannot reconcile while canonical commands are still in flight"));\n        return false;\n    }\n\n    m_rawSnapshot = memory;\n    m_rawSnapshot.detach();\n    m_snapshotSha256 = QCryptographicHash::hash(m_rawSnapshot, QCryptographicHash::Sha256);\n    ++m_snapshotGeneration;\n    if (m_snapshotGeneration == 0)\n        m_snapshotGeneration = 1;\n\n    // ConfirmedState is rebuilt from this authoritative image by Controller.\n    // DesiredState intentionally survives until confirm() sees the same value.\n    m_confirmed.clear();\n    setReason(error, {});\n    return true;\n}\n\nvoid K500CanonicalState::confirm(const QString &path, const QVariant &value, Evidence evidence)\n{')
          replace_once('src/k500/K500CanonicalState.cpp', 'QString K500CanonicalState::evidenceName(Evidence evidence)\n{', 'QStringList K500CanonicalState::divergentDesiredPaths() const\n{\n    QStringList paths;\n    for (auto it = m_desired.constBegin(); it != m_desired.constEnd(); ++it) {\n        if (it->sessionEpoch != m_sessionEpoch)\n            continue;\n        const auto confirmedIt = m_confirmed.constFind(it.key());\n        if (confirmedIt == m_confirmed.constEnd() || confirmedIt->sessionEpoch != m_sessionEpoch)\n            continue;\n        if (confirmedIt->value != it->value)\n            paths.append(it.key());\n    }\n    paths.sort(Qt::CaseSensitive);\n    return paths;\n}\n\nint K500CanonicalState::divergentDesiredCount() const\n{\n    return divergentDesiredPaths().size();\n}\n\nQString K500CanonicalState::evidenceName(Evidence evidence)\n{')

          replace_once('src/k500/K500Controller.h', '    Q_PROPERTY(int desiredStateCount READ desiredStateCount NOTIFY canonicalStateChanged)\n    Q_PROPERTY(int inFlightStateCount READ inFlightStateCount NOTIFY canonicalStateChanged)', '    Q_PROPERTY(int desiredStateCount READ desiredStateCount NOTIFY canonicalStateChanged)\n    Q_PROPERTY(int inFlightStateCount READ inFlightStateCount NOTIFY canonicalStateChanged)\n    Q_PROPERTY(qulonglong authoritativeSnapshotGeneration READ authoritativeSnapshotGeneration NOTIFY canonicalStateChanged)\n    Q_PROPERTY(int divergentDesiredStateCount READ divergentDesiredStateCount NOTIFY canonicalStateChanged)')
          replace_once('src/k500/K500Controller.h', '    int desiredStateCount() const { return m_canonicalState.desiredCount(); }\n    int inFlightStateCount() const { return m_canonicalState.inFlightCount(); }', '    int desiredStateCount() const { return m_canonicalState.desiredCount(); }\n    int inFlightStateCount() const { return m_canonicalState.inFlightCount(); }\n    qulonglong authoritativeSnapshotGeneration() const { return m_canonicalState.snapshotGeneration(); }\n    int divergentDesiredStateCount() const { return m_canonicalState.divergentDesiredCount(); }')
          replace_once('src/k500/K500Controller.h', '    void hydrateFromDeviceMemory(const QByteArray &memory);\n    void clearDeviceState();', '    void hydrateFromDeviceMemory(const QByteArray &memory);\n    void reconcileFromDeviceMemory(const QByteArray &memory);\n    void clearDeviceState();')
          replace_once('src/k500/K500Controller.h', '    void recordConfirmedState(const QByteArray &memory);', '    void recordConfirmedState(const QByteArray &memory);\n    void applyDeviceMemory(const QByteArray &memory, bool preserveDesiredIntent);')

          old = 'void K500Controller::hydrateFromDeviceMemory(const QByteArray &memory)\n{\n    // P1_CANONICAL_SNAPSHOT_BARRIER_V1 — only an exact Retrieve-All image can\n    // become hardware truth. No partial buffer may unlock native writes.\n    if (memory.size() != K500CanonicalState::ActiveMemorySize)\n        return;\n    if (!m_canonicalState.sessionActive())\n        m_canonicalState.beginSession(); // deterministic harness/recovery fallback\n    QString snapshotError;\n    if (!m_canonicalState.adoptSnapshot(memory, &snapshotError)) {\n        emit writeDeferred(QStringLiteral("__snapshot__"), snapshotError);\n        return;\n    }\n    emit canonicalStateChanged();'
          new = 'void K500Controller::hydrateFromDeviceMemory(const QByteArray &memory)\n{\n    applyDeviceMemory(memory, false);\n}\n\nvoid K500Controller::reconcileFromDeviceMemory(const QByteArray &memory)\n{\n    applyDeviceMemory(memory, true);\n}\n\nvoid K500Controller::applyDeviceMemory(const QByteArray &memory, bool preserveDesiredIntent)\n{\n    // P1_CANONICAL_SNAPSHOT_BARRIER_V1 + P3_AUTHORITATIVE_RECONCILIATION_V1\n    // Initial/Recall hydration resets intent; deliberate verification preserves\n    // unresolved DesiredState until semantic confirmation.\n    if (memory.size() != K500CanonicalState::ActiveMemorySize)\n        return;\n    if (!m_canonicalState.sessionActive())\n        m_canonicalState.beginSession(); // deterministic harness/recovery fallback\n    QString snapshotError;\n    const bool accepted = preserveDesiredIntent\n        ? m_canonicalState.reconcileSnapshot(memory, &snapshotError)\n        : m_canonicalState.adoptSnapshot(memory, &snapshotError);\n    if (!accepted) {\n        emit writeDeferred(preserveDesiredIntent ? QStringLiteral("__reconcile__") : QStringLiteral("__snapshot__"), snapshotError);\n        return;\n    }\n    emit canonicalStateChanged();'
          replace_once('src/k500/K500Controller.cpp', old, new)

          replace_once('src/k500/K500DeviceManager.h', '    void activeMemoryReady(const QByteArray &memory);\n    void commandDispatchResult', '    void activeMemoryReady(const QByteArray &memory);\n    void reconciliationMemoryReady(const QByteArray &memory);\n    void commandDispatchResult')
          replace_once('src/k500/K500DeviceManager.h', '    void setLiveEnabled(bool enabled);\n    qint64 schedulerNowMs() const;', '    void setLiveEnabled(bool enabled);\n    void scheduleAuthoritativeReconciliation();\n    void startAuthoritativeReconciliation();\n    qint64 schedulerNowMs() const;')
          replace_once('src/k500/K500DeviceManager.h', '    bool m_liveEnabled = false;\n    bool m_muted = false;\n    bool m_shuttingDown = false;', '    bool m_liveEnabled = false;\n    bool m_muted = false;\n    bool m_shuttingDown = false;\n    bool m_reconciliationInProgress = false;')
          replace_once('src/k500/K500DeviceManager.h', '    QTimer m_heartbeatTimer;\n    QTimer m_schedulerTimer;', '    QTimer m_heartbeatTimer;\n    QTimer m_reconciliationTimer;\n    QTimer m_schedulerTimer;')

          replace_once('src/k500/K500DeviceManager.cpp', 'constexpr int ConnectionWatchdogMs = 12000;\nconstexpr int DiagnosticLogLimit = 240;', 'constexpr int ConnectionWatchdogMs = 12000;\nconstexpr int DiagnosticLogLimit = 240;\nconstexpr int AuthoritativeReconcileIdleMs = 700;\nconstexpr int AuthoritativeReconcileRetryMs = 120;')
          replace_once('src/k500/K500DeviceManager.cpp', '    m_heartbeatTimer.setInterval(HeartbeatIntervalMs);\n    m_schedulerTimer.setSingleShot(true);', '    m_heartbeatTimer.setInterval(HeartbeatIntervalMs);\n    m_reconciliationTimer.setSingleShot(true);\n    m_schedulerTimer.setSingleShot(true);')
          replace_once('src/k500/K500DeviceManager.cpp', '    connect(&m_heartbeatTimer, &QTimer::timeout,\n            this, &K500DeviceManager::heartbeatTick);\n    connect(&m_schedulerTimer, &QTimer::timeout,', '    connect(&m_heartbeatTimer, &QTimer::timeout,\n            this, &K500DeviceManager::heartbeatTick);\n    connect(&m_reconciliationTimer, &QTimer::timeout,\n            this, &K500DeviceManager::startAuthoritativeReconciliation);\n    connect(&m_schedulerTimer, &QTimer::timeout,')
          replace_once('src/k500/K500DeviceManager.cpp', '        connect(this, &K500DeviceManager::activeMemoryReady,\n                m_controller, &K500Controller::hydrateFromDeviceMemory);', '        connect(this, &K500DeviceManager::activeMemoryReady,\n                m_controller, &K500Controller::hydrateFromDeviceMemory);\n        connect(this, &K500DeviceManager::reconciliationMemoryReady,\n                m_controller, &K500Controller::reconcileFromDeviceMemory);')
          replace_once('src/k500/K500DeviceManager.cpp', '        emit commandDispatchResult(\n            transaction->sessionEpoch, transaction->token, transaction->semanticPath, accepted,\n            accepted ? QString{} : QStringLiteral("Native asynchronous transport rejected command"));\n\n        if (!accepted || !connected() || !m_liveEnabled)', '        emit commandDispatchResult(\n            transaction->sessionEpoch, transaction->token, transaction->semanticPath, accepted,\n            accepted ? QString{} : QStringLiteral("Native asynchronous transport rejected command"));\n        if (accepted)\n            scheduleAuthoritativeReconciliation();\n\n        if (!accepted || !connected() || !m_liveEnabled)')
          replace_once('src/k500/K500DeviceManager.cpp', 'void K500DeviceManager::beginBluetoothScan()\n{', 'void K500DeviceManager::scheduleAuthoritativeReconciliation()\n{\n    // P3_AUTHORITATIVE_RECONCILIATION_V1 — debounce the proven full readback\n    // until the current canonical live-write burst has gone quiet.\n    if (!m_controller || m_stage != Stage::Ready || !connected() || !m_liveEnabled\n        || m_controller->desiredStateCount() <= 0)\n        return;\n    m_reconciliationTimer.start(AuthoritativeReconcileIdleMs);\n}\n\nvoid K500DeviceManager::startAuthoritativeReconciliation()\n{\n    if (!m_controller || m_stage != Stage::Ready || !connected() || !m_liveEnabled\n        || m_controller->desiredStateCount() <= 0)\n        return;\n    if (!m_transactionScheduler.empty() || m_controller->inFlightStateCount() > 0) {\n        m_reconciliationTimer.start(AuthoritativeReconcileRetryMs);\n        return;\n    }\n\n    m_reconciliationInProgress = true;\n    setLiveEnabled(false);\n    setStatus(QStringLiteral("syncing"));\n    emit logLine(QStringLiteral("SYS"), QStringLiteral("authoritative reconciliation"),\n                 QStringLiteral("LIVE paused; verifying 939-byte hardware state"));\n    requestActiveMemoryReadback();\n}\n\nvoid K500DeviceManager::beginBluetoothScan()\n{')

          old = '    // Important ordering: hydrate controller + StudioEngine while LIVE is OFF.\n    // Only after the complete 939-byte snapshot has propagated do edits become\n    // eligible to transmit back to the K500.\n    emit deviceScalarsReady(m_activeMemory.left(0x40));\n    emit activeMemoryReady(m_activeMemory);\n    setLiveEnabled(true);\n    setError({});\n    setStatus(QStringLiteral("connected"));\n\n    emit logLine(QStringLiteral("SYS"), QStringLiteral("device sync complete"),\n                 QStringLiteral("%1 bytes loaded into native editor").arg(m_activeMemory.size()));'
          new = '    // Important ordering: hydrate controller + StudioEngine while LIVE is OFF.\n    // Initial/Recall snapshots reset intent; P3 verification preserves it.\n    const bool wasReconciliation = m_reconciliationInProgress;\n    if (wasReconciliation) {\n        emit reconciliationMemoryReady(m_activeMemory);\n    } else {\n        emit deviceScalarsReady(m_activeMemory.left(0x40));\n        emit activeMemoryReady(m_activeMemory);\n    }\n    setLiveEnabled(true);\n    setError({});\n    setStatus(QStringLiteral("connected"));\n\n    if (wasReconciliation && m_controller) {\n        emit logLine(QStringLiteral("SYS"), QStringLiteral("authoritative reconciliation complete"),\n                     QStringLiteral("generation %1 · unresolved %2 · divergent %3")\n                         .arg(m_controller->authoritativeSnapshotGeneration())\n                         .arg(m_controller->desiredStateCount())\n                         .arg(m_controller->divergentDesiredStateCount()));\n    } else {\n        emit logLine(QStringLiteral("SYS"), QStringLiteral("device sync complete"),\n                     QStringLiteral("%1 bytes loaded into native editor").arg(m_activeMemory.size()));\n    }\n    m_reconciliationInProgress = false;'
          replace_once('src/k500/K500DeviceManager.cpp', old, new)

          replace_once('src/k500/K500DeviceManager.cpp', '    root.insert(QStringLiteral("transactionScheduler"), scheduler);\n\n    QJsonObject presetOperation;', '    root.insert(QStringLiteral("transactionScheduler"), scheduler);\n\n    QJsonObject canonical;\n    if (m_controller) {\n        canonical.insert(QStringLiteral("snapshotGeneration"), QString::number(m_controller->authoritativeSnapshotGeneration()));\n        canonical.insert(QStringLiteral("desired"), m_controller->desiredStateCount());\n        canonical.insert(QStringLiteral("inFlight"), m_controller->inFlightStateCount());\n        canonical.insert(QStringLiteral("divergentDesired"), m_controller->divergentDesiredStateCount());\n    }\n    canonical.insert(QStringLiteral("reconciliationInProgress"), m_reconciliationInProgress);\n    root.insert(QStringLiteral("canonicalState"), canonical);\n\n    QJsonObject presetOperation;')
          replace_once('src/k500/K500DeviceManager.cpp', '    m_heartbeatTimer.stop();\n    m_stage = Stage::Idle;', '    m_heartbeatTimer.stop();\n    m_reconciliationTimer.stop();\n    m_reconciliationInProgress = false;\n    m_stage = Stage::Idle;')
          replace_once('src/k500/K500DeviceManagerShutdown.cpp', '    setLiveEnabled(false);\n\n    // P2_SCHEDULER_SHUTDOWN_BARRIER_V1', '    setLiveEnabled(false);\n    m_reconciliationTimer.stop();\n    m_reconciliationInProgress = false;\n\n    // P2_SCHEDULER_SHUTDOWN_BARRIER_V1')
          replace_once('src/main.cpp', '    QObject::connect(&deviceManager, &K500DeviceManager::activeMemoryReady,\n                     &studioEngine, &StudioEngine::hydrateFromDeviceMemory);', '    QObject::connect(&deviceManager, &K500DeviceManager::activeMemoryReady,\n                     &studioEngine, &StudioEngine::hydrateFromDeviceMemory);\n    QObject::connect(&deviceManager, &K500DeviceManager::reconciliationMemoryReady,\n                     &studioEngine, &StudioEngine::hydrateFromDeviceMemory);')
          replace_once('CMakeLists.txt', 'target_include_directories(k500_p2_scheduler_selftest PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/src")\ntarget_link_libraries(k500_p2_scheduler_selftest PRIVATE Qt6::Core)\n', 'target_include_directories(k500_p2_scheduler_selftest PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/src")\ntarget_link_libraries(k500_p2_scheduler_selftest PRIVATE Qt6::Core)\n\n# P3_AUTHORITATIVE_RECONCILIATION_V1 — hardware-free truth/intent convergence.\nadd_executable(k500_p3_reconciliation_selftest\n    src/k500/P3AuthoritativeReconciliationSelfTestMain.cpp\n    src/k500/K500CanonicalState.cpp\n    src/k500/K500CanonicalState.h\n)\ntarget_include_directories(k500_p3_reconciliation_selftest PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/src")\ntarget_link_libraries(k500_p3_reconciliation_selftest PRIVATE Qt6::Core)\n')

      - name: Commit P3 milestone
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/main.cpp src/k500/K500CanonicalState.h src/k500/K500CanonicalState.cpp src/k500/K500Controller.h src/k500/K500Controller.cpp src/k500/K500DeviceManager.h src/k500/K500DeviceManager.cpp src/k500/K500DeviceManagerShutdown.cpp
          git commit -m "feat: add P3 authoritative state reconciliation"
          git push origin HEAD:architecture/p3-authoritative-reconciliation
