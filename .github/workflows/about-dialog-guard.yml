name: Guard About dialog

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'qml/Main.qml'
      - 'qml/components/TopBar.qml'
      - 'qml/components/AboutDialog.qml'
      - '.github/workflows/about-dialog-guard.yml'
  workflow_dispatch:

jobs:
  about-dialog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard About card UX and links
        shell: python
        run: |
          from pathlib import Path

          cmake = Path('CMakeLists.txt').read_text(encoding='utf-8')
          main = Path('qml/Main.qml').read_text(encoding='utf-8')
          topbar = Path('qml/components/TopBar.qml').read_text(encoding='utf-8')
          about = Path('qml/components/AboutDialog.qml').read_text(encoding='utf-8')

          checks = {
              'About dialog is packaged in QML module': 'qml/components/AboutDialog.qml' in cmake,
              'TopBar emits About request': 'signal aboutRequested()' in topbar and 'onClicked:root.aboutRequested()' in topbar,
              'Main owns centered floating card': 'AboutDialog {' in main and 'onAboutRequested: aboutDialog.open()' in main,
              'modal visual contract is present': 'ABOUT_FLOATING_CARD_V1' in about and 'modal: true' in about and 'parent: Overlay.overlay' in about,
              'version is runtime authoritative': 'Qt.application.version' in about and 'Versi: ' in about,
              'copyright is present': 'Copyright (c) 2026, SonKuPik' in about,
              'YouTube destination is exact': 'https://www.youtube.com/@sonkupik' in about,
              'Tokopedia destination is exact': 'https://www.tokopedia.com/dr-sonkupik/recording-tech-ktv-pro-k500-karaoke-effect-processor-4-input-6-output-digital-mixer-dengan-equalizer-compressor-anti-feedback-crossover-ktv-pro-k500' in about,
              'links open externally': about.count('Qt.openUrlExternally') == 2,
              'About uses the embedded K500 identity': 'qrc:/assets/SonKuPik-k500-logo.png' in about,
          }

          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + '  ' + name)
          if failed:
              raise SystemExit('About dialog regression: ' + ', '.join(failed))
          print('ALL ABOUT DIALOG GUARDS PASSED')
