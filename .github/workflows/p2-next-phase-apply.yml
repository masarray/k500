name: P2 Next Phase Apply

on:
  push:
    branches:
      - architecture/p2-deterministic-transaction-scheduler
    paths:
      - '.github/workflows/p2-next-phase-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P2 branch
        uses: actions/checkout@v4
        with:
          ref: architecture/p2-deterministic-transaction-scheduler
          fetch-depth: 0

      - name: Apply scheduler transport bridge
        run: python tools/p2_next_phase_patch.py

      - name: Commit P2 transport bridge
        shell: bash
        run: |
          # The patcher removes its temporary machinery from the worktree, but
          # keep it for this one bot commit so GITHUB_TOKEN never has to mutate
          # workflow files. ChatGPT removes both helper files through the repo
          # connector immediately after this implementation commit lands.
          git checkout -- tools/p2_next_phase_patch.py .github/workflows/p2-next-phase-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "P2: wire scheduler into native transport"
          git push origin HEAD:architecture/p2-deterministic-transaction-scheduler

# retry 2: preserve temporary workflow during bot push; remove it via connector after success.
