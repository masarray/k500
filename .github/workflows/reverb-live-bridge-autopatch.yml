name: Reverb Live Bridge Patch

on:
  push:
    branches:
      - fix/reverb-native-command

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/reverb-native-command
          fetch-depth: 0

      - name: Patch Reverb live paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("qml/components/RackFaderPanel.qml")
          text = path.read_text(encoding="utf-8")
          token = "REVERB_CMD0B_LIVE_BRIDGE_V1"
          marker = '        var section = ""\n'
          insert = '''        // REVERB_CMD0B_LIVE_BRIDGE_V1
        if (t === "Reverb") {
            if (l === "LEVEL") return "effects.reverb.level"
            if (l === "DIRECT") return "effects.reverb.direct"
            if (l === "DECAY") return "effects.reverb.decayMs"
            if (l === "PRE") return "effects.reverb.predelayMs"
            return ""
        }
'''
          if token not in text:
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit("RackFaderPanel var-section anchor not found")
              path.write_text(text[:pos] + insert + text[pos:], encoding="utf-8")
          PY

      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet -- qml/components/RackFaderPanel.qml; then
            echo "Patch already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qml/components/RackFaderPanel.qml
          git commit -m "Wire captured Reverb controls [reverb-live-bridge]"
          git push origin HEAD:fix/reverb-native-command
