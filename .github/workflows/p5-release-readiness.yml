name: Guard v1 stable release readiness

on:
  workflow_dispatch:
  push:
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SUPPORT.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'DESIGN_NOTES.md'
      - 'SOURCE_SNAPSHOT.md'
      - 'docs/**'
      - 'src/k500/K500DeviceManager.*'
      - 'src/AppVersionInit.cpp'
      - 'src/AppUpdateManager.*'
      - 'qml/Main.qml'
      - 'qml/components/TopBar.qml'
      - 'qml/components/UpdateDialog.qml'
      - 'packaging/windows/installer.iss'
      - 'CMakeLists.txt'
      - 'resources/presets/01_ALL_GENRE.k500'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/windows-stable-release.yml'
      - '.github/workflows/windows-updater-rc.yml'
      - '.github/workflows/windows-updater-promote.yml'
      - '.github/workflows/p5-release-readiness.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SUPPORT.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'DESIGN_NOTES.md'
      - 'SOURCE_SNAPSHOT.md'
      - 'docs/**'
      - 'src/k500/K500DeviceManager.*'
      - 'src/AppVersionInit.cpp'
      - 'src/AppUpdateManager.*'
      - 'qml/Main.qml'
      - 'qml/components/TopBar.qml'
      - 'qml/components/UpdateDialog.qml'
      - 'packaging/windows/installer.iss'
      - 'CMakeLists.txt'
      - 'resources/presets/01_ALL_GENRE.k500'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/windows-stable-release.yml'
      - '.github/workflows/windows-updater-rc.yml'
      - '.github/workflows/windows-updater-promote.yml'
      - '.github/workflows/p5-release-readiness.yml'

jobs:
  stable-readiness:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard public stable documentation and lifecycle contracts
        shell: pwsh
        run: |
          $readme = Get-Content README.md -Raw
          $license = Get-Content LICENSE -Raw
          $security = Get-Content SECURITY.md -Raw
          $contrib = Get-Content CONTRIBUTING.md -Raw
          $changelog = Get-Content CHANGELOG.md -Raw
          $docsIndex = Get-Content docs/README.md -Raw
          $userGuide = Get-Content docs/USER_GUIDE.md -Raw
          $architecture = Get-Content docs/ARCHITECTURE.md -Raw
          $releases = Get-Content docs/RELEASES.md -Raw
          $readiness = Get-Content docs/P5_RELEASE_READINESS.md -Raw
          $hardware = Get-Content docs/HARDWARE_ACCEPTANCE_CHECKLIST.md -Raw
          $updaterAcceptance = Get-Content docs/V1_1_UPDATER_RC_ACCEPTANCE.md -Raw
          $matrix = Get-Content docs/PORTING_PARITY_MATRIX.md -Raw
          $codec = Get-Content docs/P3_K500_CODEC.md -Raw
          $fileUi = Get-Content docs/P3_3_PRESET_FILE_UI.md -Raw
          $landing = Get-Content docs/index.html -Raw
          $stableWorkflow = Get-Content .github/workflows/windows-stable-release.yml -Raw
          $rcWorkflow = Get-Content .github/workflows/windows-updater-rc.yml -Raw
          $promotionWorkflow = Get-Content .github/workflows/windows-updater-promote.yml -Raw
          $installer = Get-Content packaging/windows/installer.iss -Raw
          $updater = Get-Content src/AppUpdateManager.cpp -Raw
          $deviceHeader = Get-Content src/k500/K500DeviceManager.h -Raw
          $device = Get-Content src/k500/K500DeviceManager.cpp -Raw
          $topbar = Get-Content qml/components/TopBar.qml -Raw
          $cmake = Get-Content CMakeLists.txt -Raw

          foreach ($token in @('GNU GENERAL PUBLIC LICENSE','Version 3, 29 June 2007','END OF TERMS AND CONDITIONS')) {
            if (-not $license.Contains($token)) { throw "GPL-3 license regression: missing '$token'" }
          }

          foreach ($token in @(
            'SonKuPik K500',
            'Stable support:',
            'Windows 10/11 x64 + K500 over USB HID',
            'Bluetooth SPP',
            'official and local presets',
            'GPL-3.0-or-later'
          )) {
            if (-not $readme.Contains($token)) { throw "Stable README contract missing '$token'" }
          }
          if ($readme.Contains('Portable-Single.exe') -or $readme.Contains('physical K500 qualification is still required before')) {
            throw 'README regressed to retired RC packaging/status.'
          }

          foreach ($token in @('## 1.0.0 — Public stable','CONCERT HIFI V4','Official + Local','crash')) {
            if (-not $changelog.Contains($token)) { throw "v1 changelog contract missing '$token'" }
          }
          foreach ($token in @('v1.0.x','USB HID','experimental','Remote Official Preset security','unsigned open-source')) {
            if (-not $security.Contains($token)) { throw "Security policy contract missing '$token'" }
          }
          foreach ($token in @('main` represents the current stable baseline','Official preset changes','Mode 01','focused branch')) {
            if (-not $contrib.Contains($token)) { throw "Contribution policy contract missing '$token'" }
          }
          foreach ($token in @('Public stable','Qualified transport','Official Mode 01','Architecture','User Guide','Release Model')) {
            if (-not $docsIndex.Contains($token)) { throw "Documentation index missing '$token'" }
          }
          foreach ($token in @('Official SonKuPik presets','Local presets','Preview and offline editing','Mass Upload','Mode 01')) {
            if (-not $userGuide.Contains($token)) { throw "User guide missing '$token'" }
          }
          foreach ($token in @('State authority model','Official preset synchronization','Mass Upload','Crash-resistant QML section architecture','Failure model')) {
            if (-not $architecture.Contains($token)) { throw "Architecture reference missing '$token'" }
          }
          foreach ($token in @('Current public stable: **v1.0.3**','Current source candidate line: **v1.1.0**','Windows-Setup-PerUser.exe','Official Preset update channel','release-manifest.json','Do not republish a stable tag')) {
            if (-not $releases.Contains($token)) { throw "Release model missing '$token'" }
          }
          foreach ($token in @('Target application version: `1.1.0`','Public stable remains **v1.0.3**','A rebuild is not an accepted promotion mechanism.')) {
            if (-not $updaterAcceptance.Contains($token)) { throw "Updater v1.1 acceptance record missing '$token'" }
          }
          function Read-UpdaterAcceptanceToken([string]$name) {
            $escaped = [regex]::Escape($name)
            $matches = [regex]::Matches($updaterAcceptance, "(?m)^$escaped=(.*)$")
            if ($matches.Count -ne 1) { throw "Updater acceptance token $name must appear exactly once." }
            return $matches[0].Groups[1].Value.Trim()
          }
          $acceptanceState = Read-UpdaterAcceptanceToken 'UPDATER_V1_1_ACCEPTANCE'
          if ($acceptanceState -notin @('pending','accepted')) { throw 'Updater v1.1 acceptance state must be pending or accepted.' }
          $acceptedTag = Read-UpdaterAcceptanceToken 'UPDATER_V1_1_ACCEPTED_TAG'
          $acceptedCommit = Read-UpdaterAcceptanceToken 'UPDATER_V1_1_ACCEPTED_COMMIT'
          $acceptedMachine = Read-UpdaterAcceptanceToken 'UPDATER_V1_1_MACHINE_SHA256'
          $acceptedUser = Read-UpdaterAcceptanceToken 'UPDATER_V1_1_USER_SHA256'
          $acceptedPortable = Read-UpdaterAcceptanceToken 'UPDATER_V1_1_PORTABLE_SHA256'
          if ($acceptanceState -eq 'pending') {
            if (@($acceptedTag,$acceptedCommit,$acceptedMachine,$acceptedUser,$acceptedPortable) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }) {
              throw 'Pending updater acceptance must not pre-populate accepted RC provenance.'
            }
          } else {
            if ($acceptedTag -notmatch '^v1\.1\.0-rc\.[1-9][0-9]*$') { throw 'Accepted updater RC tag is invalid.' }
            if ($acceptedCommit -notmatch '^[0-9a-fA-F]{40}$') { throw 'Accepted updater RC commit must be a full SHA.' }
            foreach ($hash in @($acceptedMachine,$acceptedUser,$acceptedPortable)) {
              if ($hash -notmatch '^[0-9a-fA-F]{64}$') { throw 'Accepted updater artifact SHA-256 is invalid.' }
            }
          }

          # Historical v1.0.0 hardware qualification remains immutable evidence;
          # maintenance versions may advance without rewriting that provenance.
          foreach ($token in @(
            'v1.0.0',
            'a6c10847597616dbd22ba0271d82f5814991cb3e',
            'Windows 10/11 x64',
            'Bluetooth SPP',
            'release-manifest.json',
            '5fb9458d8b56f047b0304a651c13aeade032ea8a250b0142b6a1c0c2134a7345'
          )) {
            if (-not $readiness.Contains($token)) { throw "Stable qualification record missing '$token'" }
          }
          foreach ($token in @('Stable v1.0 is already published','Unified Official + Local preset library','Section-navigation crash regression','Mode 01 golden donor','Failure / recovery injection')) {
            if (-not $hardware.Contains($token)) { throw "Hardware runbook missing '$token'" }
          }
          foreach ($token in @('STABLE USB ✅','EXPERIMENTAL 🧪','Unified SONKUPIK + LOCAL preset library','Persistent LCD/Equipment Mode rename','P5 — Packaging / release qualification — COMPLETE')) {
            if (-not $matrix.Contains($token)) { throw "Parity matrix missing '$token'" }
          }
          foreach ($token in @('LOCKED ✅','v1.0 stable baseline','Mode 01','buildDeviceSlotImage')) {
            if (-not $codec.Contains($token)) { throw "Codec documentation missing '$token'" }
          }
          foreach ($token in @('SONKUPIK + LOCAL','Official Mode 01 integrity','Mass Upload transfer-list behavior','Preview')) {
            if (-not $fileUi.Contains($token)) { throw "Preset UI documentation missing '$token'" }
          }
          foreach ($token in @('Native control.','Official + Local library','Validated preset sync','Release integrity','Portable ZIP')) {
            if (-not $landing.Contains($token)) { throw "Landing-page stable contract missing '$token'" }
          }
          if ($landing.Contains('Physical K500 hardware acceptance remains required for release qualification.')) {
            throw 'Landing page regressed to prerelease footer.'
          }

          if ($cmake -notmatch 'project\(SonkupikStudioNative VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)') {
            throw 'Stable semantic version metadata is missing.'
          }
          $version = [version]$Matches[1]
          if ($version -lt [version]'1.0.0' -or $version.Major -ne 1) {
            throw "v1 release readiness guard does not accept version $version"
          }
          if ($version -ge [version]'1.1.0' -and -not $readme.Contains('current source candidate is **v1.1.0**')) {
            throw 'README must distinguish the v1.1.0 source candidate from public stable.'
          }
          Write-Host "Validating SonKuPik K500 v$version source/release readiness"

          foreach ($token in @(
            'HARDWARE_ACCEPTANCE: accepted-windows-usb',
            'stableReleaseEligible = $true',
            'prerelease: false',
            "channel = 'stable'",
            "portableFormat = 'ZIP (non-self-extracting)'",
            "mode01NativeSha256 = '4d1f2dd4f5431de1df1819931ecf65be4242e2bc9ae4e9dbabdbee3504004cf1'",
            'Run full preset and updater regression suite',
            'Validate portable ZIP end-to-end',
            'Validate Inno installer end-to-end',
            'v1.1+ stable must promote exact accepted RC artifacts through windows-updater-promote.yml'
          )) {
            if (-not $stableWorkflow.Contains($token)) { throw "Legacy stable release pipeline contract missing '$token'" }
          }

          foreach ($token in @(
            'name: Windows Updater Stable Promotion',
            'Promote exact accepted updater RC',
            'UPDATER_V1_1_ACCEPTED_TAG',
            'UPDATER_V1_1_ACCEPTED_COMMIT',
            'UPDATER_V1_1_MACHINE_SHA256',
            'UPDATER_V1_1_USER_SHA256',
            'UPDATER_V1_1_PORTABLE_SHA256',
            'Accepted RC tag commit differs from recorded accepted commit.',
            'byte-identical-rc-artifact-promotion',
            'GH_TOKEN: ${{ github.token }}',
            'contents/resources/presets/01_ALL_GENRE.k500?ref=$acceptedCommit',
            'Could not resolve Mode 01 from the accepted RC commit.',
            'mode01NativeSha256 = $mode01AcceptedHash',
            'Stable staging changed accepted bytes:',
            'target_commitish: ${{ steps.accept.outputs.accepted_commit }}',
            'prerelease: false',
            'make_latest: true',
            'overwrite_files: false'
          )) {
            if (-not $promotionWorkflow.Contains($token)) { throw "Updater stable promotion contract missing '$token'" }
          }

          foreach ($token in @(
            'name: Windows Updater Release Candidate',
            'workflow_dispatch:',
            'Updater RC must be dispatched from main.',
            'P4 updater RC requires source version 1.1.0',
            'Exact-head gate PASS:',
            'stableReleaseEligible = $false',
            "installerTechnology = 'Inno Setup 6'",
            "installerScopes = @('machine','user')",
            "migration = 'explicit-machine-to-user'",
            'Windows-Setup-PerUser.exe',
            'prerelease: true',
            'make_latest: false',
            'overwrite_files: false'
          )) {
            if (-not $rcWorkflow.Contains($token)) { throw "Updater RC workflow contract missing '$token'" }
          }

          foreach ($token in @(
            'DefaultDirName={autopf}\{#AppName}',
            'PrivilegesRequired=admin',
            'UsePreviousAppDir=no',
            'MIGRATE_LOCALAPPDATA_INSTALL_V1'
          )) {
            if (-not $installer.Contains($token)) { throw "Stable installer lifecycle contract missing '$token'" }
          }
          foreach ($token in @(
            'release-manifest.json',
            'SHA256SUMS.txt',
            'QCryptographicHash::Sha256',
            'ShellExecuteExW',
            'stableReleaseEligible',
            'windows-x64',
            'P4_RC_CANDIDATE_CHANNEL_V1',
            '--update-candidate=',
            'updater-rc-manifest.json',
            'Candidate manifest does not match the requested updater RC.'
          )) {
            if (-not $updater.Contains($token)) { throw "Smart updater contract missing '$token'" }
          }

          $mode01Path = 'resources/presets/01_ALL_GENRE.k500'
          $mode01Hash = (Get-FileHash $mode01Path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($mode01Hash -ne '4d1f2dd4f5431de1df1819931ecf65be4242e2bc9ae4e9dbabdbee3504004cf1') {
            throw "Official Mode 01 changed: $mode01Hash"
          }

          foreach ($token in @('P5_SUPPORT_DIAGNOSTICS_V1','supportReportJson','saveSupportReport','m_lastRxDiagnostic','m_lastTxDiagnostic')) {
            if (-not $deviceHeader.Contains($token)) { throw "Diagnostics API missing '$token'" }
          }
          foreach ($token in @('DiagnosticLogLimit = 240','activeMemoryIncluded','presetBytesIncluded','presetPathsIncluded','QSaveFile','protocolLog','P5_SUPPORT_REPORT_REDACTION_V1','[REDACTED ACTIVE MEMORY]','[REDACTED PRESET PAYLOAD]')) {
            if (-not $device.Contains($token)) { throw "Diagnostics privacy/schema regression: missing '$token'" }
          }
          if ($device.Contains('device.insert(QStringLiteral("lastTx"), m_lastTx);') -or $device.Contains('device.insert(QStringLiteral("lastRx"), m_lastRx);')) {
            throw 'Support report must not export raw lastTx/lastRx.'
          }
          foreach ($token in @('Save K500 support report','saveSupportReport(selectedFile)','Export bounded K500 diagnostics')) {
            if (-not $topbar.Contains($token)) { throw "Support UI regression: missing '$token'" }
          }

          Write-Host 'v1 public documentation, provenance, install/update lifecycle and stable release contracts PASS'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Activate MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl
          cmake --build build --config Release

      - name: Run stable preset regression suite
        shell: pwsh
        run: |
          & build/k500_p2_selftest.exe
          if ($LASTEXITCODE -ne 0) { throw 'P2 preset protocol self-test failed' }
          & build/k500_p3_selftest.exe
          if ($LASTEXITCODE -ne 0) { throw 'P3 codec self-test failed' }
          & build/k500_p32_corpus_test.exe tests/fixtures/donor-sample.k500
          if ($LASTEXITCODE -ne 0) { throw 'P3.2 donor corpus failed' }
          & build/k500_p34_edit_persistence_test.exe tests/fixtures/donor-sample.k500
          if ($LASTEXITCODE -ne 0) { throw 'P3.4 donor persistence failed' }
          & build/k500_p42_batch_test.exe tests/fixtures/donor-sample.k500
          if ($LASTEXITCODE -ne 0) { throw 'P4.2 donor batch failed' }

      - name: Deploy and run runtime smoke tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/SONKUPIK-STUDIO-Native-UI.exe package/SonKuPik-K500.exe
          Copy-Item build/SonKuPik-K500-Updater.exe package/SonKuPik-K500-Updater.exe
          $helperTest = Start-Process -FilePath 'package/SonKuPik-K500-Updater.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($helperTest.ExitCode -ne 0) { throw "Native updater coordinator self-test failed: $($helperTest.ExitCode)" }
          Copy-Item LICENSE package/
          windeployqt --release --qmldir qml package/SonKuPik-K500.exe
          foreach ($arg in @('--font-self-test','--protocol-self-test','--engine-self-test')) {
            $p = Start-Process -FilePath 'package/SonKuPik-K500.exe' -ArgumentList $arg -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Runtime $arg failed with exit code $($p.ExitCode)" }
          }
